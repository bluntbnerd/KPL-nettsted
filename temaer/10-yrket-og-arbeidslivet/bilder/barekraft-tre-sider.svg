<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" font-family="Segoe UI, Arial, sans-serif">
  <title>Tre sirkler som overlapper: miljø, økonomi og samfunn. Der alle tre møtes, står bærekraftig.</title>
  <rect x="0" y="0" width="520" height="400" rx="10" fill="#ffffff"/>
  <circle cx="190" cy="150" r="115" fill="#3a9d5d" fill-opacity="0.22" stroke="#2e7d4a" stroke-width="2"/>
  <circle cx="330" cy="150" r="115" fill="#2f6fb0" fill-opacity="0.22" stroke="#2f6fb0" stroke-width="2"/>
  <circle cx="260" cy="265" r="115" fill="#e08e2b" fill-opacity="0.22" stroke="#b86e16" stroke-width="2"/>
  <g font-size="17" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="140" y="110">Miljø</text>
    <text x="380" y="110">Økonomi</text>
    <text x="260" y="330">Samfunn</text>
  </g>
  <g font-size="13" fill="#1c2828" text-anchor="middle">
    <text x="140" y="132">lite utslipp</text>
    <text x="140" y="149">lite energi og</text>
    <text x="140" y="166">råstoff</text>
    <text x="380" y="132">lønnsom drift</text>
    <text x="380" y="149">gode produkter</text>
    <text x="380" y="166">til riktig pris</text>
    <text x="260" y="352">trygge jobber, helse</text>
    <text x="260" y="369">og et godt lokalsamfunn</text>
  </g>
  <text x="260" y="195" font-size="13" font-weight="bold" fill="#1c2828" text-anchor="middle">bærekraftig</text>
</svg>
