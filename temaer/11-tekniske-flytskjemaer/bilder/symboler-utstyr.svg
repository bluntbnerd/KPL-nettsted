<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" width="800" height="630" font-family="Segoe UI, Arial, sans-serif">
  <title>Vanlige symboler i prosessflytskjema: lukket tank, åpen tank, kolonne med fyllmasse, destillasjonskolonne, reaktor med omrører og kappe, blandetank, kompressor, varmeveksler, sentrifugalpumpe, ventil, reguleringsventil og rør med strømningsretning.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="630" rx="10" fill="#ffffff"/>

  <!-- rutenett -->
  <g stroke="#e3e8e8" stroke-width="1.5">
    <line x1="200" y1="10" x2="200" y2="620"/>
    <line x1="400" y1="10" x2="400" y2="620"/>
    <line x1="600" y1="10" x2="600" y2="620"/>
    <line x1="10" y1="210" x2="790" y2="210"/>
    <line x1="10" y1="420" x2="790" y2="420"/>
  </g>

  <g fill="none" stroke="#1c2828" stroke-width="2.5">
    <!-- 1 lukket tank -->
    <rect x="70" y="25" width="60" height="125" rx="30" ry="16"/>
    <!-- 2 åpen tank -->
    <path d="M270,30 L270,150 L330,150 L330,30"/>
    <!-- 3 kolonne med fyllmasse -->
    <rect x="475" y="20" width="50" height="135" rx="25" ry="12"/>
    <rect x="475" y="58" width="50" height="58"/>
    <path d="M475,58 L525,116 M525,58 L475,116"/>
    <!-- 4 destillasjonskolonne -->
    <rect x="675" y="20" width="50" height="135" rx="25" ry="12"/>
  </g>
  <g stroke="#1c2828" stroke-width="1.5" stroke-dasharray="5 3">
    <line x1="675" y1="50" x2="712" y2="50"/>
    <line x1="688" y1="75" x2="725" y2="75"/>
    <line x1="675" y1="100" x2="712" y2="100"/>
    <line x1="688" y1="125" x2="725" y2="125"/>
  </g>

  <g fill="none" stroke="#1c2828" stroke-width="2.5">
    <!-- 5 reaktor med omrører og kappe -->
    <rect x="70" y="232" width="60" height="115" rx="30" ry="15"/>
    <path d="M60,265 L60,335 A40,24 0 0 0 140,335 L140,265"/>
    <line x1="100" y1="218" x2="100" y2="318"/>
    <!-- 6 blandetank (mikser) -->
    <path d="M268,240 L268,310 A32,28 0 0 0 332,310 L332,240"/>
    <path d="M286,262 L300,282 L314,262 M300,282 L300,315"/>
    <line x1="300" y1="225" x2="300" y2="262"/>
    <!-- 7 kompressor -->
    <path d="M470,240 L470,345 L530,318 L530,267 Z"/>
    <!-- 8 varmeveksler -->
    <circle cx="700" cy="290" r="34"/>
    <path d="M660,290 L682,290 L690,272 L700,310 L710,274 L718,290 L740,290"/>
  </g>
  <g fill="#1c2828">
    <ellipse cx="91" cy="318" rx="9" ry="5"/>
    <ellipse cx="109" cy="318" rx="9" ry="5"/>
  </g>

  <g fill="none" stroke="#1c2828" stroke-width="2.5">
    <!-- 9 sentrifugalpumpe -->
    <circle cx="100" cy="500" r="30"/>
    <path d="M80,524 L68,545 L132,545 L120,524"/>
  </g>
  <g stroke="#1c2828" stroke-width="2.5" fill="none" marker-end="url(#pil)">
    <line x1="40" y1="500" x2="97" y2="500"/>
    <line x1="100" y1="470" x2="152" y2="470"/>
  </g>
  <g fill="#ffffff" stroke="#1c2828" stroke-width="2.5">
    <!-- 10 ventil -->
    <path d="M270,485 L330,515 L330,485 L270,515 Z"/>
    <!-- 11 reguleringsventil -->
    <path d="M470,485 L530,515 L530,485 L470,515 Z"/>
  </g>
  <g stroke="#1c2828" stroke-width="2.5">
    <line x1="240" y1="500" x2="270" y2="500"/>
    <line x1="330" y1="500" x2="360" y2="500"/>
    <line x1="440" y1="500" x2="470" y2="500"/>
    <line x1="530" y1="500" x2="560" y2="500"/>
    <line x1="500" y1="500" x2="500" y2="465"/>
  </g>
  <path d="M482,465 A18,18 0 0 1 518,465 Z" fill="#ffffff" stroke="#1c2828" stroke-width="2.5"/>
  <!-- 12 rør med strømningsretning -->
  <line x1="635" y1="500" x2="765" y2="500" stroke="#1c2828" stroke-width="2.5" marker-end="url(#pil)"/>

  <!-- navn -->
  <g font-size="15" fill="#1c2828" text-anchor="middle">
    <text x="100" y="183">Tank (lukket)</text>
    <text x="300" y="183">Tank (åpen)</text>
    <text x="500" y="183">Kolonne med</text>
    <text x="500" y="200">fyllmasse</text>
    <text x="700" y="183">Destillasjons-</text>
    <text x="700" y="200">kolonne</text>

    <text x="100" y="385">Reaktor med</text>
    <text x="100" y="402">omrører og kappe</text>
    <text x="300" y="385">Blandetank</text>
    <text x="300" y="402">(mikser)</text>
    <text x="500" y="385">Kompressor</text>
    <text x="700" y="385">Varmeveksler</text>

    <text x="100" y="585">Sentrifugalpumpe</text>
    <text x="300" y="585">Ventil</text>
    <text x="500" y="585">Reguleringsventil</text>
    <text x="700" y="585">Rør med</text>
    <text x="700" y="602">strømningsretning</text>
  </g>
</svg>
