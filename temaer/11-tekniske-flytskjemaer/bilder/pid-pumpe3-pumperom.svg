<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Arial, sans-serif">
  <title>Forenklet utsnitt av P&amp;ID-en for pumperommet: linja fra tank 3 gjennom pumpe 3 til tank 1. Sugeledningen W-12101-150-16 kommer fra tank 3. Røret går gjennom en overgang, stengeventilen V-12030 og strømningsvakten FZ 12073 til pumpa P-12003 med motor. Etter pumpa sitter trykkindikatoren PI 12066 og stengeventilen V-12031. Røret W-12133-80-16 går til reguleringsventilen LCV-12032, som styres av LIC, og videre ned i tank 1 (T-12051). Tank 1 har nivågiveren LT 12075, nivåbryterne LZ 12076 (høyt-høyt) og LZ 12078 (lavt) og nivåalarmen LA 12077 (høyt). Fra bunnen av tank 1 går et rør med ventilen V-12050 tilbake til tank 3.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" rx="10" fill="#ffffff"/>

  <!-- rør -->
  <g stroke="#1c2828" stroke-width="2.5" fill="none">
    <path d="M20,440 L200,440 L200,416"/>
    <line x1="200" y1="404" x2="200" y2="398"/>
    <line x1="200" y1="372" x2="200" y2="314"/>
    <line x1="200" y1="266" x2="200" y2="208"/>
    <path d="M200,182 L200,80 L405,80"/>
    <path d="M435,80 L620,80 L620,138" marker-end="url(#pil)"/>
    <line x1="620" y1="360" x2="620" y2="392"/>
    <line x1="620" y1="418" x2="620" y2="455" marker-end="url(#pil)"/>
  </g>
  <g font-size="11" fill="#1c2828">
    <text x="22" y="432">W-12101-150-16 (fra tank 3)</text>
    <text x="250" y="72">W-12133-80-16</text>
    <text x="630" y="452">Til tank 3</text>
  </g>

  <!-- overgang (reduksjon) -->
  <path d="M193,416 L207,416 L204,404 L196,404 Z" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>

  <!-- stengeventiler (loddrette) -->
  <g fill="#ffffff" stroke="#1c2828" stroke-width="2">
    <path d="M190,372 L210,372 L190,398 L210,398 Z"/>
    <path d="M190,182 L210,182 L190,208 L210,208 Z"/>
    <path d="M610,392 L630,392 L610,418 L630,418 Z"/>
  </g>
  <g font-size="11" fill="#1c2828">
    <text x="150" y="390" text-anchor="end">V-12030</text>
    <text x="150" y="200" text-anchor="end">V-12031</text>
    <text x="638" y="409">V-12050</text>
  </g>

  <!-- pumpe med motor -->
  <circle cx="200" cy="290" r="24" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <path d="M191,298 L209,298 L200,280 Z" fill="#586868"/>
  <line x1="162" y1="290" x2="176" y2="290" stroke="#1c2828" stroke-width="2"/>
  <circle cx="148" cy="290" r="14" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <text x="148" y="295" font-size="13" fill="#1c2828" text-anchor="middle" font-weight="bold">M</text>
  <text x="148" y="326" font-size="12" fill="#1c2828" text-anchor="middle">P-12003</text>

  <!-- tank 1 -->
  <rect x="560" y="140" width="120" height="220" rx="12" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <text x="620" y="245" font-size="14" fill="#1c2828" text-anchor="middle" font-weight="bold">Tank 1</text>
  <text x="620" y="263" font-size="12" fill="#1c2828" text-anchor="middle">T-12051</text>

  <!-- reguleringsventil -->
  <path d="M405,70 L435,90 L435,70 L405,90 Z" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="420" y1="80" x2="420" y2="62" stroke="#1c2828" stroke-width="1.5"/>
  <path d="M408,62 A12,12 0 0 1 432,62 Z" fill="#ffffff" stroke="#1c2828" stroke-width="1.5"/>
  <text x="440" y="56" font-size="11" fill="#1c2828">FO</text>
  <text x="400" y="106" font-size="11" fill="#1c2828" text-anchor="end">LCV-12032</text>

  <!-- tilkoblinger til instrumenter -->
  <g stroke="#1c2828" stroke-width="1.5">
    <line x1="200" y1="345" x2="242" y2="345"/>
    <line x1="200" y1="235" x2="242" y2="235"/>
    <line x1="680" y1="170" x2="722" y2="170"/>
    <line x1="680" y1="215" x2="722" y2="215"/>
    <line x1="680" y1="320" x2="722" y2="320"/>
    <line x1="518" y1="320" x2="560" y2="320"/>
  </g>
  <!-- signallinjer -->
  <g stroke="#1c2828" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <line x1="420" y1="142" x2="420" y2="92"/>
    <path d="M500,302 L500,160 L438,160"/>
  </g>

  <!-- instrumentsymboler -->
  <g fill="#ffffff" stroke="#1c2828" stroke-width="1.5">
    <circle cx="260" cy="345" r="18"/>
    <circle cx="260" cy="235" r="18"/>
    <circle cx="500" cy="320" r="18"/>
    <circle cx="740" cy="170" r="18"/>
    <circle cx="740" cy="215" r="18"/>
    <circle cx="740" cy="320" r="18"/>
  </g>
  <g font-size="10" fill="#1c2828" text-anchor="middle">
    <text x="260" y="342">FZ</text><text x="260" y="353">12073</text>
    <text x="260" y="232">PI</text><text x="260" y="243">12066</text>
    <text x="500" y="317">LT</text><text x="500" y="328">12075</text>
    <text x="740" y="167">LZ</text><text x="740" y="178">12076</text>
    <text x="740" y="212">LA</text><text x="740" y="223">12077</text>
    <text x="740" y="317">LZ</text><text x="740" y="328">12078</text>
  </g>
  <!-- LIC: funksjon i styresystemet (sirkel i firkant med vannrett strek) -->
  <rect x="402" y="142" width="36" height="36" fill="#ffffff" stroke="#1c2828" stroke-width="1.5"/>
  <circle cx="420" cy="160" r="18" fill="#ffffff" stroke="#1c2828" stroke-width="1.5"/>
  <line x1="402" y1="160" x2="438" y2="160" stroke="#1c2828" stroke-width="1.5"/>
  <text x="420" y="156" font-size="10" fill="#1c2828" text-anchor="middle">LIC</text>

  <g font-size="11" fill="#1c2828" font-weight="bold" text-anchor="middle">
    <text x="221" y="339">LL</text>
    <text x="701" y="164">HH</text>
    <text x="701" y="209">H</text>
    <text x="701" y="314">L</text>
  </g>

  <!-- signaler til sikkerhetssystemet og alarmsystemet -->
  <g stroke="#1c2828" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <line x1="278" y1="345" x2="320" y2="345"/>
    <line x1="758" y1="170" x2="795" y2="170"/>
    <line x1="758" y1="215" x2="795" y2="215"/>
    <line x1="758" y1="320" x2="795" y2="320"/>
  </g>
  <g font-size="10" fill="#1c2828">
    <text x="324" y="349">til forrigling</text>
    <text x="799" y="174">til forrigling</text>
    <text x="799" y="219">til alarm</text>
    <text x="799" y="324">til alarm</text>
  </g>
</svg>
