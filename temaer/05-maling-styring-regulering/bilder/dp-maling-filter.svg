<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Et prosessrør med et filter. En differansetrykkgiver over røret er koblet til røret før filteret (høy side, pluss) og etter filteret (lav side, minus). Begge impulsrørene har en instrumentventil. Giveren sender signal til kontrollrommet.</title>
  <rect x="0" y="0" width="620" height="300" rx="10" fill="#ffffff"/>

  <!-- Prosessrør med filter -->
  <line x1="20" y1="230" x2="600" y2="230" stroke="#8a9a9a" stroke-width="18"/>
  <polygon points="560,222 576,230 560,238" fill="#ffffff"/>
  <rect x="278" y="204" width="44" height="52" fill="#f6f8f8" stroke="#1c2828" stroke-width="2.5"/>
  <g stroke="#8a9a9a" stroke-width="1.2">
    <line x1="282" y1="210" x2="318" y2="250"/>
    <line x1="282" y1="226" x2="304" y2="250"/>
    <line x1="296" y1="210" x2="318" y2="234"/>
  </g>
  <text x="300" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">filter</text>
  <text x="90" y="262" font-size="13" text-anchor="middle" fill="#586868">prosessrør</text>

  <!-- Impulsrør -->
  <g stroke="#586868" stroke-width="4" fill="none">
    <polyline points="170,221 170,112 282,112 282,102"/>
    <polyline points="430,221 430,112 318,112 318,102"/>
  </g>

  <!-- Instrumentventiler -->
  <polygon points="158,148 182,148 170,160" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <polygon points="158,172 182,172 170,160" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="170" y1="160" x2="190" y2="160" stroke="#1c2828" stroke-width="2"/>
  <line x1="190" y1="152" x2="190" y2="168" stroke="#1c2828" stroke-width="3"/>
  <polygon points="418,148 442,148 430,160" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <polygon points="418,172 442,172 430,160" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="430" y1="160" x2="410" y2="160" stroke="#1c2828" stroke-width="2"/>
  <line x1="410" y1="152" x2="410" y2="168" stroke="#1c2828" stroke-width="3"/>

  <!-- Differansetrykkgiver -->
  <rect x="262" y="48" width="76" height="54" rx="6" fill="#f6f8f8" stroke="#1c2828" stroke-width="2.5"/>
  <rect x="276" y="60" width="48" height="16" rx="2" fill="#1c2828"/>
  <text x="300" y="72" font-size="10" text-anchor="middle" fill="#7fd0e0">0,35 bar</text>
  <g font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="276" y="97">+</text>
    <text x="324" y="97">−</text>
  </g>
  <text x="300" y="36" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">differansetrykkgiver</text>

  <!-- Signal -->
  <line x1="338" y1="70" x2="590" y2="70" stroke="#b5530f" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="582,64 594,70 582,76" fill="#b5530f"/>
  <text x="500" y="60" font-size="12" text-anchor="middle" fill="#b5530f">signal til kontrollrommet</text>

  <!-- Forklaringer -->
  <g font-size="13" fill="#1c2828">
    <text x="150" y="118" text-anchor="end" font-weight="bold">høy side (+)</text>
    <text x="150" y="134" text-anchor="end">trykket før filteret</text>
    <text x="150" y="164" text-anchor="end">instrumentventil</text>
    <text x="150" y="196" text-anchor="end">impulsrør</text>
    <text x="450" y="118" font-weight="bold">lav side (−)</text>
    <text x="450" y="134">trykket etter filteret</text>
  </g>
</svg>
