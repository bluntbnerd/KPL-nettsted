<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>Graf som viser sammenhengen mellom strømmen i mA og måleverdien i prosent av måleområdet. 4 mA er 0 prosent og 20 mA er 100 prosent. Under ca. 3,6 mA og over ca. 21 mA er det signalfeil.</title>
  <rect x="0" y="0" width="640" height="330" rx="10" fill="#ffffff"/>

  <!-- Feilsoner -->
  <rect x="70" y="40" width="85" height="220" fill="#fbe3e0"/>
  <rect x="566" y="40" width="24" height="220" fill="#fbe3e0"/>
  <text x="112" y="84" font-size="12" text-anchor="middle" fill="#a3281c">signalfeil</text>
  <text x="112" y="100" font-size="11" text-anchor="middle" fill="#a3281c">(for eksempel</text>
  <text x="112" y="114" font-size="11" text-anchor="middle" fill="#a3281c">brudd: 0 mA)</text>
  <text x="582" y="150" font-size="12" text-anchor="middle" fill="#a3281c" transform="rotate(-90 582 150)">signalfeil</text>

  <!-- Hjelpelinjer -->
  <g stroke="#d6e0e0" stroke-width="1">
    <line x1="70" y1="207.5" x2="590" y2="207.5"/>
    <line x1="70" y1="155" x2="590" y2="155"/>
    <line x1="70" y1="102.5" x2="590" y2="102.5"/>
    <line x1="70" y1="50" x2="590" y2="50"/>
    <line x1="164.5" y1="40" x2="164.5" y2="260"/>
    <line x1="259.1" y1="40" x2="259.1" y2="260"/>
    <line x1="353.6" y1="40" x2="353.6" y2="260"/>
    <line x1="448.2" y1="40" x2="448.2" y2="260"/>
    <line x1="542.7" y1="40" x2="542.7" y2="260"/>
  </g>

  <!-- Akser -->
  <line x1="70" y1="260" x2="595" y2="260" stroke="#1c2828" stroke-width="2"/>
  <line x1="70" y1="265" x2="70" y2="35" stroke="#1c2828" stroke-width="2"/>

  <!-- Tall på x-aksen -->
  <g font-size="12" text-anchor="middle" fill="#1c2828">
    <text x="70" y="278">0</text>
    <text x="164.5" y="278">4</text>
    <text x="259.1" y="278">8</text>
    <text x="353.6" y="278">12</text>
    <text x="448.2" y="278">16</text>
    <text x="542.7" y="278">20</text>
  </g>
  <text x="330" y="304" font-size="13" text-anchor="middle" fill="#1c2828">strøm fra giveren (mA)</text>

  <!-- Tall på y-aksen -->
  <g font-size="12" text-anchor="end" fill="#1c2828">
    <text x="62" y="264">0 %</text>
    <text x="62" y="211.5">25 %</text>
    <text x="62" y="159">50 %</text>
    <text x="62" y="106.5">75 %</text>
    <text x="62" y="54">100 %</text>
  </g>
  <text x="20" y="150" font-size="13" text-anchor="middle" fill="#1c2828" transform="rotate(-90 20 150)">måleverdi (% av måleområdet)</text>

  <!-- Linja -->
  <line x1="164.5" y1="260" x2="542.7" y2="50" stroke="#b5530f" stroke-width="3"/>
  <g fill="#b5530f">
    <circle cx="164.5" cy="260" r="5"/>
    <circle cx="259.1" cy="207.5" r="5"/>
    <circle cx="353.6" cy="155" r="5"/>
    <circle cx="448.2" cy="102.5" r="5"/>
    <circle cx="542.7" cy="50" r="5"/>
  </g>

  <!-- Eksempel 12 mA = 50 % -->
  <line x1="353.6" y1="260" x2="353.6" y2="155" stroke="#1c6e8c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="70" y1="155" x2="353.6" y2="155" stroke="#1c6e8c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="362" y="176" font-size="12" fill="#1c6e8c">12 mA = 50 %</text>

  <text x="210" y="254" font-size="12" fill="#1c2828">4 mA = 0 %</text>
  <text x="534" y="44" font-size="12" text-anchor="end" fill="#1c2828">20 mA = 100 %</text>
</svg>
