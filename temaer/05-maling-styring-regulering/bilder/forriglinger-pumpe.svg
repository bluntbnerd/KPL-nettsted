<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="Segoe UI, Arial, sans-serif">
  <title>En pumpe som pumper fra tank 1 til tank 2, med tre forriglinger: lav-lav nivå i tank 1, høy-høy nivå i tank 2 og endebryter på ventilen på sugesiden. Alle sender signal til styringen, som kan stoppe pumpa eller hindre at den starter.</title>
  <rect x="0" y="0" width="640" height="310" rx="10" fill="#ffffff"/>

  <!-- Tank 1 (50 %) -->
  <rect x="62" y="150" width="116" height="88" fill="#2a7a9a" opacity="0.18"/>
  <line x1="62" y1="150" x2="178" y2="150" stroke="#2a7a9a" stroke-width="2"/>
  <rect x="60" y="60" width="120" height="180" rx="10" fill="none" stroke="#1c2828" stroke-width="3"/>
  <text x="120" y="50" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">tank 1</text>
  <line x1="62" y1="222" x2="178" y2="222" stroke="#b5530f" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="70" y="200" font-size="11" font-weight="bold" fill="#1c2828">lav-lav, 10 %</text>
  <text x="70" y="214" font-size="11" fill="#b5530f">stopper pumpa</text>
  <circle cx="180" cy="222" r="8" fill="#ffffff" stroke="#b5530f" stroke-width="2.5"/>

  <!-- Tank 2 (30 %) -->
  <rect x="502" y="186" width="116" height="52" fill="#2a7a9a" opacity="0.18"/>
  <line x1="502" y1="186" x2="618" y2="186" stroke="#2a7a9a" stroke-width="2"/>
  <rect x="500" y="60" width="120" height="180" rx="10" fill="none" stroke="#1c2828" stroke-width="3"/>
  <text x="590" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">tank 2</text>
  <line x1="502" y1="78" x2="618" y2="78" stroke="#b5530f" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="512" y="96" font-size="11" font-weight="bold" fill="#1c2828">høy-høy, 90 %</text>
  <text x="512" y="110" font-size="11" fill="#b5530f">stopper pumpa</text>
  <circle cx="500" cy="78" r="8" fill="#ffffff" stroke="#b5530f" stroke-width="2.5"/>

  <!-- Rør: tank 1 → ventil → pumpe → tank 2 -->
  <polyline points="120,240 120,270 216,270" fill="none" stroke="#8a9a9a" stroke-width="8"/>
  <line x1="244" y1="270" x2="304" y2="270" stroke="#8a9a9a" stroke-width="8"/>
  <polyline points="336,270 440,270 440,36 540,36 540,58" fill="none" stroke="#8a9a9a" stroke-width="8"/>

  <!-- Ventil på sugesiden med endebryter -->
  <polygon points="216,260 230,270 216,280" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <polygon points="244,260 230,270 244,280" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="230" y1="270" x2="230" y2="252" stroke="#1c2828" stroke-width="2"/>
  <rect x="222" y="240" width="16" height="12" fill="#ffffff" stroke="#b5530f" stroke-width="2"/>
  <text x="230" y="298" font-size="11" text-anchor="middle" fill="#1c2828">ventil med endebryter</text>

  <!-- Pumpe -->
  <circle cx="320" cy="270" r="16" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <polygon points="314,261 330,270 314,279" fill="#1c2828"/>
  <text x="340" y="298" font-size="11" fill="#1c2828">pumpe</text>

  <!-- Styringen -->
  <rect x="250" y="118" width="150" height="60" rx="8" fill="#1c2828"/>
  <text x="325" y="142" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Styringen</text>
  <text x="325" y="162" font-size="12" text-anchor="middle" fill="#7fd0e0">forriglinger</text>

  <!-- Signaler (stiplet) -->
  <g stroke="#b5530f" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <polyline points="188,222 205,222 205,138 250,138"/>
    <polyline points="230,240 230,162 250,162"/>
    <polyline points="492,78 420,78 420,148 400,148"/>
    <line x1="325" y1="178" x2="325" y2="248"/>
  </g>
  <polygon points="243,133 251,138 243,143" fill="#b5530f"/>
  <polygon points="243,157 251,162 243,167" fill="#b5530f"/>
  <polygon points="408,143 400,148 408,153" fill="#b5530f"/>
  <polygon points="320,244 325,252 330,244" fill="#b5530f"/>
  <text x="332" y="222" font-size="11" fill="#b5530f">stopp / hindrer start</text>
  <text x="236" y="200" font-size="11" fill="#586868">«åpen»</text>
</svg>
