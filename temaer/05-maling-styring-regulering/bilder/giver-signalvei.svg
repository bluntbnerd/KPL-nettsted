<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="Segoe UI, Arial, sans-serif">
  <title>Veien fra måling til skjerm: en føler i et prosessrør, en giver på toppen av føleren, en kabel med signal til styresystemet og et nettverk videre til skjermen i kontrollrommet</title>
  <rect x="0" y="0" width="680" height="240" rx="10" fill="#ffffff"/>

  <!-- Prosessrør -->
  <line x1="20" y1="190" x2="220" y2="190" stroke="#8a9a9a" stroke-width="18"/>
  <polygon points="186,182 202,190 186,198" fill="#ffffff"/>
  <text x="120" y="225" font-size="13" text-anchor="middle" fill="#586868">prosessrør</text>

  <!-- 1 Føler -->
  <rect x="104" y="130" width="12" height="64" fill="#586868"/>
  <text x="96" y="165" font-size="13" font-weight="bold" text-anchor="end" fill="#1c2828">1 føler</text>

  <!-- 2 Giver -->
  <rect x="80" y="74" width="60" height="56" rx="6" fill="#f6f8f8" stroke="#1c2828" stroke-width="2.5"/>
  <rect x="88" y="84" width="44" height="16" rx="2" fill="#1c2828"/>
  <text x="110" y="96" font-size="11" text-anchor="middle" fill="#7fd0e0">65,2</text>
  <text x="110" y="60" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">2 giver</text>

  <!-- 3 Kabel -->
  <line x1="140" y1="104" x2="320" y2="104" stroke="#b5530f" stroke-width="2"/>
  <line x1="140" y1="112" x2="320" y2="112" stroke="#b5530f" stroke-width="2"/>
  <text x="230" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#b5530f">3 kabel med signal</text>
  <text x="230" y="132" font-size="12" text-anchor="middle" fill="#b5530f">(ofte også strøm til giveren)</text>

  <!-- 4 Styresystem -->
  <rect x="320" y="74" width="130" height="64" rx="8" fill="#eef4f4" stroke="#1c2828" stroke-width="2"/>
  <text x="385" y="102" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">4 styresystem</text>
  <text x="385" y="122" font-size="12" text-anchor="middle" fill="#1c2828">(for eksempel PLS)</text>

  <!-- Nettverk -->
  <line x1="450" y1="106" x2="520" y2="106" stroke="#586868" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="485" y="96" font-size="11" text-anchor="middle" fill="#586868">nettverk</text>

  <!-- 5 Skjerm -->
  <rect x="520" y="60" width="140" height="92" rx="6" fill="#1c2828"/>
  <text x="590" y="92" font-size="13" text-anchor="middle" fill="#7fd0e0">TT-101</text>
  <text x="590" y="122" font-size="18" text-anchor="middle" fill="#ffffff">65,2 °C</text>
  <rect x="580" y="152" width="20" height="12" fill="#586868"/>
  <text x="590" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">5 skjerm i</text>
  <text x="590" y="203" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">kontrollrommet</text>
</svg>
