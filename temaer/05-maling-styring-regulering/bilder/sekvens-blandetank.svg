<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 585" width="640" height="585" font-family="Segoe UI, Arial, sans-serif">
  <title>Sekvens for en blandetank med åtte steg fra klar til ferdig. Mellom hvert steg står betingelsen som må være oppfylt før sekvensen går videre.</title>
  <rect x="0" y="0" width="640" height="585" rx="10" fill="#ffffff"/>

  <!-- Forklaring -->
  <rect x="400" y="14" width="226" height="64" rx="6" fill="#f2f6f6" stroke="#c8d4d4"/>
  <rect x="412" y="26" width="22" height="14" rx="3" fill="#1c2828"/>
  <text x="442" y="37" font-size="11" fill="#1c2828">steg: hva som skjer</text>
  <line x1="423" y1="50" x2="423" y2="68" stroke="#586868" stroke-width="2"/>
  <text x="442" y="63" font-size="11" fill="#b5530f">betingelse for å gå videre</text>

  <!-- Piler mellom stegene -->
  <g stroke="#586868" stroke-width="2">
    <line x1="175" y1="54" x2="175" y2="78"/>
    <line x1="175" y1="128" x2="175" y2="152"/>
    <line x1="175" y1="202" x2="175" y2="226"/>
    <line x1="175" y1="276" x2="175" y2="300"/>
    <line x1="175" y1="350" x2="175" y2="374"/>
    <line x1="175" y1="424" x2="175" y2="448"/>
    <line x1="175" y1="498" x2="175" y2="522"/>
  </g>
  <g fill="#586868">
    <polygon points="169,76 175,84 181,76"/>
    <polygon points="169,150 175,158 181,150"/>
    <polygon points="169,224 175,232 181,224"/>
    <polygon points="169,298 175,306 181,298"/>
    <polygon points="169,372 175,380 181,372"/>
    <polygon points="169,446 175,454 181,446"/>
    <polygon points="169,520 175,528 181,520"/>
  </g>
  <!-- Betingelser -->
  <g font-size="12" fill="#b5530f">
    <text x="190" y="73">operatøren trykker start</text>
    <text x="190" y="147">nivået er 60 %</text>
    <text x="190" y="221">mengdemåleren har talt 200 liter</text>
    <text x="190" y="295">temperaturen er 80 °C</text>
    <text x="190" y="369">30 minutter har gått</text>
    <text x="190" y="443">temperaturen er under 40 °C</text>
    <text x="190" y="517">nivået er 5 %</text>
  </g>

  <!-- Stegene -->
  <g>
    <rect x="30" y="10" width="290" height="44" rx="6" fill="#586868"/>
    <rect x="30" y="84" width="290" height="44" rx="6" fill="#1c2828"/>
    <rect x="30" y="158" width="290" height="44" rx="6" fill="#1c2828"/>
    <rect x="30" y="232" width="290" height="44" rx="6" fill="#1c2828"/>
    <rect x="30" y="306" width="290" height="44" rx="6" fill="#1c2828"/>
    <rect x="30" y="380" width="290" height="44" rx="6" fill="#1c2828"/>
    <rect x="30" y="454" width="290" height="44" rx="6" fill="#1c2828"/>
    <rect x="30" y="528" width="290" height="44" rx="6" fill="#586868"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#ffffff">
    <text x="44" y="28">0  Klar</text>
    <text x="44" y="102">1  Fyll råstoff A</text>
    <text x="44" y="176">2  Tilsett råstoff B</text>
    <text x="44" y="250">3  Varm opp</text>
    <text x="44" y="324">4  Hold temperaturen</text>
    <text x="44" y="398">5  Kjøl ned</text>
    <text x="44" y="472">6  Tøm tanken</text>
    <text x="44" y="546">7  Ferdig</text>
  </g>
  <g font-size="11.5" fill="#d8ecec">
    <text x="62" y="45">Alt står stille. Venter på start.</text>
    <text x="62" y="119">Ventil A åpner.</text>
    <text x="62" y="193">Ventil A stenger. Røreverk starter. Ventil B åpner.</text>
    <text x="62" y="267">Ventil B stenger. Regulator i auto styrer dampen.</text>
    <text x="62" y="341">Regulatoren holder 80 °C. Tiden telles.</text>
    <text x="62" y="415">Regulator av, dampen stenges. Kjølevann åpner.</text>
    <text x="62" y="489">Kjølevannet stenger. Pumpa starter.</text>
    <text x="62" y="563">Pumpa og røreverket stopper.</text>
  </g>
</svg>
