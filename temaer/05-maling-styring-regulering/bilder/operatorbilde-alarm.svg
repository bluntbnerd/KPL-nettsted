<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Segoe UI, Arial, sans-serif">
  <title>Et prosessbilde av et tankanlegg med en aktiv høynivåalarm, et betjeningsvindu for pumpa og en alarmliste</title>
  <rect x="0" y="0" width="680" height="430" rx="10" fill="#ffffff"/>

  <!-- Skjermramme -->
  <rect x="10" y="10" width="660" height="410" rx="8" fill="#1c2828"/>
  <rect x="20" y="20" width="640" height="390" fill="#d9dddd"/>
  <rect x="20" y="20" width="640" height="26" fill="#b9c0c0"/>
  <text x="32" y="38" font-size="13" font-weight="bold" fill="#1c2828">Tankanlegg – områdebilde</text>
  <text x="648" y="38" font-size="12" text-anchor="end" fill="#1c2828">Oversikt  ›  Tankanlegg</text>

  <!-- Rør inn med pumpe -->
  <line x1="30" y1="230" x2="180" y2="230" stroke="#6c7676" stroke-width="5"/>
  <line x1="180" y1="230" x2="180" y2="100" stroke="#6c7676" stroke-width="5"/>
  <line x1="180" y1="100" x2="210" y2="100" stroke="#6c7676" stroke-width="5"/>
  <circle cx="90" cy="230" r="16" fill="#3a4444" stroke="#1c2828" stroke-width="2.5"/>
  <polygon points="82,220 102,230 82,240" fill="#ffffff"/>
  <text x="90" y="262" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2828">P-101</text>
  <text x="90" y="277" font-size="11" text-anchor="middle" fill="#1c2828">går</text>

  <!-- Tank -->
  <rect x="210" y="80" width="110" height="180" rx="8" fill="#eef0f0" stroke="#1c2828" stroke-width="2.5"/>
  <rect x="212" y="105" width="106" height="153" fill="#9aa8ac"/>
  <text x="265" y="215" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">T-101</text>

  <!-- Nivåmåling i alarm -->
  <rect x="330" y="96" width="92" height="34" rx="4" fill="#ffffff" stroke="#e0a800" stroke-width="3"/>
  <text x="376" y="110" font-size="11" text-anchor="middle" fill="#1c2828">LI-101</text>
  <text x="376" y="125" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">86 %</text>
  <rect x="426" y="100" width="26" height="26" fill="#e0a800"/>
  <text x="439" y="118" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">H</text>

  <!-- Temperatur (normal) -->
  <rect x="330" y="150" width="92" height="34" rx="4" fill="#ffffff" stroke="#8a9494" stroke-width="1.5"/>
  <text x="376" y="164" font-size="11" text-anchor="middle" fill="#1c2828">TI-103</text>
  <text x="376" y="179" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">24 °C</text>

  <!-- Rør ut med stengt ventil -->
  <line x1="265" y1="260" x2="265" y2="290" stroke="#6c7676" stroke-width="5"/>
  <line x1="265" y1="290" x2="420" y2="290" stroke="#6c7676" stroke-width="5"/>
  <polygon points="300,280 330,300 330,280 300,300" fill="#d9dddd" stroke="#1c2828" stroke-width="2.5"/>
  <text x="315" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2828">V-102</text>
  <text x="352" y="306" font-size="11" fill="#1c2828">stengt</text>

  <!-- Betjeningsvindu for pumpa -->
  <rect x="470" y="62" width="176" height="210" rx="6" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <rect x="470" y="62" width="176" height="26" rx="6" fill="#3a4444"/>
  <rect x="470" y="80" width="176" height="8" fill="#3a4444"/>
  <text x="482" y="80" font-size="12.5" font-weight="bold" fill="#ffffff">P-101 Fødepumpe</text>
  <g font-size="12" fill="#1c2828">
    <text x="482" y="110">Status:</text>
    <text x="482" y="134">Driftsform:</text>
    <text x="482" y="158">Forrigling:</text>
  </g>
  <g font-size="12" font-weight="bold" fill="#1c2828">
    <text x="560" y="110">går</text>
    <text x="560" y="134">manuell</text>
    <text x="560" y="158">ingen aktiv</text>
  </g>
  <g fill="#eef0f0" stroke="#586868" stroke-width="1.5">
    <rect x="482" y="174" width="72" height="28" rx="4"/>
    <rect x="562" y="174" width="72" height="28" rx="4"/>
    <rect x="482" y="210" width="72" height="28" rx="4"/>
    <rect x="562" y="210" width="72" height="28" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1c2828">
    <text x="518" y="193">Start</text>
    <text x="598" y="193">Stopp</text>
    <text x="518" y="229">Auto</text>
    <text x="598" y="229">Manuell</text>
  </g>
  <text x="558" y="262" font-size="11" text-anchor="middle" fill="#586868">åpnes ved å klikke på pumpa</text>

  <!-- Alarmliste -->
  <rect x="30" y="322" width="620" height="80" fill="#ffffff" stroke="#8a9494" stroke-width="1"/>
  <rect x="30" y="322" width="620" height="22" fill="#b9c0c0"/>
  <g font-size="11.5" font-weight="bold" fill="#1c2828">
    <text x="40" y="337">Tid</text>
    <text x="120" y="337">Tag</text>
    <text x="210" y="337">Beskrivelse</text>
    <text x="450" y="337">Prioritet</text>
    <text x="540" y="337">Tilstand</text>
  </g>
  <rect x="31" y="346" width="618" height="26" fill="#fbe9a8"/>
  <rect x="31" y="346" width="6" height="26" fill="#e0a800"/>
  <g font-size="11.5" fill="#1c2828">
    <text x="44" y="364">03:12:40</text>
    <text x="120" y="364">LAH-101</text>
    <text x="210" y="364">Høyt nivå i tank T-101</text>
    <text x="450" y="364">middels</text>
    <text x="540" y="364" font-weight="bold">ny, ikke kvittert</text>
  </g>
  <g font-size="11.5" fill="#586868">
    <text x="44" y="392">02:58:05</text>
    <text x="120" y="392">TAL-205</text>
    <text x="210" y="392">Lav temperatur ut av varmeveksler</text>
    <text x="450" y="392">lav</text>
    <text x="540" y="392">kvittert, aktiv</text>
  </g>
</svg>
