<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Segoe UI, Arial, sans-serif">
  <title>Styring og regulering av lut til surt avløpsvann: øverst en doseringspumpe med fast innstilling uten måler, nederst en doseringspumpe styrt av en pH-regulator med pH-måler</title>

  <!-- ===== A: Styring (åpen sløyfe) ===== -->
  <g>
    <rect x="0" y="0" width="640" height="200" rx="10" fill="#ffffff" stroke="#c8d4d4" stroke-width="1.5"/>
    <text x="20" y="28" font-size="15" font-weight="bold" fill="#1c2828">Styring – åpen sløyfe</text>

    <!-- Rør med avløpsvann -->
    <line x1="20" y1="150" x2="620" y2="150" stroke="#8a9a9a" stroke-width="10"/>
    <polygon points="56,144 66,150 56,156" fill="#ffffff"/>
    <polygon points="586,144 596,150 586,156" fill="#ffffff"/>
    <text x="20" y="136" font-size="12" fill="#586868">surt avløpsvann inn</text>
    <text x="620" y="136" font-size="12" text-anchor="end" fill="#586868">vann ut</text>

    <!-- Lut og doseringspumpe -->
    <line x1="60" y1="80" x2="184" y2="80" stroke="#8a9a9a" stroke-width="5"/>
    <text x="60" y="70" font-size="12" fill="#586868">lut</text>
    <line x1="200" y1="96" x2="200" y2="145" stroke="#8a9a9a" stroke-width="5"/>
    <circle cx="200" cy="80" r="16" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
    <polygon points="194,71 210,80 194,89" fill="#1c2828"/>
    <text x="212" y="120" font-size="12" fill="#1c2828">doseringspumpe</text>

    <!-- Fast innstilling -->
    <rect x="330" y="48" width="200" height="64" rx="8" fill="#1c2828"/>
    <text x="430" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Fast innstilling</text>
    <text x="430" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#7fd0e0">Pumpa går på 50 %</text>

    <!-- Signal til pumpa -->
    <line x1="330" y1="80" x2="222" y2="80" stroke="#b5530f" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="226,75 218,80 226,85" fill="#b5530f"/>

    <text x="320" y="184" font-size="12" font-style="italic" text-anchor="middle" fill="#b5530f">Ingen måler: ingen sjekker om pH-en i vannet blir riktig.</text>
  </g>

  <!-- ===== B: Regulering (lukket sløyfe) ===== -->
  <g transform="translate(0,220)">
    <rect x="0" y="0" width="640" height="200" rx="10" fill="#ffffff" stroke="#c8d4d4" stroke-width="1.5"/>
    <text x="20" y="28" font-size="15" font-weight="bold" fill="#1c2828">Regulering – lukket sløyfe</text>

    <!-- Rør med avløpsvann -->
    <line x1="20" y1="150" x2="620" y2="150" stroke="#8a9a9a" stroke-width="10"/>
    <polygon points="56,144 66,150 56,156" fill="#ffffff"/>
    <polygon points="586,144 596,150 586,156" fill="#ffffff"/>
    <text x="20" y="136" font-size="12" fill="#586868">surt avløpsvann inn</text>
    <text x="620" y="136" font-size="12" text-anchor="end" fill="#586868">vann ut</text>

    <!-- Lut og doseringspumpe -->
    <line x1="60" y1="80" x2="184" y2="80" stroke="#8a9a9a" stroke-width="5"/>
    <text x="60" y="70" font-size="12" fill="#586868">lut</text>
    <line x1="200" y1="96" x2="200" y2="145" stroke="#8a9a9a" stroke-width="5"/>
    <circle cx="200" cy="80" r="16" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
    <polygon points="194,71 210,80 194,89" fill="#1c2828"/>
    <text x="212" y="120" font-size="12" fill="#1c2828">doseringspumpe</text>

    <!-- pH-regulator -->
    <rect x="300" y="36" width="190" height="88" rx="8" fill="#1c2828"/>
    <text x="395" y="56" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">pH-regulator</text>
    <g font-size="13" fill="#e8f4f4">
      <text x="312" y="78">Settpunkt</text>
      <text x="312" y="96">Måleverdi</text>
      <text x="312" y="114">Ut til pumpa</text>
    </g>
    <g font-size="13" font-weight="bold" fill="#7fd0e0" text-anchor="end">
      <text x="478" y="78">pH 7,0</text>
      <text x="478" y="96">pH 6,8</text>
      <text x="478" y="114">55 %</text>
    </g>

    <!-- Signal til pumpa -->
    <line x1="300" y1="80" x2="222" y2="80" stroke="#b5530f" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="226,75 218,80 226,85" fill="#b5530f"/>

    <!-- pH-måler etter innblandingen -->
    <line x1="540" y1="118" x2="540" y2="145" stroke="#586868" stroke-width="2.5"/>
    <circle cx="540" cy="104" r="14" fill="#ffffff" stroke="#b5530f" stroke-width="2.5"/>
    <text x="540" y="109" font-size="11" font-weight="bold" text-anchor="middle" fill="#b5530f">pH</text>
    <text x="558" y="100" font-size="11" fill="#1c2828">pH-måler</text>

    <!-- Signal tilbake til regulatoren -->
    <polyline points="540,90 540,60 498,60" fill="none" stroke="#b5530f" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="498,55 490,60 498,65" fill="#b5530f"/>

    <text x="320" y="184" font-size="12" font-style="italic" text-anchor="middle" fill="#b5530f">Måleren sender resultatet tilbake, og regulatoren retter opp.</text>
  </g>
</svg>
