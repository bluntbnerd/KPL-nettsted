<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Prinsippskisse av en piezoresistiv trykkmåler: trykket bøyer en membran med små motstander på, og elektronikken gjør endringen i motstand om til et signal</title>
  <rect x="0" y="0" width="620" height="300" rx="10" fill="#ffffff"/>

  <!-- Hus -->
  <rect x="180" y="40" width="240" height="160" rx="12" fill="#f6f8f8" stroke="#586868" stroke-width="3"/>
  <!-- Tilkobling til prosessen -->
  <rect x="270" y="198" width="60" height="62" fill="#2a7a9a" opacity="0.15"/>
  <line x1="270" y1="200" x2="270" y2="260" stroke="#586868" stroke-width="3"/>
  <line x1="330" y1="200" x2="330" y2="260" stroke="#586868" stroke-width="3"/>
  <!-- Kammer under membranen -->
  <path d="M205,152 Q300,117 395,152 L395,198 L205,198 Z" fill="#2a7a9a" opacity="0.15"/>

  <!-- Trykkpiler -->
  <g fill="#2a7a9a" stroke="#2a7a9a" stroke-width="3">
    <line x1="282" y1="250" x2="282" y2="176"/><polygon points="276,178 282,166 288,178" stroke="none"/>
    <line x1="300" y1="250" x2="300" y2="166"/><polygon points="294,168 300,156 306,168" stroke="none"/>
    <line x1="318" y1="250" x2="318" y2="176"/><polygon points="312,178 318,166 324,178" stroke="none"/>
  </g>

  <!-- Membranens stilling uten trykk -->
  <line x1="205" y1="150" x2="395" y2="150" stroke="#8a9a9a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Innspenning -->
  <rect x="190" y="140" width="16" height="20" fill="#586868"/>
  <rect x="394" y="140" width="16" height="20" fill="#586868"/>
  <!-- Membran (bøyd av trykket) -->
  <path d="M205,150 Q300,115 395,150" fill="none" stroke="#1c2828" stroke-width="4"/>

  <!-- Motstander på membranen -->
  <g fill="none" stroke="#b5530f" stroke-width="2.5" stroke-linejoin="round">
    <polyline points="236,134 240,128 245,134 250,128 255,134 260,128 264,134"/>
    <polyline points="336,134 340,128 345,134 350,128 355,134 360,128 364,134"/>
  </g>

  <!-- Ledninger til elektronikken -->
  <g stroke="#1c2828" stroke-width="1.5" fill="none">
    <polyline points="250,127 250,100 262,90"/>
    <polyline points="350,127 350,100 338,90"/>
  </g>
  <rect x="250" y="56" width="100" height="34" rx="5" fill="#1c2828"/>
  <text x="300" y="78" font-size="12" text-anchor="middle" fill="#e8f4f4">elektronikk</text>

  <!-- Signal -->
  <polyline points="300,56 300,20 590,20" fill="none" stroke="#b5530f" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="582,14 594,20 582,26" fill="#b5530f"/>
  <text x="520" y="38" font-size="12" text-anchor="middle" fill="#b5530f">signal til kontrollrommet</text>

  <!-- Forklaringer -->
  <g stroke="#8a9a9a" stroke-width="1.2">
    <line x1="366" y1="130" x2="436" y2="110"/>
    <line x1="410" y1="150" x2="436" y2="160"/>
    <line x1="350" y1="70" x2="436" y2="66"/>
    <line x1="205" y1="150" x2="168" y2="150"/>
  </g>
  <g font-size="13" fill="#1c2828">
    <text x="440" y="62"><tspan font-weight="bold">elektronikk</tspan>: gjør endringen</text>
    <text x="440" y="78">om til et signal</text>
    <text x="440" y="106"><tspan font-weight="bold" fill="#b5530f">motstander</tspan>: blir strukket</text>
    <text x="440" y="122">og leder strøm litt dårligere</text>
    <text x="440" y="158"><tspan font-weight="bold">membran</tspan>: bøyer seg</text>
    <text x="440" y="174">når trykket øker</text>
    <text x="164" y="146" text-anchor="end">stiplet linje:</text>
    <text x="164" y="162" text-anchor="end">membranen uten trykk</text>
  </g>
  <text x="300" y="284" font-size="13" text-anchor="middle" fill="#2a7a9a" font-weight="bold">trykk fra prosessen</text>
</svg>
