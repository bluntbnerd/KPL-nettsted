<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" font-family="Segoe UI, Arial, sans-serif">
  <title>Et prosessrør med to trykkmålere. Til venstre et manometer, til høyre en trykkgiver som sender signal til kontrollrommet. Begge sitter på et impulsrør med en instrumentventil.</title>
  <rect x="0" y="0" width="620" height="260" rx="10" fill="#ffffff"/>

  <!-- Prosessrør -->
  <line x1="20" y1="205" x2="600" y2="205" stroke="#8a9a9a" stroke-width="18"/>
  <polygon points="560,197 576,205 560,213" fill="#ffffff"/>
  <text x="300" y="240" font-size="13" text-anchor="middle" fill="#586868">prosessrør</text>

  <!-- Venstre gren: manometer -->
  <line x1="170" y1="196" x2="170" y2="108" stroke="#586868" stroke-width="4"/>
  <polygon points="158,128 182,128 170,140" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <polygon points="158,152 182,152 170,140" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="170" y1="140" x2="190" y2="140" stroke="#1c2828" stroke-width="2"/>
  <line x1="190" y1="132" x2="190" y2="148" stroke="#1c2828" stroke-width="3"/>
  <circle cx="170" cy="78" r="30" fill="#f6f8f8" stroke="#1c2828" stroke-width="2.5"/>
  <line x1="170" y1="78" x2="186" y2="62" stroke="#b5530f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="170" cy="78" r="3.5" fill="#b5530f"/>

  <g font-size="13" fill="#1c2828" text-anchor="end">
    <text x="132" y="74" font-weight="bold">manometer</text>
    <text x="132" y="90">(lokal måler)</text>
    <text x="150" y="144">instrumentventil</text>
    <text x="160" y="180">impulsrør</text>
  </g>

  <!-- Høyre gren: trykkgiver -->
  <line x1="420" y1="196" x2="420" y2="100" stroke="#586868" stroke-width="4"/>
  <polygon points="408,128 432,128 420,140" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <polygon points="408,152 432,152 420,140" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="420" y1="140" x2="400" y2="140" stroke="#1c2828" stroke-width="2"/>
  <line x1="400" y1="132" x2="400" y2="148" stroke="#1c2828" stroke-width="3"/>
  <rect x="396" y="56" width="48" height="44" rx="6" fill="#f6f8f8" stroke="#1c2828" stroke-width="2.5"/>
  <rect x="406" y="66" width="28" height="14" rx="2" fill="#1c2828"/>
  <text x="420" y="77" font-size="10" text-anchor="middle" fill="#7fd0e0">2,4</text>
  <text x="420" y="44" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">trykkgiver</text>

  <!-- Signal -->
  <line x1="444" y1="78" x2="590" y2="78" stroke="#b5530f" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polygon points="582,72 594,78 582,84" fill="#b5530f"/>
  <text x="517" y="68" font-size="12" text-anchor="middle" fill="#b5530f">signal til</text>
  <text x="517" y="100" font-size="12" text-anchor="middle" fill="#b5530f">kontrollrommet</text>
</svg>
