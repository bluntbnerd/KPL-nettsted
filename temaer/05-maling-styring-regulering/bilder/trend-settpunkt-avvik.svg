<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Segoe UI, Arial, sans-serif">
  <title>Trend som viser settpunkt, måleverdi og pådrag over 40 minutter, med en settpunktendring og en forstyrrelse</title>
  <rect x="0" y="0" width="640" height="360" rx="10" fill="#ffffff"/>

  <!-- Øvre felt: temperatur -->
  <text x="70" y="26" font-size="13" font-weight="bold" fill="#1c2828">Temperatur i tanken (°C)</text>
  <g stroke="#e3eaea" stroke-width="1">
    <line x1="70" y1="40" x2="610" y2="40"/>
    <line x1="70" y1="75" x2="610" y2="75"/>
    <line x1="70" y1="110" x2="610" y2="110"/>
    <line x1="70" y1="145" x2="610" y2="145"/>
  </g>
  <line x1="70" y1="180" x2="610" y2="180" stroke="#586868" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="180" stroke="#586868" stroke-width="1.5"/>
  <g font-size="11" fill="#586868" text-anchor="end">
    <text x="64" y="44">90</text>
    <text x="64" y="79">85</text>
    <text x="64" y="114">80</text>
    <text x="64" y="149">75</text>
    <text x="64" y="184">70</text>
  </g>

  <!-- Settpunkt (stiplet) -->
  <polyline points="70,110 205,110 205,75 610,75" fill="none" stroke="#b5530f" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- Måleverdi -->
  <polyline points="70,110 205,110 232,106.5 259,96 286,83.4 313,73.6 340,70.8 367,73.6 394,75 434.5,75 461.5,85 475,92.5 488.5,93.2 515.5,84.8 542.5,78.5 569.5,75 610,75" fill="none" stroke="#2a7a9a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Avvik-piler -->
  <g stroke="#1c2828" stroke-width="1.5">
    <line x1="232" y1="79" x2="232" y2="102"/>
    <line x1="475" y1="79" x2="475" y2="88"/>
  </g>
  <g fill="#1c2828">
    <polygon points="228,80 232,75 236,80"/><polygon points="228,101 232,106 236,101"/>
    <polygon points="471,80 475,75 479,80"/><polygon points="471,87 475,92 479,87"/>
  </g>
  <g font-size="11" fill="#1c2828">
    <text x="238" y="128">avvik 4,5 °C</text>
    <text x="482" y="116">avvik 2,5 °C</text>
  </g>

  <!-- Hendelser -->
  <g stroke="#586868" stroke-width="1" stroke-dasharray="2 3">
    <line x1="205" y1="40" x2="205" y2="320"/>
    <line x1="434.5" y1="40" x2="434.5" y2="320"/>
  </g>
  <g font-size="11" fill="#586868">
    <text x="200" y="54" text-anchor="end">settpunktet</text>
    <text x="200" y="67" text-anchor="end">endres til 85 °C</text>
    <text x="430" y="54" text-anchor="end">forstyrrelse:</text>
    <text x="430" y="67" text-anchor="end">kaldere råstoff</text>
  </g>

  <!-- Forklaring -->
  <g font-size="12" fill="#1c2828">
    <line x1="80" y1="160" x2="108" y2="160" stroke="#b5530f" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="114" y="164">settpunkt</text>
    <line x1="190" y1="160" x2="218" y2="160" stroke="#2a7a9a" stroke-width="3"/>
    <text x="224" y="164">måleverdi</text>
  </g>

  <!-- Nedre felt: pådrag -->
  <text x="70" y="218" font-size="13" font-weight="bold" fill="#1c2828">Pådrag til dampventilen (%)</text>
  <g stroke="#e3eaea" stroke-width="1">
    <line x1="70" y1="230" x2="610" y2="230"/>
    <line x1="70" y1="275" x2="610" y2="275"/>
  </g>
  <line x1="70" y1="320" x2="610" y2="320" stroke="#586868" stroke-width="1.5"/>
  <line x1="70" y1="230" x2="70" y2="320" stroke="#586868" stroke-width="1.5"/>
  <g font-size="11" fill="#586868" text-anchor="end">
    <text x="64" y="234">100</text>
    <text x="64" y="279">50</text>
    <text x="64" y="324">0</text>
  </g>
  <polyline points="70,275 205,275 218.5,249.8 259,255.2 313,264.2 340,269.6 394,267.8 434.5,267.8 475,257 515.5,258.8 569.5,266 610,266" fill="none" stroke="#586868" stroke-width="3" stroke-linejoin="round"/>

  <!-- Tidsakse -->
  <g font-size="11" fill="#586868" text-anchor="middle">
    <text x="70" y="336">0</text>
    <text x="205" y="336">10</text>
    <text x="340" y="336">20</text>
    <text x="475" y="336">30</text>
    <text x="610" y="336">40</text>
  </g>
  <text x="340" y="353" font-size="12" text-anchor="middle" fill="#1c2828">tid (minutter)</text>
</svg>
