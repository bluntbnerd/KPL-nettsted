<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" width="620" height="310" font-family="Segoe UI, Arial, sans-serif">
  <title>Et manometer sett forfra med innmaten tegnet inn: et bøyd rør (rørfjær), en overføring til viseren, viser og skala</title>
  <rect x="0" y="0" width="620" height="310" rx="10" fill="#ffffff"/>

  <!-- Tilkobling (gjenger) under manometeret -->
  <rect x="130" y="246" width="20" height="44" fill="#d8dede" stroke="#586868" stroke-width="2"/>
  <g stroke="#586868" stroke-width="1.5">
    <line x1="130" y1="262" x2="150" y2="258"/>
    <line x1="130" y1="270" x2="150" y2="266"/>
    <line x1="130" y1="278" x2="150" y2="274"/>
    <line x1="130" y1="286" x2="150" y2="282"/>
  </g>

  <!-- Manometerhus -->
  <circle cx="150" cy="150" r="100" fill="#f6f8f8" stroke="#1c2828" stroke-width="3"/>

  <!-- Skala: 0–10 bar -->
  <g stroke="#1c2828" stroke-width="2">
    <line x1="82.8" y1="217.2" x2="89.9" y2="210.1"/>
    <line x1="59.6" y1="179.4" x2="69.2" y2="176.3"/>
    <line x1="56.2" y1="135.1" x2="66.0" y2="136.7"/>
    <line x1="73.1" y1="94.2" x2="81.2" y2="100.0"/>
    <line x1="106.9" y1="65.4" x2="111.4" y2="74.3"/>
    <line x1="150" y1="55" x2="150" y2="65"/>
    <line x1="193.1" y1="65.4" x2="188.6" y2="74.3"/>
    <line x1="226.9" y1="94.2" x2="218.8" y2="100.0"/>
    <line x1="243.8" y1="135.1" x2="234.0" y2="136.7"/>
    <line x1="240.4" y1="179.4" x2="230.8" y2="176.3"/>
    <line x1="217.2" y1="217.2" x2="210.1" y2="210.1"/>
  </g>
  <g font-size="12" fill="#1c2828" text-anchor="middle">
    <text x="100" y="206">0</text>
    <text x="150" y="80">5</text>
    <text x="200" y="206">10</text>
    <text x="150" y="122">bar</text>
  </g>

  <!-- Rørfjær: bøyd, flatt rør. Fast i tilkoblingen, lukket i den frie enden -->
  <path d="M139.6,250 L139.6,209.1 A60,60 0 1 1 196.0,188.6" fill="none" stroke="#2a7a9a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="196.0" cy="188.6" r="6" fill="#2a7a9a"/>

  <!-- Overføring fra fri ende til viseren -->
  <line x1="196.0" y1="188.6" x2="163" y2="160" stroke="#586868" stroke-width="3"/>
  <circle cx="163" cy="160" r="3" fill="#586868"/>

  <!-- Viser -->
  <line x1="150" y1="150" x2="186.3" y2="78.7" stroke="#b5530f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="150" r="7" fill="#b5530f"/>

  <!-- Forklaringer -->
  <g stroke="#8a9a9a" stroke-width="1.2" fill="none">
    <polyline points="180,92 290,70 300,70"/>
    <polyline points="244,135 290,120 300,120"/>
    <polyline points="207,168 290,170 300,170"/>
    <polyline points="182,174 290,230 300,230"/>
    <polyline points="152,282 300,282"/>
  </g>
  <g font-size="13" fill="#1c2828">
    <text x="305" y="74"><tspan font-weight="bold" fill="#b5530f">viser</tspan>: peker på trykket på skalaen</text>
    <text x="305" y="124"><tspan font-weight="bold">skala</tspan>: her 0–10 bar overtrykk</text>
    <text x="305" y="166"><tspan font-weight="bold" fill="#2a7a9a">rørfjær</tspan>: et bøyd, flatt rør. Når trykket</text>
    <text x="305" y="183">inne i røret øker, retter det seg litt ut.</text>
    <text x="305" y="226"><tspan font-weight="bold">overføring</tspan>: den frie enden av røret</text>
    <text x="305" y="243">drar viseren rundt</text>
    <text x="305" y="286"><tspan font-weight="bold">tilkobling</tspan>: trykket kommer inn her</text>
  </g>
</svg>
