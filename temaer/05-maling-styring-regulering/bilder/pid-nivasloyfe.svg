<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="Segoe UI, Arial, sans-serif">
  <title>Utsnitt av et teknisk flytskjema (P&amp;ID) med tank T-101, pumpe P-101 og nivåreguleringssløyfe 101: nivågiver LT-101, nivåregulator LIC-101 i styresystemet og reguleringsventil LV-101. I tillegg et høy-høy-nivåvern LSHH-102 som sender signal til en forrigling, og et lokalt manometer PI-103.</title>
  <rect x="0" y="0" width="720" height="370" rx="10" fill="#ffffff"/>

  <!-- Innløp -->
  <polyline points="20,50 130,50 130,80" fill="none" stroke="#1c2828" stroke-width="3"/>
  <polygon points="124,70 136,70 130,80" fill="#1c2828"/>

  <!-- Tank -->
  <rect x="62" y="170" width="136" height="108" fill="#d8ecf3"/>
  <rect x="60" y="80" width="140" height="200" rx="8" fill="none" stroke="#1c2828" stroke-width="3"/>
  <text x="130" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2828">T-101</text>

  <!-- Utløp med pumpe, ventil og manometer -->
  <polyline points="130,280 130,310 700,310" fill="none" stroke="#1c2828" stroke-width="3"/>
  <polygon points="688,304 700,310 688,316" fill="#1c2828"/>

  <circle cx="260" cy="310" r="20" fill="#ffffff" stroke="#1c2828" stroke-width="2.5"/>
  <line x1="260" y1="290" x2="280" y2="310" stroke="#1c2828" stroke-width="2"/>
  <line x1="260" y1="330" x2="280" y2="310" stroke="#1c2828" stroke-width="2"/>
  <text x="260" y="352" font-size="13" text-anchor="middle" fill="#1c2828">P-101</text>

  <polygon points="450,298 450,322 470,310" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <polygon points="490,298 490,322 470,310" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="470" y1="310" x2="470" y2="285" stroke="#1c2828" stroke-width="2"/>
  <path d="M455,285 A15,15 0 0 1 485,285 Z" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <text x="470" y="345" font-size="13" text-anchor="middle" fill="#1c2828">LV-101</text>

  <line x1="590" y1="310" x2="590" y2="278" stroke="#1c2828" stroke-width="2"/>
  <circle cx="590" cy="254" r="24" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <text x="590" y="251" font-size="11" font-weight="bold" text-anchor="middle" fill="#1c2828">PI</text>
  <text x="590" y="266" font-size="11" text-anchor="middle" fill="#1c2828">103</text>

  <!-- LSHH-102 -->
  <line x1="200" y1="110" x2="226" y2="110" stroke="#1c2828" stroke-width="2"/>
  <circle cx="250" cy="110" r="24" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <text x="250" y="107" font-size="10" font-weight="bold" text-anchor="middle" fill="#1c2828">LSHH</text>
  <text x="250" y="122" font-size="11" text-anchor="middle" fill="#1c2828">102</text>

  <!-- LT-101 -->
  <line x1="200" y1="230" x2="226" y2="230" stroke="#1c2828" stroke-width="2"/>
  <circle cx="250" cy="230" r="24" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <text x="250" y="227" font-size="11" font-weight="bold" text-anchor="middle" fill="#1c2828">LT</text>
  <text x="250" y="242" font-size="11" text-anchor="middle" fill="#1c2828">101</text>

  <!-- LIC-101 i styresystemet -->
  <rect x="444" y="124" width="52" height="52" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <circle cx="470" cy="150" r="24" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="446" y1="150" x2="494" y2="150" stroke="#1c2828" stroke-width="1.5"/>
  <text x="470" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="#1c2828">LIC</text>
  <text x="470" y="164" font-size="11" text-anchor="middle" fill="#1c2828">101</text>

  <!-- Signal fra LSHH-102 til forrigling -->
  <line x1="274" y1="110" x2="352" y2="110" stroke="#b5530f" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="350,104 362,110 350,116" fill="#b5530f"/>
  <text x="368" y="114" font-size="12" fill="#1c2828">til forrigling</text>

  <!-- Signallinjer -->
  <polyline points="274,230 380,230 380,150 444,150" fill="none" stroke="#b5530f" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="470" y1="176" x2="470" y2="270" stroke="#b5530f" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Symbolforklaring -->
  <rect x="540" y="20" width="170" height="182" rx="6" fill="#f6f8f8" stroke="#c4d0d0"/>
  <text x="552" y="40" font-size="12" font-weight="bold" fill="#1c2828">Symbolforklaring</text>
  <line x1="552" y1="58" x2="590" y2="58" stroke="#1c2828" stroke-width="3"/>
  <text x="598" y="62" font-size="11" fill="#1c2828">prosessrør</text>
  <line x1="552" y1="80" x2="590" y2="80" stroke="#b5530f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="598" y="84" font-size="11" fill="#1c2828">elektrisk signal</text>
  <circle cx="568" cy="110" r="12" fill="#ffffff" stroke="#1c2828" stroke-width="1.5"/>
  <text x="590" y="108" font-size="11" fill="#1c2828">instrument ute</text>
  <text x="590" y="121" font-size="11" fill="#1c2828">i anlegget</text>
  <rect x="555" y="140" width="26" height="26" fill="#ffffff" stroke="#1c2828" stroke-width="1.5"/>
  <circle cx="568" cy="153" r="12" fill="#ffffff" stroke="#1c2828" stroke-width="1.5"/>
  <line x1="556" y1="153" x2="580" y2="153" stroke="#1c2828" stroke-width="1"/>
  <text x="590" y="150" font-size="11" fill="#1c2828">funksjon i styre-</text>
  <text x="590" y="163" font-size="11" fill="#1c2828">systemet, vises på</text>
  <text x="590" y="176" font-size="11" fill="#1c2828">skjermen</text>
</svg>
