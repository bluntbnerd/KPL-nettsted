<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="Segoe UI, Arial, sans-serif">
  <title>Trend som viser hvordan liten, passe og for stor forsterkning virker når settpunktet endres fra 80 til 85 grader</title>
  <rect x="0" y="0" width="640" height="290" rx="10" fill="#ffffff"/>

  <text x="70" y="24" font-size="13" font-weight="bold" fill="#1c2828">Temperatur i tanken (°C)</text>

  <!-- Rutenett -->
  <g stroke="#e3eaea" stroke-width="1">
    <line x1="70" y1="40" x2="610" y2="40"/>
    <line x1="70" y1="72" x2="610" y2="72"/>
    <line x1="70" y1="104" x2="610" y2="104"/>
    <line x1="70" y1="136" x2="610" y2="136"/>
    <line x1="70" y1="168" x2="610" y2="168"/>
  </g>
  <line x1="70" y1="200" x2="610" y2="200" stroke="#586868" stroke-width="1.5"/>
  <line x1="70" y1="40" x2="70" y2="200" stroke="#586868" stroke-width="1.5"/>
  <g font-size="11" fill="#586868" text-anchor="end">
    <text x="64" y="44">88</text>
    <text x="64" y="76">86</text>
    <text x="64" y="108">84</text>
    <text x="64" y="140">82</text>
    <text x="64" y="172">80</text>
    <text x="64" y="204">78</text>
  </g>
  <g font-size="11" fill="#586868" text-anchor="middle">
    <text x="70" y="216">0</text>
    <text x="205" y="216">5</text>
    <text x="340" y="216">10</text>
    <text x="475" y="216">15</text>
    <text x="610" y="216">20</text>
  </g>
  <text x="340" y="232" font-size="12" text-anchor="middle" fill="#1c2828">tid (minutter)</text>

  <!-- Settpunkt -->
  <polyline points="70,168 124,168 124,88 610,88" fill="none" stroke="#1c2828" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Liten forsterkning -->
  <polyline points="70,168 124,168 151,160 178,153.6 232,142.4 286,136 340,131.2 448,128.8 610,128" fill="none" stroke="#586868" stroke-width="3" stroke-linejoin="round"/>
  <!-- Passe forsterkning -->
  <polyline points="70,168 124,168 151,144 178,120 205,100.8 232,92.8 259,96 286,100.8 610,100.8" fill="none" stroke="#2a7a9a" stroke-width="3" stroke-linejoin="round"/>
  <!-- For stor forsterkning -->
  <polyline points="124,168 151,89.6 163.15,65.9 175.3,56 187.45,65.9 199.6,89.6 211.75,113.3 223.9,123.2 236.05,113.3 248.2,89.6 260.35,65.9 272.5,56 284.65,65.9 296.8,89.6 308.95,113.3 321.1,123.2 333.25,113.3 345.4,89.6 357.55,65.9 369.7,56 381.85,65.9 394,89.6 406.15,113.3 418.3,123.2 430.45,113.3 442.6,89.6 454.75,65.9 466.9,56 479.05,65.9 491.2,89.6 503.35,113.3 515.5,123.2 527.65,113.3 539.8,89.6 551.95,65.9 564.1,56 576.25,65.9 588.4,89.6 600.55,113.3" fill="none" stroke="#b5530f" stroke-width="2" stroke-linejoin="round"/>

  <!-- Varig avvik -->
  <g stroke="#1c2828" stroke-width="1.2">
    <line x1="400" y1="92" x2="400" y2="124"/>
  </g>
  <g fill="#1c2828">
    <polygon points="396,93 400,88 404,93"/><polygon points="396,123 400,128 404,123"/>
  </g>
  <text x="396" y="158" font-size="11" text-anchor="end" fill="#1c2828">varig avvik 2,5 °C (liten forsterkning)</text>

  <!-- Forklaring -->
  <g font-size="12" fill="#1c2828">
    <line x1="70" y1="256" x2="96" y2="256" stroke="#1c2828" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="102" y="260">settpunkt</text>
    <line x1="180" y1="256" x2="206" y2="256" stroke="#586868" stroke-width="3"/>
    <text x="212" y="260">liten forsterkning</text>
    <line x1="330" y1="256" x2="356" y2="256" stroke="#2a7a9a" stroke-width="3"/>
    <text x="362" y="260">passe</text>
    <line x1="420" y1="256" x2="446" y2="256" stroke="#b5530f" stroke-width="2"/>
    <text x="452" y="260">for stor: svinger</text>
  </g>
</svg>
