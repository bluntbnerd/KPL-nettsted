<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Segoe UI, Arial, sans-serif">
  <title>Seks steg i feilsøking: 1. Sikre, 2. Beskriv problemet, 3. Samle fakta, 4. Finn mulige årsaker, 5. Rett opp, 6. Kontroller og logg.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="260" rx="10" fill="#ffffff"/>

  <g stroke="#586868" stroke-width="2">
    <rect x="20" y="20" width="180" height="84" rx="8" fill="#f6c6c0"/>
    <rect x="230" y="20" width="180" height="84" rx="8" fill="#bcd9ee"/>
    <rect x="440" y="20" width="180" height="84" rx="8" fill="#bcd9ee"/>
    <rect x="440" y="156" width="180" height="84" rx="8" fill="#fde2b8"/>
    <rect x="230" y="156" width="180" height="84" rx="8" fill="#cfe8c8"/>
    <rect x="20" y="156" width="180" height="84" rx="8" fill="#e3e8e8"/>
  </g>

  <g fill="#1c2828" text-anchor="middle">
    <text x="110" y="48" font-size="15" font-weight="bold">1. Sikre</text>
    <text x="110" y="70" font-size="12">Er det fare?</text>
    <text x="110" y="87" font-size="12">Gjør anlegget trygt.</text>

    <text x="320" y="48" font-size="15" font-weight="bold">2. Beskriv problemet</text>
    <text x="320" y="70" font-size="12">Hva er galt? Hvor?</text>
    <text x="320" y="87" font-size="12">Når begynte det?</text>

    <text x="530" y="48" font-size="15" font-weight="bold">3. Samle fakta</text>
    <text x="530" y="70" font-size="12">trender, alarmer,</text>
    <text x="530" y="87" font-size="12">runde, logg, kolleger</text>

    <text x="530" y="184" font-size="15" font-weight="bold">4. Finn mulige årsaker</text>
    <text x="530" y="206" font-size="12">Er målingen riktig?</text>
    <text x="530" y="223" font-size="12">Hva er endret?</text>

    <text x="320" y="184" font-size="15" font-weight="bold">5. Rett opp</text>
    <text x="320" y="206" font-size="12">mest sannsynlige først,</text>
    <text x="320" y="223" font-size="12">én ting om gangen</text>

    <text x="110" y="184" font-size="15" font-weight="bold">6. Kontroller og logg</text>
    <text x="110" y="206" font-size="12">Virker det?</text>
    <text x="110" y="223" font-size="12">Logg og meld avvik.</text>
  </g>

  <g stroke="#1c2828" stroke-width="2.5" fill="none" marker-end="url(#pil)">
    <line x1="202" y1="62" x2="228" y2="62"/>
    <line x1="412" y1="62" x2="438" y2="62"/>
    <line x1="530" y1="106" x2="530" y2="154"/>
    <line x1="438" y1="198" x2="412" y2="198"/>
    <line x1="228" y1="198" x2="202" y2="198"/>
  </g>
</svg>
