<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Segoe UI, Arial, sans-serif">
  <title>Forenklet tegning av en sentrifugalpumpe sett fra siden, med seks nummererte vedlikeholdspunkter. 1. Motor: temperatur, lyd og elektriske tilkoblinger. 2. Kobling med vern: oppretting, og vernet skal sitte på. 3. Lager: smøring, temperatur og vibrasjon. 4. Akseltetning: lekkasje. 5. Pumpehus og pumpehjul: slitasje, kavitasjon og belegg. 6. Sil på sugesiden: trykkfall og rensing.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="380" rx="10" fill="#ffffff"/>

  <!-- Fundament -->
  <rect x="30" y="200" width="500" height="14" fill="#9aa5a5"/>

  <!-- Motor -->
  <rect x="40" y="110" width="130" height="90" rx="10" fill="#7f9bb8" stroke="#1c2828" stroke-width="1.5"/>
  <g stroke="#1c2828" stroke-width="1" opacity="0.5">
    <line x1="55" y1="120" x2="55" y2="190"/><line x1="70" y1="120" x2="70" y2="190"/><line x1="85" y1="120" x2="85" y2="190"/><line x1="100" y1="120" x2="100" y2="190"/>
  </g>
  <text x="125" y="160" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Motor</text>

  <!-- Aksel -->
  <rect x="170" y="150" width="200" height="10" fill="#555f5f"/>

  <!-- Kobling og vern -->
  <rect x="190" y="138" width="40" height="34" fill="#c9d1d1" stroke="#1c2828" stroke-width="1.5"/>
  <rect x="180" y="125" width="60" height="60" fill="#e0a800" fill-opacity="0.35" stroke="#1c2828" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Lagerhus -->
  <rect x="255" y="130" width="70" height="50" rx="4" fill="#b8c4c4" stroke="#1c2828" stroke-width="1.5"/>
  <rect x="255" y="180" width="70" height="20" fill="#9aa5a5" stroke="#1c2828" stroke-width="1"/>

  <!-- Akseltetning -->
  <rect x="335" y="140" width="18" height="30" fill="#e8846f" stroke="#1c2828" stroke-width="1.5"/>

  <!-- Pumpehus -->
  <circle cx="410" cy="155" r="52" fill="#b8c4c4" stroke="#1c2828" stroke-width="2"/>
  <g stroke="#1c2828" stroke-width="2.5">
    <line x1="410" y1="155" x2="410" y2="120"/><line x1="410" y1="155" x2="440" y2="172"/><line x1="410" y1="155" x2="380" y2="172"/>
  </g>
  <circle cx="410" cy="155" r="7" fill="#555f5f"/>

  <!-- Trykkside (opp) -->
  <rect x="440" y="60" width="24" height="60" fill="#dbe7f5" stroke="#1c2828" stroke-width="1.5"/>
  <line x1="452" y1="80" x2="452" y2="45" stroke="#1f5f9e" stroke-width="2.5" marker-end="url(#pil)"/>
  <text x="472" y="62" font-size="12" fill="#1c2828">trykkside</text>

  <!-- Sugeside (fra høyre) med sil -->
  <rect x="460" y="143" width="140" height="24" fill="#dbe7f5" stroke="#1c2828" stroke-width="1.5"/>
  <rect x="520" y="134" width="30" height="42" fill="#c9d1d1" stroke="#1c2828" stroke-width="1.5"/>
  <g stroke="#1c2828" stroke-width="1"><line x1="527" y1="138" x2="527" y2="172"/><line x1="535" y1="138" x2="535" y2="172"/><line x1="543" y1="138" x2="543" y2="172"/></g>
  <line x1="625" y1="155" x2="605" y2="155" stroke="#1f5f9e" stroke-width="2.5" marker-end="url(#pil)"/>
  <text x="600" y="192" font-size="12" fill="#1c2828" text-anchor="end">sugeside</text>

  <!-- Nummer -->
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="105" cy="92" r="12" fill="#1c2828"/><text x="105" y="97">1</text>
    <circle cx="210" cy="107" r="12" fill="#1c2828"/><text x="210" y="112">2</text>
    <circle cx="290" cy="112" r="12" fill="#1c2828"/><text x="290" y="117">3</text>
    <circle cx="344" cy="122" r="12" fill="#1c2828"/><text x="344" y="127">4</text>
    <circle cx="380" cy="92" r="12" fill="#1c2828"/><text x="380" y="97">5</text>
    <circle cx="535" cy="116" r="12" fill="#1c2828"/><text x="535" y="121">6</text>
  </g>

  <!-- Forklaring -->
  <g font-size="12" fill="#1c2828">
    <text x="30" y="245"><tspan font-weight="bold">1 Motor:</tspan> temperatur, lyd, elektriske</text>
    <text x="30" y="261">tilkoblinger</text>
    <text x="30" y="284"><tspan font-weight="bold">2 Kobling med vern:</tspan> oppretting, vernet på plass</text>
    <text x="30" y="307"><tspan font-weight="bold">3 Lager:</tspan> smøring, temperatur, vibrasjon</text>
    <text x="330" y="245"><tspan font-weight="bold">4 Akseltetning:</tspan> lekkasje</text>
    <text x="330" y="268"><tspan font-weight="bold">5 Pumpehus og pumpehjul:</tspan> slitasje,</text>
    <text x="330" y="284">kavitasjon, belegg</text>
    <text x="330" y="307"><tspan font-weight="bold">6 Sil:</tspan> trykkfall, rensing</text>
  </g>
  <text x="320" y="355" font-size="12" font-style="italic" fill="#1c2828" text-anchor="middle">Forenklet tegning. Ekte pumper ser forskjellige ut, men punktene er de samme.</text>
</svg>
