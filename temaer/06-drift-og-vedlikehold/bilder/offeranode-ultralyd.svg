<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="Segoe UI, Arial, sans-serif">
  <title>Offeranode og ultralydmåling av veggtykkelse</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/>
    </marker>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="pilrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5541c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="290" rx="10" fill="#ffffff"/>
  <g fill="#f4f7f7" stroke="#d5dddd">
    <rect x="10" y="10" width="300" height="270" rx="8"/>
    <rect x="330" y="10" width="300" height="270" rx="8"/>
  </g>

  <!-- Venstre: offeranode -->
  <text x="160" y="34" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2828">Katodisk beskyttelse med offeranode</text>
  <rect x="25" y="50" width="270" height="215" fill="#cfe6f7"/>
  <text x="35" y="70" font-size="12" fill="#1c2828">sjøvann</text>
  <rect x="40" y="95" width="240" height="40" fill="#cfd6d6" stroke="#586868" stroke-width="1.5"/>
  <text x="160" y="120" font-size="13" text-anchor="middle" fill="#1c2828">stålrør (beskyttes)</text>
  <rect x="150" y="135" width="12" height="55" fill="#586868"/>
  <rect x="112" y="186" width="96" height="42" fill="none" stroke="#586868" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="120" y="190" width="80" height="34" fill="#a9b4c2" stroke="#586868" stroke-width="1.5"/>
  <text x="160" y="212" font-size="12" text-anchor="middle" fill="#1c2828">sink</text>
  <line x1="176" y1="186" x2="176" y2="142" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <text x="184" y="168" font-size="12" fill="#1f5fa8">e<tspan baseline-shift="super" font-size="9">−</tspan></text>
  <text x="160" y="246" font-size="12" text-anchor="middle" fill="#1c2828">offeranoden korroderer i stedet</text>
  <text x="160" y="261" font-size="11" text-anchor="middle" fill="#586868">(stiplet: størrelsen da den var ny)</text>

  <!-- Høyre: ultralyd -->
  <text x="480" y="34" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c2828">Ultralydmåling av veggtykkelse</text>
  <rect x="530" y="50" width="80" height="36" rx="4" fill="#1c2828"/>
  <text x="570" y="74" font-size="14" text-anchor="middle" fill="#ffffff">6,6 mm</text>
  <path d="M480,120 C480,90 520,100 530,72" fill="none" stroke="#1c2828" stroke-width="2"/>
  <rect x="460" y="120" width="40" height="30" rx="3" fill="#3d4a4a"/>
  <text x="420" y="130" font-size="12" text-anchor="end" fill="#1c2828">måleprobe</text>
  <text x="560" y="142" font-size="12" text-anchor="middle" fill="#1c2828">utsiden</text>
  <rect x="345" y="150" width="270" height="50" fill="#cfd6d6" stroke="#586868" stroke-width="1.5"/>
  <rect x="345" y="200" width="270" height="55" fill="#cfe6f7"/>
  <text x="560" y="232" font-size="12" text-anchor="middle" fill="#1c2828">væske i røret</text>
  <line x1="472" y1="152" x2="472" y2="197" stroke="#b5541c" stroke-width="2" marker-end="url(#pilrod)"/>
  <line x1="488" y1="197" x2="488" y2="153" stroke="#b5541c" stroke-width="2" marker-end="url(#pilrod)"/>
  <text x="400" y="180" font-size="12" text-anchor="middle" fill="#1c2828">stålvegg</text>
  <text x="560" y="172" font-size="11" text-anchor="middle" fill="#b5541c">lydpuls ned,</text>
  <text x="560" y="186" font-size="11" text-anchor="middle" fill="#b5541c">ekko opp</text>
  <line x1="610" y1="152" x2="610" y2="198" stroke="#1c2828" stroke-width="1.5" marker-start="url(#pil)" marker-end="url(#pil)"/>
  <text x="480" y="272" font-size="12" text-anchor="middle" fill="#1c2828">Tiden ekkoet bruker, gir tykkelsen</text>
</svg>
