<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>En pumpe som er gjort klar for vedlikehold. Fra en tank til venstre går et rør gjennom en stengt og låst ventil inn til pumpa. Fra pumpa går røret gjennom en ny stengt og låst ventil videre i anlegget. Bryteren for motoren er slått av og låst. Under pumpa står en tømmeventil åpen, slik at væsken er tappet ut. En trykkmåler på pumpa viser 0 bar.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <g id="laas">
      <path d="M-6,0 v-6 a6,6 0 0 1 12,0 v6" fill="none" stroke="#1c2828" stroke-width="2.5"/>
      <rect x="-9" y="0" width="18" height="14" rx="2" fill="#b3261e" stroke="#1c2828" stroke-width="1"/>
    </g>
  </defs>
  <rect x="0" y="0" width="640" height="330" rx="10" fill="#ffffff"/>

  <!-- Tank -->
  <rect x="25" y="80" width="90" height="130" rx="8" fill="#dbe7f5" stroke="#1c2828" stroke-width="2"/>
  <text x="70" y="150" font-size="13" text-anchor="middle" fill="#1c2828">Tank</text>

  <!-- Rør -->
  <g stroke="#1c2828" stroke-width="6" fill="none">
    <line x1="115" y1="190" x2="270" y2="190"/>
    <line x1="330" y1="190" x2="560" y2="190"/>
    <line x1="300" y1="220" x2="300" y2="255"/>
  </g>
  <g stroke="#dbe7f5" stroke-width="3" fill="none">
    <line x1="115" y1="190" x2="270" y2="190"/>
    <line x1="330" y1="190" x2="560" y2="190"/>
  </g>
  <line x1="565" y1="190" x2="615" y2="190" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <text x="615" y="215" font-size="12" text-anchor="end" fill="#1c2828">videre i anlegget</text>

  <!-- Ventil inn (stengt) -->
  <path d="M170,176 L200,204 L200,176 L170,204 Z" fill="#1c2828" stroke="#1c2828" stroke-width="1.5"/>
  <use href="#laas" x="185" y="150"/>
  <text x="185" y="235" font-size="12" text-anchor="middle" fill="#1c2828">Stengt og låst</text>

  <!-- Ventil ut (stengt) -->
  <path d="M415,176 L445,204 L445,176 L415,204 Z" fill="#1c2828" stroke="#1c2828" stroke-width="1.5"/>
  <use href="#laas" x="430" y="150"/>
  <text x="430" y="235" font-size="12" text-anchor="middle" fill="#1c2828">Stengt og låst</text>

  <!-- Pumpe -->
  <circle cx="300" cy="190" r="30" fill="#b8c4c4" stroke="#1c2828" stroke-width="2"/>
  <text x="300" y="195" font-size="12" text-anchor="middle" fill="#1c2828">Pumpe</text>
  <!-- Motor -->
  <rect x="270" y="105" width="60" height="45" rx="6" fill="#7f9bb8" stroke="#1c2828" stroke-width="1.5"/>
  <text x="300" y="132" font-size="12" text-anchor="middle" fill="#ffffff">Motor</text>
  <line x1="300" y1="150" x2="300" y2="160" stroke="#1c2828" stroke-width="4"/>

  <!-- Bryter -->
  <line x1="270" y1="120" x2="215" y2="120" stroke="#1c2828" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="215" y1="120" x2="215" y2="70" stroke="#1c2828" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="190" y="30" width="50" height="40" rx="4" fill="#eeeeee" stroke="#1c2828" stroke-width="1.5"/>
  <text x="215" y="54" font-size="11" text-anchor="middle" fill="#1c2828">AV</text>
  <use href="#laas" x="252" y="40"/>
  <text x="270" y="30" font-size="12" fill="#1c2828">Bryteren er slått av og låst</text>

  <!-- Trykkmåler -->
  <line x1="320" y1="168" x2="345" y2="145" stroke="#1c2828" stroke-width="3"/>
  <circle cx="355" cy="135" r="15" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="355" y1="135" x2="345" y2="142" stroke="#b3261e" stroke-width="2"/>
  <text x="375" y="112" font-size="12" fill="#1c2828">0 bar:</text>
  <text x="375" y="127" font-size="12" fill="#1c2828">trykkløs</text>

  <!-- Tømmeventil (åpen) -->
  <path d="M286,255 L314,280 L314,255 L286,280 Z" fill="#ffffff" stroke="#1c2828" stroke-width="2" transform="rotate(90 300 267)"/>
  <g fill="#1f5f9e">
    <path d="M300,288 q-4,7 0,10 q4,-3 0,-10 z"/>
    <path d="M300,302 q-4,7 0,10 q4,-3 0,-10 z"/>
  </g>
  <text x="325" y="275" font-size="12" fill="#1c2828">Tømmeventil åpen:</text>
  <text x="325" y="290" font-size="12" fill="#1c2828">pumpa er tappet tom</text>
</svg>
