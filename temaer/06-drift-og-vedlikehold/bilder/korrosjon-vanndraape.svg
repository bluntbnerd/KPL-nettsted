<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>Korrosjon under en vanndråpe på jern</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/>
    </marker>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" rx="10" fill="#ffffff"/>

  <!-- Luft -->
  <text x="320" y="30" font-size="15" text-anchor="middle" fill="#1c2828">Luft med oksygen (O<tspan baseline-shift="sub" font-size="11">2</tspan>)</text>

  <!-- Vanndråpe -->
  <path d="M130,210 C150,95 490,95 510,210 Z" fill="#cfe6f7" stroke="#3a7fc1" stroke-width="2"/>
  <text x="320" y="140" font-size="14" text-anchor="middle" fill="#1c2828">vanndråpe</text>

  <!-- Oksygen inn ved kantene -->
  <line x1="150" y1="60" x2="172" y2="160" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <line x1="490" y1="60" x2="468" y2="160" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <text x="120" y="55" font-size="13" fill="#1c2828">O<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="498" y="55" font-size="13" fill="#1c2828">O<tspan baseline-shift="sub" font-size="10">2</tspan></text>

  <!-- Rustring -->
  <path d="M205,210 C210,196 230,190 240,190 L240,210 Z" fill="#b5541c"/>
  <path d="M435,210 C430,196 410,190 400,190 L400,210 Z" fill="#b5541c"/>

  <!-- Jern løses opp i midten -->
  <path d="M285,210 Q320,226 355,210 Z" fill="#ffffff" stroke="#586868" stroke-width="1.5"/>
  <text x="320" y="175" font-size="14" text-anchor="middle" fill="#1c2828">Fe<tspan baseline-shift="super" font-size="10">2+</tspan></text>
  <line x1="320" y1="210" x2="320" y2="182" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>

  <!-- Jernplate -->
  <path d="M40,210 L285,210 Q320,226 355,210 L600,210 L600,262 L40,262 Z" fill="#cfd6d6" stroke="#586868" stroke-width="1.5"/>
  <text x="80" y="245" font-size="14" fill="#1c2828">jern (Fe)</text>

  <!-- Elektroner gjennom metallet -->
  <line x1="300" y1="240" x2="200" y2="240" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <line x1="340" y1="240" x2="440" y2="240" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <text x="250" y="256" font-size="12" text-anchor="middle" fill="#1f5fa8">e<tspan baseline-shift="super" font-size="9">−</tspan></text>
  <text x="390" y="256" font-size="12" text-anchor="middle" fill="#1f5fa8">e<tspan baseline-shift="super" font-size="9">−</tspan></text>

  <!-- Forklaringer -->
  <g font-size="13" fill="#1c2828">
    <text x="320" y="285" text-anchor="middle" font-weight="bold">1  Midten: jern gir fra seg elektroner og løses opp</text>
    <text x="320" y="303" text-anchor="middle" font-weight="bold">2  Kanten: oksygen og vann tar opp elektronene</text>
    <text x="320" y="321" text-anchor="middle" font-weight="bold" fill="#b5541c">3  Der stoffene møtes, dannes rust</text>
  </g>
  <g font-size="12" fill="#1c2828">
    <text x="320" y="200" text-anchor="middle">1</text>
    <text x="178" y="200" text-anchor="middle">2</text>
    <text x="462" y="200" text-anchor="middle">2</text>
    <text x="222" y="185" text-anchor="middle" fill="#b5541c">3</text>
    <text x="418" y="185" text-anchor="middle" fill="#b5541c">3</text>
  </g>
</svg>
