<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="Segoe UI, Arial, sans-serif">
  <title>Seks typer korrosjon, tegnet i snitt</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="350" rx="10" fill="#ffffff"/>

  <!-- Paneler -->
  <g fill="#f4f7f7" stroke="#d5dddd">
    <rect x="10" y="10" width="200" height="160" rx="8"/>
    <rect x="220" y="10" width="200" height="160" rx="8"/>
    <rect x="430" y="10" width="200" height="160" rx="8"/>
    <rect x="10" y="180" width="200" height="160" rx="8"/>
    <rect x="220" y="180" width="200" height="160" rx="8"/>
    <rect x="430" y="180" width="200" height="160" rx="8"/>
  </g>

  <g font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="110" y="32">1 Jevn korrosjon</text>
    <text x="320" y="32">2 Groptæring</text>
    <text x="530" y="32">3 Spaltekorrosjon</text>
    <text x="110" y="202">4 Galvanisk korrosjon</text>
    <text x="320" y="202">5 Erosjonskorrosjon</text>
    <text x="530" y="202">6 Under isolasjon</text>
  </g>
  <g font-size="12" fill="#1c2828" text-anchor="middle">
    <text x="110" y="158">Hele flaten blir jevnt tynnere</text>
    <text x="320" y="158">Små, dype groper</text>
    <text x="530" y="158">Angrep inne i en trang spalte</text>
    <text x="110" y="330">Stålet tæres ved skjøten</text>
    <text x="320" y="330">Tynn vegg der strømmen treffer</text>
    <text x="530" y="330">Rust under isolasjonen</text>
  </g>

  <!-- 1 Jevn korrosjon -->
  <rect x="25" y="50" width="170" height="40" fill="#cfe6f7"/>
  <rect x="25" y="90" width="170" height="40" fill="#cfd6d6" stroke="#586868" stroke-width="1.5"/>
  <line x1="25" y1="78" x2="195" y2="78" stroke="#586868" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="110" y="72" font-size="11" text-anchor="middle" fill="#1c2828">opprinnelig overflate</text>

  <!-- 2 Groptæring -->
  <rect x="235" y="50" width="170" height="20" fill="#cfe6f7"/>
  <path d="M235,70 L268,70 L272,108 L276,70 L318,70 L322,118 L326,70 L366,70 L369,96 L372,70 L405,70 L405,130 L235,130 Z" fill="#cfd6d6" stroke="#586868" stroke-width="1.5"/>
  <g fill="#b5541c">
    <rect x="266" y="66" width="12" height="4"/>
    <rect x="316" y="66" width="12" height="4"/>
    <rect x="364" y="66" width="10" height="4"/>
  </g>

  <!-- 3 Spaltekorrosjon -->
  <rect x="445" y="68" width="55" height="27" fill="#cfe6f7"/>
  <rect x="445" y="95" width="170" height="33" fill="#cfd6d6" stroke="#586868" stroke-width="1.5"/>
  <rect x="500" y="64" width="115" height="26" fill="#bcc5c5" stroke="#586868" stroke-width="1.5"/>
  <rect x="500" y="90" width="115" height="5" fill="#cfe6f7"/>
  <rect x="500" y="90" width="48" height="5" fill="#b5541c"/>
  <line x1="590" y1="52" x2="560" y2="88" stroke="#1c2828" stroke-width="1.5" marker-end="url(#pil)"/>
  <text x="575" y="48" font-size="11" fill="#1c2828">spalte</text>

  <!-- 4 Galvanisk korrosjon -->
  <rect x="25" y="225" width="170" height="35" fill="#cfe6f7"/>
  <path d="M25,260 L78,260 Q98,280 110,270 L110,300 L25,300 Z" fill="#cfd6d6" stroke="#586868" stroke-width="1.5"/>
  <rect x="110" y="260" width="85" height="40" fill="#e3b956" stroke="#8a6a1c" stroke-width="1.5"/>
  <path d="M80,262 Q98,281 109,272" fill="none" stroke="#b5541c" stroke-width="4"/>
  <text x="55" y="290" font-size="12" text-anchor="middle" fill="#1c2828">stål</text>
  <text x="152" y="290" font-size="12" text-anchor="middle" fill="#1c2828">kobber</text>

  <!-- 5 Erosjonskorrosjon -->
  <path d="M235,225 L330,225 A60,60 0 0 1 390,285 L390,312" fill="none" stroke="#7b8888" stroke-width="8"/>
  <path d="M235,255 L330,255 A30,30 0 0 1 360,285 L360,312" fill="none" stroke="#7b8888" stroke-width="8"/>
  <path d="M352,233 A60,60 0 0 1 384,262" fill="none" stroke="#b5541c" stroke-width="5"/>
  <path d="M245,240 L330,240 A45,45 0 0 1 375,285 L375,306" fill="none" stroke="#3a7fc1" stroke-width="2" marker-end="url(#pil)"/>
  <g fill="#586868">
    <circle cx="270" cy="236" r="2"/><circle cx="295" cy="244" r="2"/><circle cx="318" cy="237" r="2"/><circle cx="350" cy="248" r="2"/>
  </g>

  <!-- 6 Korrosjon under isolasjon -->
  <circle cx="530" cy="268" r="48" fill="#f3e3a0" stroke="#586868" stroke-width="2"/>
  <ellipse cx="530" cy="306" rx="26" ry="7" fill="#9cc8ea"/>
  <circle cx="530" cy="268" r="22" fill="#ffffff" stroke="#7b8888" stroke-width="6"/>
  <path d="M512,281 A22,22 0 0 0 548,281" fill="none" stroke="#b5541c" stroke-width="6"/>
  <path d="M594,212 Q601,224 594,229 Q587,224 594,212 Z" fill="#3a7fc1"/>
  <line x1="589" y1="233" x2="571" y2="248" stroke="#1c2828" stroke-width="1.5" marker-end="url(#pil)"/>
  <text x="460" y="225" font-size="11" fill="#1c2828">isolasjon</text>
</svg>
