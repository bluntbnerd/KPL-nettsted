<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Segoe UI, Arial, sans-serif">
  <title>Driftssirkelen: Operatøren overvåker prosessen, oppdager avvik, handler og dokumenterer. Så begynner sirkelen på nytt. Målet i midten er stabil og sikker drift.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="380" rx="10" fill="#ffffff"/>

  <!-- Midten -->
  <circle cx="280" cy="190" r="70" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <g font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="280" y="184">Stabil og</text>
    <text x="280" y="204">sikker drift</text>
  </g>

  <!-- Boksene -->
  <g stroke="#586868" stroke-width="2">
    <rect x="190" y="14" width="180" height="70" rx="8" fill="#bcd9ee"/>
    <rect x="366" y="155" width="180" height="70" rx="8" fill="#fde2b8"/>
    <rect x="190" y="296" width="180" height="70" rx="8" fill="#f6c6c0"/>
    <rect x="14" y="155" width="180" height="70" rx="8" fill="#cfe8c8"/>
  </g>
  <g fill="#1c2828" text-anchor="middle">
    <text x="280" y="42" font-size="16" font-weight="bold">1. Overvåke</text>
    <text x="280" y="64" font-size="12">prosessbilder, runder, prøver</text>
    <text x="456" y="183" font-size="16" font-weight="bold">2. Oppdage avvik</text>
    <text x="456" y="205" font-size="12">noe er ikke som normalt</text>
    <text x="280" y="324" font-size="16" font-weight="bold">3. Handle</text>
    <text x="280" y="346" font-size="12">justere, melde, stoppe</text>
    <text x="104" y="183" font-size="16" font-weight="bold">4. Dokumentere</text>
    <text x="104" y="205" font-size="12">logg og vaktoverlevering</text>
  </g>

  <!-- Piler med klokka -->
  <g stroke="#1c2828" stroke-width="2.5" fill="none" marker-end="url(#pil)">
    <path d="M372,60 Q450,80 456,150"/>
    <path d="M456,230 Q450,300 374,320"/>
    <path d="M186,320 Q110,300 104,230"/>
    <path d="M104,150 Q110,80 186,60"/>
  </g>
</svg>
