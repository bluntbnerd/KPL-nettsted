<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" height="210" font-family="Segoe UI, Arial, sans-serif">
  <title>Fem steg i en topunktskalibrering av et pH-meter. 1: Skyll elektroden med avionisert vann og dupp den tørr. 2: Sett elektroden i buffer pH 7,00, vent til verdien er stabil og bekreft. 3: Skyll og dupp tørr igjen. 4: Sett elektroden i buffer pH 4,00 eller 10,00, vent og bekreft. 5: Les av stigningen, kontroller med en buffer og skriv i loggboka.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="210" rx="10" fill="#ffffff"/>

  <!-- Bokser -->
  <g stroke="#1c2828" stroke-width="1.5">
    <rect x="12" y="40" width="118" height="150" rx="8" fill="#eef4fa"/>
    <rect x="150" y="40" width="118" height="150" rx="8" fill="#e8f5e9"/>
    <rect x="288" y="40" width="118" height="150" rx="8" fill="#eef4fa"/>
    <rect x="426" y="40" width="118" height="150" rx="8" fill="#fdecea"/>
    <rect x="564" y="40" width="124" height="150" rx="8" fill="#fff8e1"/>
  </g>

  <!-- Piler -->
  <g stroke="#1c2828" stroke-width="2" marker-end="url(#pil)">
    <line x1="131" y1="115" x2="148" y2="115"/>
    <line x1="269" y1="115" x2="286" y2="115"/>
    <line x1="407" y1="115" x2="424" y2="115"/>
    <line x1="545" y1="115" x2="562" y2="115"/>
  </g>

  <!-- Nummer -->
  <g fill="#1f5f9e">
    <circle cx="71" cy="24" r="13"/>
    <circle cx="209" cy="24" r="13"/>
    <circle cx="347" cy="24" r="13"/>
    <circle cx="485" cy="24" r="13"/>
    <circle cx="626" cy="24" r="13"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="71" y="29">1</text>
    <text x="209" y="29">2</text>
    <text x="347" y="29">3</text>
    <text x="485" y="29">4</text>
    <text x="626" y="29">5</text>
  </g>

  <!-- Tekst -->
  <g font-size="12" fill="#1c2828" text-anchor="middle">
    <text x="71" y="64" font-weight="bold">Skyll</text>
    <text x="71" y="86">Skyll elektroden</text>
    <text x="71" y="102">med avionisert</text>
    <text x="71" y="118">vann.</text>
    <text x="71" y="140">Dupp den tørr</text>
    <text x="71" y="156">med papir.</text>

    <text x="209" y="64" font-weight="bold">Buffer pH 7,00</text>
    <text x="209" y="86">Sett elektroden</text>
    <text x="209" y="102">i bufferen.</text>
    <text x="209" y="124">Vent til verdien</text>
    <text x="209" y="140">er stabil.</text>
    <text x="209" y="162">Bekreft.</text>

    <text x="347" y="64" font-weight="bold">Skyll igjen</text>
    <text x="347" y="86">Skyll og dupp</text>
    <text x="347" y="102">tørr, så ingen</text>
    <text x="347" y="118">buffer blir med</text>
    <text x="347" y="134">til neste.</text>

    <text x="485" y="64" font-weight="bold">Buffer pH 4,00</text>
    <text x="485" y="80">(eller 10,00)</text>
    <text x="485" y="102">Sett elektroden</text>
    <text x="485" y="118">i bufferen.</text>
    <text x="485" y="140">Vent til stabil.</text>
    <text x="485" y="162">Bekreft.</text>

    <text x="626" y="64" font-weight="bold">Sjekk og skriv</text>
    <text x="626" y="86">Les av stigningen.</text>
    <text x="626" y="108">Mål en buffer</text>
    <text x="626" y="124">som kontroll.</text>
    <text x="626" y="146">Skriv i</text>
    <text x="626" y="162">loggboka.</text>
  </g>
</svg>
