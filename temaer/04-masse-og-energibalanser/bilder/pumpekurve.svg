<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Segoe UI, Arial, sans-serif">
  <title>Forenklet pumpekurve for pumpe 1: løftehøyde mot volumstrøm</title>
  <rect x="0" y="0" width="600" height="320" rx="10" fill="#ffffff"/>
  <!-- akser: x = 70 + Q*4,5 (m3/h), y = 260 - H*5 (m) -->
  <g stroke="#e0e4e4" stroke-width="1">
    <line x1="70" y1="210" x2="520" y2="210"/>
    <line x1="70" y1="160" x2="520" y2="160"/>
    <line x1="70" y1="110" x2="520" y2="110"/>
    <line x1="70" y1="60" x2="520" y2="60"/>
  </g>
  <g stroke="#1c2828" stroke-width="2">
    <line x1="70" y1="260" x2="530" y2="260"/>
    <line x1="70" y1="260" x2="70" y2="30"/>
  </g>
  <g font-size="12" fill="#586868" text-anchor="middle">
    <text x="70" y="277">0</text>
    <text x="160" y="277">20</text>
    <text x="250" y="277">40</text>
    <text x="340" y="277">60</text>
    <text x="430" y="277">80</text>
    <text x="520" y="277">100</text>
  </g>
  <g font-size="12" fill="#586868" text-anchor="end">
    <text x="62" y="264">0</text>
    <text x="62" y="214">10</text>
    <text x="62" y="164">20</text>
    <text x="62" y="114">30</text>
    <text x="62" y="64">40</text>
  </g>
  <text x="300" y="303" font-size="13" text-anchor="middle" fill="#1c2828">volumstrøm Q (m³/h)</text>
  <text x="22" y="150" font-size="13" text-anchor="middle" fill="#1c2828" transform="rotate(-90 22 150)">løftehøyde H (mVs)</text>
  <!-- kurve: H = 40,2 - 0,0025 Q^2 -->
  <polyline points="70,59 160,64 232,75" fill="none" stroke="#2e6da4" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polyline points="232,75 250,79 295,90 340,104 385,120 430,139 475,160" fill="none" stroke="#2e6da4" stroke-width="3.5"/>
  <!-- punktene fra skiltet -->
  <g fill="#c0392b">
    <circle cx="232" cy="75" r="5"/>
    <circle cx="475" cy="160" r="5"/>
  </g>
  <g font-size="13" fill="#1c2828">
    <text x="240" y="62" font-weight="bold">36 m³/h, 37 mVs</text>
    <text x="440" y="185" font-weight="bold">90 m³/h, 20 mVs</text>
    <text x="300" y="150" fill="#586868">Mer motstand gir</text>
    <text x="300" y="166" fill="#586868">mindre volumstrøm</text>
  </g>
</svg>
