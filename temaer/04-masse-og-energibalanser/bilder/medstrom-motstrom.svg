<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>To grafer av temperaturen langs en varmeveksler. Medstrøm: temperaturene nærmer seg hverandre, og kald strøm ut blir aldri varmere enn varm strøm ut. Motstrøm: kald strøm ut kan bli varmere enn varm strøm ut.</title>
  <defs>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="300" rx="10" fill="#ffffff"/>
  <!-- Graf 1: medstrøm -->
  <text x="160" y="30" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2828">Medstrøm</text>
  <line x1="50" y1="50" x2="50" y2="230" stroke="#586868" stroke-width="1.5"/>
  <line x1="50" y1="230" x2="270" y2="230" stroke="#586868" stroke-width="1.5"/>
  <path d="M50,86 Q120,132 268,140" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
  <path d="M50,212 Q120,166 268,158" fill="none" stroke="#1f6fb2" stroke-width="3" marker-end="url(#mb)"/>
  <g font-size="12" fill="#1c2828">
    <text x="44" y="90" text-anchor="end">80</text>
    <text x="44" y="216" text-anchor="end">10</text>
    <text x="274" y="137">50</text>
    <text x="274" y="170">40</text>
  </g>
  <!-- Graf 2: motstrøm -->
  <text x="440" y="30" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2828">Motstrøm</text>
  <line x1="330" y1="50" x2="330" y2="230" stroke="#586868" stroke-width="1.5"/>
  <line x1="330" y1="230" x2="550" y2="230" stroke="#586868" stroke-width="1.5"/>
  <line x1="330" y1="86" x2="548" y2="175" stroke="#c0392b" stroke-width="3" marker-end="url(#mr)"/>
  <line x1="550" y1="212" x2="332" y2="123" stroke="#1f6fb2" stroke-width="3" marker-end="url(#mb)"/>
  <g font-size="12" fill="#1c2828">
    <text x="324" y="90" text-anchor="end">80</text>
    <text x="324" y="127" text-anchor="end">60</text>
    <text x="556" y="180">30</text>
    <text x="556" y="216">10</text>
  </g>
  <!-- akser og forklaring -->
  <g font-size="12" fill="#586868">
    <text x="160" y="250" text-anchor="middle">fra den ene enden til den andre</text>
    <text x="440" y="250" text-anchor="middle">fra den ene enden til den andre</text>
    <text x="20" y="140" transform="rotate(-90 20 140)" text-anchor="middle">temperatur (°C)</text>
    <text x="300" y="140" transform="rotate(-90 300 140)" text-anchor="middle">temperatur (°C)</text>
  </g>
  <g font-size="13">
    <line x1="150" y1="275" x2="180" y2="275" stroke="#c0392b" stroke-width="3"/>
    <text x="186" y="280" fill="#1c2828">varm strøm</text>
    <line x1="300" y1="275" x2="330" y2="275" stroke="#1f6fb2" stroke-width="3"/>
    <text x="336" y="280" fill="#1c2828">kald strøm</text>
  </g>
</svg>
