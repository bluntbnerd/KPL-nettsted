<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="220" rx="10" fill="#ffffff"/>
  <text x="20" y="32" font-size="15" font-weight="bold" fill="#1c2828">Energi for 1 kg vann</text>

  <!-- Akse -->
  <line x1="120" y1="50" x2="120" y2="180" stroke="#586868" stroke-width="2"/>

  <!-- Oppvarming 20 til 100 °C: 334 kJ (skala 2260 kJ = 440 px) -->
  <text x="110" y="78" font-size="13" text-anchor="end" fill="#1c2828">Varme opp</text>
  <text x="110" y="94" font-size="11" text-anchor="end" fill="#586868">20 → 100 °C</text>
  <rect x="120" y="64" width="65" height="36" fill="#f2a3a0" stroke="#d9534f" stroke-width="1.5"/>
  <text x="193" y="88" font-size="13" font-weight="bold" fill="#b5530f">334 kJ</text>

  <!-- Fordamping ved 100 °C: 2260 kJ -->
  <text x="110" y="138" font-size="13" text-anchor="end" fill="#1c2828">Koke bort</text>
  <text x="110" y="154" font-size="11" text-anchor="end" fill="#586868">ved 100 °C</text>
  <rect x="120" y="124" width="440" height="36" fill="#a6c8ea" stroke="#1e6fb8" stroke-width="1.5"/>
  <text x="550" y="148" font-size="13" font-weight="bold" text-anchor="end" fill="#1c2828">2260 kJ</text>

  <text x="340" y="204" font-size="12" text-anchor="middle" fill="#1c2828">Å koke bort vannet krever nesten 7 ganger så mye energi som å varme det opp.</text>
</svg>
