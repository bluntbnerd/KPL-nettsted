<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="Segoe UI, Arial, sans-serif">
  <title>Tre måter varme overføres på: varmeledning, konveksjon og varmestråling</title>
  <defs>
    <marker id="rod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="bla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7a9a"/></marker>
    <linearGradient id="stang" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c0392b"/><stop offset="1" stop-color="#b8c4c4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="250" rx="10" fill="#ffffff"/>
  <g stroke="#d8e0e0" stroke-width="1"><line x1="200" y1="20" x2="200" y2="230"/><line x1="400" y1="20" x2="400" y2="230"/></g>

  <!-- 1 Varmeledning -->
  <text x="100" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2828">varmeledning</text>
  <path d="M30 150 q8 -25 0 -40 q14 12 12 -15 q18 25 8 55 z" fill="#e67e22"/>
  <rect x="40" y="115" width="140" height="16" rx="3" fill="url(#stang)" stroke="#586868"/>
  <g stroke="#c0392b" stroke-width="2" marker-end="url(#rod)"><line x1="70" y1="100" x2="100" y2="100"/><line x1="115" y1="100" x2="145" y2="100"/></g>
  <text x="100" y="180" font-size="12" text-anchor="middle" fill="#1c2828">Varmen vandrer gjennom</text>
  <text x="100" y="196" font-size="12" text-anchor="middle" fill="#1c2828">stoffet fra den varme</text>
  <text x="100" y="212" font-size="12" text-anchor="middle" fill="#1c2828">enden til den kalde.</text>

  <!-- 2 Konveksjon -->
  <text x="300" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2828">konveksjon</text>
  <rect x="245" y="50" width="110" height="110" fill="#e8f2f6" stroke="#586868" stroke-width="2"/>
  <rect x="270" y="150" width="60" height="6" fill="#c0392b"/>
  <line x1="300" y1="140" x2="300" y2="68" stroke="#c0392b" stroke-width="2.5" marker-end="url(#rod)"/>
  <path d="M305 62 C 330 62, 340 64, 342 80" fill="none" stroke="#2a7a9a" stroke-width="2"/>
  <path d="M295 62 C 270 62, 260 64, 258 80" fill="none" stroke="#2a7a9a" stroke-width="2"/>
  <line x1="342" y1="80" x2="342" y2="135" stroke="#2a7a9a" stroke-width="2.5" marker-end="url(#bla)"/>
  <line x1="258" y1="80" x2="258" y2="135" stroke="#2a7a9a" stroke-width="2.5" marker-end="url(#bla)"/>
  <path d="M342 140 C 340 148, 325 146, 310 144" fill="none" stroke="#2a7a9a" stroke-width="2"/>
  <path d="M258 140 C 260 148, 275 146, 290 144" fill="none" stroke="#2a7a9a" stroke-width="2"/>
  <text x="300" y="180" font-size="12" text-anchor="middle" fill="#1c2828">Varm væske stiger opp,</text>
  <text x="300" y="196" font-size="12" text-anchor="middle" fill="#1c2828">kald synker ned. Væsken</text>
  <text x="300" y="212" font-size="12" text-anchor="middle" fill="#1c2828">tar varmen med seg.</text>

  <!-- 3 Varmestråling -->
  <text x="500" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2828">varmestråling</text>
  <rect x="420" y="80" width="40" height="60" rx="4" fill="#e67e22" stroke="#c0392b" stroke-width="2"/>
  <g fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#rod)">
    <path d="M468 90 q8 -6 16 0 q8 6 16 0 q8 -6 16 0 q8 6 14 0"/>
    <path d="M468 110 q8 -6 16 0 q8 6 16 0 q8 -6 16 0 q8 6 14 0"/>
    <path d="M468 130 q8 -6 16 0 q8 6 16 0 q8 -6 16 0 q8 6 14 0"/>
  </g>
  <rect x="540" y="75" width="10" height="70" fill="#8a9a9a"/>
  <text x="565" y="114" font-size="11" fill="#586868">skjerm</text>
  <text x="500" y="180" font-size="12" text-anchor="middle" fill="#1c2828">Varme stoffer sender ut</text>
  <text x="500" y="196" font-size="12" text-anchor="middle" fill="#1c2828">stråling som går gjennom</text>
  <text x="500" y="212" font-size="12" text-anchor="middle" fill="#1c2828">lufta, også uten stoff.</text>
</svg>
