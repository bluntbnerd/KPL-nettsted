<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="Segoe UI, Arial, sans-serif">
  <title>Smelteverk med returstrøm: råstoff inn i ovnen, metall til knusing og sikting, finstoff tilbake til ovnen, salgbart produkt ut, slagg, ovnsgass og støv ut</title>
  <defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker></defs>
  <rect x="0" y="0" width="600" height="360" rx="10" fill="#ffffff"/>
  <!-- systemgrense 2: hele anlegget -->
  <rect x="100" y="55" width="372" height="245" rx="6" fill="none" stroke="#2f6fb0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="108" y="47" font-size="13" fill="#2f6fb0" font-weight="bold">systemgrense 2: hele anlegget</text>
  <!-- systemgrense 1: ovnen -->
  <rect x="125" y="95" width="140" height="125" rx="6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="131" y="88" font-size="13" fill="#c0392b" font-weight="bold">systemgrense 1: ovnen</text>
  <!-- utstyr -->
  <rect x="140" y="110" width="110" height="90" rx="8" fill="#fde3a7" stroke="#586868" stroke-width="2"/>
  <text x="195" y="160" font-size="14" text-anchor="middle" fill="#1c2828">smelteovn</text>
  <rect x="340" y="115" width="110" height="80" rx="8" fill="#e0e4e4" stroke="#586868" stroke-width="2"/>
  <text x="395" y="151" font-size="13" text-anchor="middle" fill="#1c2828">knusing og</text>
  <text x="395" y="168" font-size="13" text-anchor="middle" fill="#1c2828">sikting</text>
  <!-- strømmer -->
  <g stroke="#1c2828" stroke-width="2.5" fill="none">
    <line x1="20" y1="155" x2="138" y2="155" marker-end="url(#pil)"/>
    <line x1="250" y1="155" x2="338" y2="155" marker-end="url(#pil)"/>
    <line x1="450" y1="155" x2="585" y2="155" marker-end="url(#pil)"/>
    <polyline points="395,195 395,265 195,265 195,203" marker-end="url(#pil)"/>
  </g>
  <line x1="150" y1="202" x2="150" y2="328" stroke="#586868" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#pil)"/>
  <text x="160" y="343" font-size="13" fill="#586868">slagg, ovnsgass og støv ut (ikke med i eksempelet)</text>
  <g font-size="13" fill="#1c2828">
    <text x="22" y="140" font-weight="bold">Råstoff</text>
    <text x="302" y="128" text-anchor="middle" font-weight="bold">metall</text>
    <text x="302" y="145" text-anchor="middle">1200 kg/h</text>
    <text x="480" y="127" font-weight="bold">Salgbart</text>
    <text x="480" y="144" font-weight="bold">produkt: ? kg/h</text>
    <text x="295" y="285" text-anchor="middle" font-weight="bold">returstrøm: finstoff, 15 % = 180 kg/h</text>
  </g>
</svg>
