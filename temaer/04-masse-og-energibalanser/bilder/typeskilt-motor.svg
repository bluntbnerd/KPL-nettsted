<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="Segoe UI, Arial, sans-serif">
  <title>Tenkt typeskilt for en trefasemotor på 2,2 kW</title>
  <rect x="0" y="0" width="520" height="250" rx="10" fill="#ffffff"/>
  <rect x="20" y="15" width="480" height="220" rx="12" fill="#e4e9ea" stroke="#586868" stroke-width="2.5"/>
  <circle cx="36" cy="31" r="5" fill="#b8c4c4" stroke="#586868"/>
  <circle cx="484" cy="31" r="5" fill="#b8c4c4" stroke="#586868"/>
  <circle cx="36" cy="219" r="5" fill="#b8c4c4" stroke="#586868"/>
  <circle cx="484" cy="219" r="5" fill="#b8c4c4" stroke="#586868"/>
  <text x="260" y="44" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2828">3~ Motor</text>
  <line x1="40" y1="56" x2="480" y2="56" stroke="#586868" stroke-width="1.5"/>
  <g font-size="13" fill="#1c2828">
    <text x="50" y="84">Effekt</text><text x="250" y="84" text-anchor="end" font-weight="bold">2,2 kW</text>
    <text x="280" y="84">Frekvens</text><text x="470" y="84" text-anchor="end" font-weight="bold">50 Hz</text>
    <text x="50" y="118">Spenning</text><text x="250" y="118" text-anchor="end" font-weight="bold">400 V</text>
    <text x="280" y="118">Turtall</text><text x="470" y="118" text-anchor="end" font-weight="bold">2880 r/min</text>
    <text x="50" y="152">Strøm</text><text x="250" y="152" text-anchor="end" font-weight="bold">4,6 A</text>
    <text x="280" y="152">Virkningsgrad</text><text x="470" y="152" text-anchor="end" font-weight="bold">85 %</text>
    <text x="50" y="186">Beskyttelse</text><text x="250" y="186" text-anchor="end" font-weight="bold">IP55</text>
    <text x="280" y="186">Driftsform</text><text x="470" y="186" text-anchor="end" font-weight="bold">S1</text>
  </g>
  <g stroke="#b8c4c4" stroke-width="1"><line x1="40" y1="96" x2="480" y2="96"/><line x1="40" y1="130" x2="480" y2="130"/><line x1="40" y1="164" x2="480" y2="164"/><line x1="265" y1="64" x2="265" y2="196"/></g>
  <text x="260" y="218" font-size="11" text-anchor="middle" fill="#586868">Tenkt skilt for opplæring</text>
</svg>
