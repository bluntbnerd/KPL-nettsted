<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="Segoe UI, Arial, sans-serif">
  <title>Jording: feilstrømmen går gjennom jordlederen, og jordfeilbryteren bryter</title>
  <defs>
    <marker id="rod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="250" rx="10" fill="#ffffff"/>
  <!-- sikringsskap -->
  <rect x="30" y="50" width="120" height="140" rx="6" fill="#eef3f3" stroke="#586868" stroke-width="2.5"/>
  <text x="90" y="42" font-size="12" text-anchor="middle" fill="#1c2828">sikringsskap</text>
  <!-- ledere inn fra nettet -->
  <line x1="8" y1="80" x2="60" y2="80" stroke="#8b5a2b" stroke-width="4"/>
  <line x1="8" y1="110" x2="60" y2="110" stroke="#2a6fb0" stroke-width="4"/>
  <!-- ledere ut til apparatet -->
  <line x1="120" y1="80" x2="470" y2="80" stroke="#8b5a2b" stroke-width="4"/>
  <line x1="120" y1="110" x2="430" y2="110" stroke="#2a6fb0" stroke-width="4"/>
  <!-- jordfeilbryter: fase og nøytral går gjennom -->
  <rect x="60" y="64" width="60" height="62" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <line x1="60" y1="80" x2="120" y2="80" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="60" y1="110" x2="120" y2="110" stroke="#2a6fb0" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="90" y="97" font-size="10" text-anchor="middle" fill="#1c2828">jordfeil-</text>
  <text x="90" y="105" font-size="10" text-anchor="middle" fill="#1c2828">bryter</text>
  <!-- jordleder: går utenom jordfeilbryteren, ned til jord -->
  <path d="M400 150 H90 V210" fill="none" stroke="#e0c020" stroke-width="4"/>
  <path d="M400 150 H90 V210" fill="none" stroke="#3a8a3a" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="74" y1="210" x2="106" y2="210" stroke="#3a8a3a" stroke-width="2.5"/>
  <line x1="80" y1="216" x2="100" y2="216" stroke="#3a8a3a" stroke-width="2.5"/>
  <line x1="86" y1="222" x2="94" y2="222" stroke="#3a8a3a" stroke-width="2.5"/>
  <text x="112" y="222" font-size="11" fill="#3a8a3a">jord</text>
  <g font-size="12" fill="#1c2828">
    <text x="190" y="73">fase (brun)</text>
    <text x="190" y="103">nøytral (blå)</text>
    <text x="190" y="143">jord (gul-grønn)</text>
  </g>
  <!-- apparat -->
  <rect x="400" y="50" width="160" height="140" rx="6" fill="none" stroke="#586868" stroke-width="5"/>
  <text x="480" y="42" font-size="12" text-anchor="middle" fill="#1c2828">apparat med metallkasse</text>
  <rect x="430" y="100" width="60" height="30" fill="#eef3f3" stroke="#586868" stroke-width="1.5"/>
  <line x1="470" y1="80" x2="470" y2="100" stroke="#8b5a2b" stroke-width="3"/>
  <circle cx="400" cy="150" r="5" fill="#3a8a3a"/>
  <!-- feil -->
  <path d="M470 80 L490 70 L500 82 L520 62 L530 74 L557 52" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="500" y="152" font-size="11" text-anchor="middle" fill="#c0392b">feil: fasen</text>
  <text x="500" y="166" font-size="11" text-anchor="middle" fill="#c0392b">berører kassa</text>
  <!-- feilstrøm -->
  <line x1="380" y1="166" x2="170" y2="166" stroke="#c0392b" stroke-width="2.5" marker-end="url(#rod)"/>
  <text x="275" y="184" font-size="12" text-anchor="middle" fill="#c0392b">feilstrømmen går i jordlederen, utenom jordfeilbryteren</text>
  <text x="300" y="240" font-size="11" text-anchor="middle" fill="#1c2828">En del av strømmen kommer ikke tilbake i nøytrallederen. Jordfeilbryteren merker det og bryter.</text>
</svg>
