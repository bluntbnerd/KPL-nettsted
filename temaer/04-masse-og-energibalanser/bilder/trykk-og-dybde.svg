<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>Trykket i en tank øker med dybden</title>
  <defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker></defs>
  <rect x="0" y="0" width="600" height="330" rx="10" fill="#ffffff"/>
  <!-- tank: 1,20 m vann = 240 px, 1 m = 200 px. Bunn ved y = 290, overflate ved y = 50 -->
  <rect x="120" y="50" width="160" height="240" fill="#cfe4f7"/>
  <path d="M120,40 L120,290 L280,290 L280,40" fill="none" stroke="#586868" stroke-width="3"/>
  <line x1="120" y1="50" x2="280" y2="50" stroke="#2e6da4" stroke-width="2"/>
  <text x="200" y="42" font-size="13" text-anchor="middle" fill="#2e6da4">overflate (0 m)</text>
  <text x="200" y="318" font-size="13" text-anchor="middle" fill="#1c2828">Tank 1 i pumperommet</text>
  <!-- målepunkter -->
  <g fill="#1c2828">
    <circle cx="200" cy="110" r="4"/>
    <circle cx="200" cy="170" r="4"/>
    <circle cx="200" cy="288" r="4"/>
  </g>
  <!-- piler som blir lengre -->
  <g stroke="#c0392b" stroke-width="3" marker-end="url(#pil)">
    <line x1="290" y1="110" x2="320" y2="110"/>
    <line x1="290" y1="170" x2="350" y2="170"/>
    <line x1="290" y1="284" x2="410" y2="284"/>
  </g>
  <g font-size="14" fill="#1c2828">
    <text x="330" y="105" font-weight="bold">0,30 m dypt</text>
    <text x="330" y="122">ca. 2 900 Pa</text>
    <text x="360" y="165" font-weight="bold">0,60 m dypt</text>
    <text x="360" y="182">ca. 5 900 Pa</text>
    <text x="420" y="270" font-weight="bold">1,20 m dypt (bunnen)</text>
    <text x="420" y="287">ca. 11 800 Pa</text>
  </g>
  <!-- høydemål -->
  <g stroke="#586868" stroke-width="1.5">
    <line x1="80" y1="50" x2="80" y2="290"/>
    <line x1="72" y1="50" x2="88" y2="50"/>
    <line x1="72" y1="290" x2="88" y2="290"/>
  </g>
  <text x="70" y="175" font-size="14" text-anchor="end" fill="#586868">h</text>
</svg>
