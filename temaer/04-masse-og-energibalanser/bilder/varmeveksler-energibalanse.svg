<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="Segoe UI, Arial, sans-serif">
  <title>Varmeveksler med systemgrense: varm strøm inn på 80 grader og ut på 60 grader, kjølevann inn på 10 grader og ut på 25 grader i motsatt retning</title>
  <defs>
    <marker id="pil-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="pil-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
    <marker id="pil-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#586868"/></marker>
  </defs>
  <rect x="0" y="0" width="620" height="320" rx="10" fill="#ffffff"/>
  <!-- systemgrense -->
  <rect x="175" y="60" width="270" height="200" rx="6" fill="none" stroke="#586868" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="282" font-size="13" text-anchor="middle" fill="#586868" font-weight="bold">systemgrense</text>
  <!-- varmeveksler: to kanaler med vegg imellom -->
  <rect x="200" y="100" width="220" height="50" fill="#f9d9d4" stroke="#586868" stroke-width="2"/>
  <rect x="200" y="160" width="220" height="50" fill="#d4e6f6" stroke="#586868" stroke-width="2"/>
  <rect x="200" y="150" width="220" height="10" fill="#9aa5a5"/>
  <text x="310" y="130" font-size="13" text-anchor="middle" fill="#1c2828">varm side</text>
  <text x="310" y="190" font-size="13" text-anchor="middle" fill="#1c2828">kald side (kjølevann)</text>
  <text x="430" y="158" font-size="11" fill="#586868">vegg</text>
  <!-- varme gjennom veggen -->
  <g stroke="#c0392b" stroke-width="2" marker-end="url(#pil-r)">
    <line x1="250" y1="140" x2="250" y2="172"/>
    <line x1="310" y1="140" x2="310" y2="172"/>
    <line x1="370" y1="140" x2="370" y2="172"/>
  </g>
  <!-- varm strøm: venstre til høyre -->
  <line x1="20" y1="125" x2="198" y2="125" stroke="#c0392b" stroke-width="3" marker-end="url(#pil-r)"/>
  <line x1="422" y1="125" x2="600" y2="125" stroke="#c0392b" stroke-width="3" marker-end="url(#pil-r)"/>
  <!-- kald strøm: høyre til venstre (motstrøm) -->
  <line x1="600" y1="185" x2="422" y2="185" stroke="#1f6fb2" stroke-width="3" marker-end="url(#pil-b)"/>
  <line x1="198" y1="185" x2="20" y2="185" stroke="#1f6fb2" stroke-width="3" marker-end="url(#pil-b)"/>
  <!-- tap -->
  <line x1="310" y1="98" x2="310" y2="40" stroke="#586868" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pil-g)"/>
  <text x="318" y="34" font-size="13" fill="#586868">tap til omgivelsene</text>
  <!-- tekst -->
  <g font-size="14" fill="#1c2828">
    <text x="22" y="98" font-weight="bold" fill="#c0392b">Varm inn: 80 °C</text>
    <text x="22" y="114">1,5 kg/s</text>
    <text x="460" y="98" font-weight="bold" fill="#c0392b">Varm ut: 60 °C</text>
    <text x="460" y="215" font-weight="bold" fill="#1f6fb2">Kald inn: 10 °C</text>
    <text x="460" y="231">2,0 kg/s</text>
    <text x="22" y="215" font-weight="bold" fill="#1f6fb2">Kald ut: 25 °C</text>
  </g>
</svg>
