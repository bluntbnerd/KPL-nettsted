<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Segoe UI, Arial, sans-serif">
  <title>Vannkrets og strømkrets ved siden av hverandre</title>
  <defs>
    <marker id="bla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7a9a"/></marker>
    <marker id="rod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="260" rx="10" fill="#ffffff"/>
  <line x1="300" y1="15" x2="300" y2="245" stroke="#d8e0e0" stroke-width="1"/>

  <!-- Vannkrets -->
  <text x="160" y="28" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2828">vannkrets</text>
  <path d="M80 106 V70 H240 V115 M240 145 V190 H80 V154" fill="none" stroke="#9ccbe0" stroke-width="12"/>
  <line x1="120" y1="70" x2="200" y2="70" stroke="#2a7a9a" stroke-width="2.5" marker-end="url(#bla)"/>
  <line x1="200" y1="190" x2="120" y2="190" stroke="#2a7a9a" stroke-width="2.5" marker-end="url(#bla)"/>
  <text x="160" y="52" font-size="12" text-anchor="middle" fill="#2a7a9a">vannet renner</text>
  <!-- pumpe -->
  <circle cx="80" cy="130" r="24" fill="#ffffff" stroke="#586868" stroke-width="2.5"/>
  <path d="M80 114 L92 140 L68 140 z" fill="#586868"/>
  <text x="50" y="134" font-size="12" text-anchor="end" fill="#1c2828">pumpe</text>
  <!-- ventil -->
  <path d="M226 115 H254 L240 130 z M226 145 H254 L240 130 z" fill="#586868"/>
  <text x="258" y="134" font-size="12" fill="#1c2828">ventil</text>
  <text x="160" y="222" font-size="12" text-anchor="middle" fill="#1c2828">Pumpen gir trykk.</text>
  <text x="160" y="239" font-size="12" text-anchor="middle" fill="#1c2828">Den trange ventilen bremser vannet.</text>

  <!-- Strømkrets -->
  <text x="445" y="28" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2828">strømkrets</text>
  <path d="M370 122 V70 H520 V108 M520 152 V190 H370 V138" fill="none" stroke="#1c2828" stroke-width="3"/>
  <line x1="410" y1="58" x2="480" y2="58" stroke="#c0392b" stroke-width="2.5" marker-end="url(#rod)"/>
  <line x1="480" y1="202" x2="410" y2="202" stroke="#c0392b" stroke-width="2.5" marker-end="url(#rod)"/>
  <text x="445" y="46" font-size="12" text-anchor="middle" fill="#c0392b">strømmen går</text>
  <!-- batteri -->
  <line x1="355" y1="122" x2="385" y2="122" stroke="#1c2828" stroke-width="3"/>
  <line x1="362" y1="138" x2="378" y2="138" stroke="#1c2828" stroke-width="6"/>
  <text x="392" y="120" font-size="14" font-weight="bold" fill="#1c2828">+</text>
  <text x="392" y="146" font-size="14" font-weight="bold" fill="#1c2828">−</text>
  <text x="348" y="134" font-size="12" text-anchor="end" fill="#1c2828">batteri</text>
  <!-- motstand -->
  <rect x="512" y="108" width="16" height="44" fill="#ffffff" stroke="#1c2828" stroke-width="2.5"/>
  <text x="534" y="134" font-size="12" fill="#1c2828">motstand</text>
  <text x="445" y="228" font-size="12" text-anchor="middle" fill="#1c2828">Batteriet gir spenning.</text>
  <text x="445" y="245" font-size="12" text-anchor="middle" fill="#1c2828">Motstanden bremser strømmen.</text>
</svg>
