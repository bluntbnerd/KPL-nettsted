<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="320" height="170" font-family="Segoe UI, Arial, sans-serif">
  <title>I en beholder er det 3 nitrogenmolekyler og 6 hydrogenmolekyler</title>
  <rect x="0" y="0" width="320" height="170" rx="10" fill="#ffffff"/>
  <rect x="15" y="15" width="290" height="120" rx="8" fill="#f3f6f6" stroke="#8a9a9a"/>
  <g fill="#cfe3f7" stroke="#1e6fb8" stroke-width="1.2">
    <circle cx="45" cy="45" r="13"/><circle cx="67" cy="45" r="13"/>
    <circle cx="45" cy="105" r="13"/><circle cx="67" cy="105" r="13"/>
    <circle cx="115" cy="75" r="13"/><circle cx="137" cy="75" r="13"/>
  </g>
  <g fill="#eef3f3" stroke="#586868" stroke-width="1.2">
    <circle cx="185" cy="40" r="9"/><circle cx="200" cy="40" r="9"/>
    <circle cx="245" cy="45" r="9"/><circle cx="260" cy="45" r="9"/>
    <circle cx="190" cy="80" r="9"/><circle cx="205" cy="80" r="9"/>
    <circle cx="255" cy="85" r="9"/><circle cx="270" cy="85" r="9"/>
    <circle cx="190" cy="115" r="9"/><circle cx="205" cy="115" r="9"/>
    <circle cx="245" cy="118" r="9"/><circle cx="260" cy="118" r="9"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="45" y="49">N</text><text x="67" y="49">N</text><text x="45" y="109">N</text><text x="67" y="109">N</text><text x="115" y="79">N</text><text x="137" y="79">N</text>
  </g>
  <text x="160" y="158" font-size="13" text-anchor="middle" fill="#1c2828">N₂ + 3 H₂ → 2 NH₃</text>
</svg>
