<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" font-family="Segoe UI, Arial, sans-serif">
  <title>Vann er et polart molekyl, karbondioksid er upolart</title>
  <rect x="0" y="0" width="560" height="250" rx="10" fill="#ffffff"/>

  <!-- Vann: vinklet molekyl -->
  <g stroke="#1c2828" stroke-width="4">
    <line x1="140" y1="95" x2="95" y2="150"/>
    <line x1="140" y1="95" x2="185" y2="150"/>
  </g>
  <circle cx="140" cy="95" r="30" fill="#f6c4c4" stroke="#9a2b2b" stroke-width="1.5"/>
  <circle cx="95" cy="150" r="20" fill="#eef3f3" stroke="#586868" stroke-width="1.5"/>
  <circle cx="185" cy="150" r="20" fill="#eef3f3" stroke="#586868" stroke-width="1.5"/>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="140" y="101">O</text><text x="95" y="156">H</text><text x="185" y="156">H</text>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="140" y="52" fill="#9a2b2b">δ−</text>
    <text x="68" y="188" fill="#1e6fb8">δ+</text>
    <text x="212" y="188" fill="#1e6fb8">δ+</text>
  </g>

  <!-- CO2: rett molekyl -->
  <g stroke="#1c2828" stroke-width="3">
    <line x1="348" y1="114" x2="388" y2="114"/><line x1="348" y1="124" x2="388" y2="124"/>
    <line x1="412" y1="114" x2="452" y2="114"/><line x1="412" y1="124" x2="452" y2="124"/>
  </g>
  <circle cx="330" cy="119" r="24" fill="#f6c4c4" stroke="#9a2b2b" stroke-width="1.5"/>
  <circle cx="400" cy="119" r="20" fill="#c9d1d1" stroke="#586868" stroke-width="1.5"/>
  <circle cx="470" cy="119" r="24" fill="#f6c4c4" stroke="#9a2b2b" stroke-width="1.5"/>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="330" y="125">O</text><text x="400" y="125">C</text><text x="470" y="125">O</text>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="330" y="82" fill="#9a2b2b">δ−</text>
    <text x="400" y="82" fill="#1e6fb8">δ+</text>
    <text x="470" y="82" fill="#9a2b2b">δ−</text>
  </g>

  <g font-size="14" text-anchor="middle" fill="#1c2828">
    <text x="140" y="218" font-weight="bold">Vann, H₂O: polart</text>
    <text x="140" y="237">minus-side og pluss-side</text>
    <text x="400" y="218" font-weight="bold">Karbondioksid, CO₂: upolart</text>
    <text x="400" y="237">ladningene opphever hverandre</text>
  </g>
</svg>
