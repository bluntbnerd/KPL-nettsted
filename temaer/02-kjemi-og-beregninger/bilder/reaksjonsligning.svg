<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" font-family="Segoe UI, Arial, sans-serif">
  <title>Reaksjonsligningen 2 H2 + O2 gir 2 H2O, tegnet med molekyler</title>
  <rect x="0" y="0" width="600" height="290" rx="10" fill="#ffffff"/>
  <!-- Ligning -->
  <g font-size="30" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="105" y="50"><tspan fill="#6a3fb5">2</tspan> H<tspan font-size="18" dy="8">2</tspan></text>
    <text x="195" y="50">+</text>
    <text x="255" y="50">O<tspan font-size="18" dy="8">2</tspan></text>
    <text x="340" y="50">→</text>
    <text x="465" y="50"><tspan fill="#6a3fb5">2</tspan> H<tspan font-size="18" dy="8">2</tspan>O</text>
  </g>
  <!-- 2 H2 -->
  <g fill="#eef3f3" stroke="#586868" stroke-width="1.5">
    <circle cx="80" cy="105" r="15"/><circle cx="104" cy="105" r="15"/>
    <circle cx="80" cy="150" r="15"/><circle cx="104" cy="150" r="15"/>
  </g>
  <!-- O2 -->
  <g fill="#f6c4c4" stroke="#9a2b2b" stroke-width="1.5">
    <circle cx="240" cy="128" r="20"/><circle cx="272" cy="128" r="20"/>
  </g>
  <!-- 2 H2O -->
  <g fill="#f6c4c4" stroke="#9a2b2b" stroke-width="1.5"><circle cx="465" cy="100" r="20"/><circle cx="465" cy="160" r="20"/></g>
  <g fill="#eef3f3" stroke="#586868" stroke-width="1.5">
    <circle cx="442" cy="115" r="14"/><circle cx="488" cy="115" r="14"/>
    <circle cx="442" cy="175" r="14"/><circle cx="488" cy="175" r="14"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="80" y="109">H</text><text x="104" y="109">H</text><text x="80" y="154">H</text><text x="104" y="154">H</text>
    <text x="240" y="132">O</text><text x="272" y="132">O</text>
    <text x="465" y="104">O</text><text x="465" y="164">O</text>
    <text x="442" y="119">H</text><text x="488" y="119">H</text><text x="442" y="179">H</text><text x="488" y="179">H</text>
  </g>
  <!-- Klammer -->
  <g fill="none" stroke="#586868" stroke-width="1.5">
    <path d="M55 200 V210 H300 V200"/><path d="M415 200 V210 H515 V200"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#1c2828">
    <text x="178" y="232" font-weight="bold">Reaktanter (utgangsstoffer)</text>
    <text x="178" y="252">4 H og 2 O</text>
    <text x="465" y="232" font-weight="bold">Produkt</text>
    <text x="465" y="252">4 H og 2 O</text>
    <text x="300" y="280" fill="#00796b" font-weight="bold">Like mange atomer av hvert slag på begge sider: ligningen er balansert.</text>
  </g>
</svg>
