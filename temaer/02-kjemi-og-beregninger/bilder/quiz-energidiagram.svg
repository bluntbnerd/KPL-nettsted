<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210" font-family="Segoe UI, Arial, sans-serif">
  <title>Energidiagram der produktene ligger høyere enn reaktantene</title>
  <defs><marker id="akse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#586868"/></marker></defs>
  <rect x="0" y="0" width="280" height="210" rx="10" fill="#ffffff"/>
  <line x1="40" y1="190" x2="40" y2="20" stroke="#586868" stroke-width="1.5" marker-end="url(#akse)"/>
  <text x="28" y="110" font-size="12" fill="#586868" transform="rotate(-90 28 110)" text-anchor="middle">energi</text>
  <g stroke="#1c2828" stroke-width="4"><line x1="60" y1="160" x2="130" y2="160"/><line x1="180" y1="65" x2="250" y2="65"/></g>
  <path d="M130 160 C 148 30, 162 30, 180 65" fill="none" stroke="#8a9a9a" stroke-width="1.5" stroke-dasharray="4 3"/>
