<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Segoe UI, Arial, sans-serif">
  <title>Energidiagram for en eksoterm og en endoterm reaksjon</title>
  <defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5530f"/></marker>
  <marker id="akse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#586868"/></marker></defs>
  <rect x="0" y="0" width="600" height="260" rx="10" fill="#ffffff"/>
  <!-- Eksoterm -->
  <g stroke="#586868" stroke-width="1.5" marker-end="url(#akse)"><line x1="40" y1="200" x2="40" y2="30"/></g>
  <text x="30" y="115" font-size="12" fill="#586868" transform="rotate(-90 30 115)" text-anchor="middle">energi</text>
  <g stroke="#1c2828" stroke-width="4"><line x1="60" y1="70" x2="140" y2="70"/><line x1="190" y1="170" x2="270" y2="170"/></g>
  <path d="M140 70 C 155 40, 170 40, 190 170" fill="none" stroke="#8a9a9a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="230" y1="72" x2="230" y2="164" stroke="#b5530f" stroke-width="2.5" marker-end="url(#pil)"/>
  <g font-size="13" fill="#1c2828" text-anchor="middle">
    <text x="100" y="60">reaktanter</text><text x="230" y="190">produkter</text>
    <text x="268" y="122" text-anchor="start" fill="#b5530f" font-weight="bold">ΔH &lt; 0</text>
  </g>
  <text x="160" y="225" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2828">Eksoterm</text>
  <text x="160" y="245" font-size="13" text-anchor="middle" fill="#1c2828">gir fra seg energi, omgivelsene blir varmere</text>
  <!-- Endoterm -->
  <g stroke="#586868" stroke-width="1.5" marker-end="url(#akse)"><line x1="330" y1="200" x2="330" y2="30"/></g>
  <text x="320" y="115" font-size="12" fill="#586868" transform="rotate(-90 320 115)" text-anchor="middle">energi</text>
  <g stroke="#1c2828" stroke-width="4"><line x1="350" y1="170" x2="430" y2="170"/><line x1="480" y1="70" x2="560" y2="70"/></g>
  <path d="M430 170 C 450 40, 465 40, 480 70" fill="none" stroke="#8a9a9a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="520" y1="168" x2="520" y2="76" stroke="#b5530f" stroke-width="2.5" marker-end="url(#pil)"/>
  <g font-size="13" fill="#1c2828" text-anchor="middle">
    <text x="390" y="190">reaktanter</text><text x="520" y="60">produkter</text>
    <text x="528" y="128" text-anchor="start" fill="#b5530f" font-weight="bold">ΔH &gt; 0</text>
  </g>
  <text x="450" y="225" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c2828">Endoterm</text>
  <text x="450" y="245" font-size="13" text-anchor="middle" fill="#1c2828">tar opp energi, omgivelsene blir kaldere</text>
</svg>
