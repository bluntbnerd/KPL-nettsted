<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" font-family="Segoe UI, Arial, sans-serif">
  <title>To hydrogenatomer deler et elektronpar og danner et hydrogenmolekyl</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="190" rx="10" fill="#ffffff"/>

  <!-- To løse hydrogenatomer -->
  <g fill="none" stroke="#8a9a9a" stroke-width="1.5">
    <circle cx="60" cy="90" r="36"/><circle cx="150" cy="90" r="36"/>
  </g>
  <circle cx="60" cy="90" r="13" fill="#fde3a7" stroke="#b5530f" stroke-width="1.5"/>
  <circle cx="150" cy="90" r="13" fill="#fde3a7" stroke="#b5530f" stroke-width="1.5"/>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="60" y="95">H</text><text x="150" y="95">H</text>
  </g>
  <g fill="#1e6fb8"><circle cx="96" cy="90" r="5"/><circle cx="114" cy="90" r="5"/></g>

  <line x1="198" y1="90" x2="250" y2="90" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>

  <!-- Hydrogenmolekyl -->
  <ellipse cx="350" cy="90" rx="13" ry="26" fill="#fff1d6" stroke="#f2a900" stroke-width="1.5"/>
  <g fill="none" stroke="#8a9a9a" stroke-width="1.5">
    <circle cx="320" cy="90" r="36"/><circle cx="380" cy="90" r="36"/>
  </g>
  <circle cx="320" cy="90" r="13" fill="#fde3a7" stroke="#b5530f" stroke-width="1.5"/>
  <circle cx="380" cy="90" r="13" fill="#fde3a7" stroke="#b5530f" stroke-width="1.5"/>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="320" y="95">H</text><text x="380" y="95">H</text>
  </g>
  <g fill="#1e6fb8"><circle cx="350" cy="80" r="5"/><circle cx="350" cy="100" r="5"/></g>

  <!-- Strekformel -->
  <text x="490" y="102" font-size="34" font-weight="bold" text-anchor="middle" fill="#1c2828">H–H</text>

  <g font-size="13" text-anchor="middle" fill="#1c2828">
    <text x="105" y="150">2 hydrogenatomer,</text>
    <text x="105" y="167">1 elektron hver</text>
    <text x="350" y="150">deler 2 elektroner</text>
    <text x="350" y="167">(ett elektronpar)</text>
    <text x="490" y="150">strekformel:</text>
    <text x="490" y="167">streken = delt par</text>
  </g>
</svg>
