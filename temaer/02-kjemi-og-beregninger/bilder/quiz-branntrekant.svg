<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" font-family="Segoe UI, Arial, sans-serif">
  <title>Branntrekant der den ene siden er merket brensel, den andre varme, og den tredje har et spørsmålstegn</title>
  <rect x="0" y="0" width="300" height="220" rx="10" fill="#ffffff"/>
  <polygon points="150,25 265,185 35,185" fill="#fdf1e7" stroke="#b5530f" stroke-width="4" stroke-linejoin="round"/>
  <g font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="72" y="100" transform="rotate(-54 72 100)">BRENSEL</text>
    <text x="235" y="100" font-size="30" fill="#b5530f">?</text>
    <text x="150" y="208">VARME</text>
  </g>
</svg>
