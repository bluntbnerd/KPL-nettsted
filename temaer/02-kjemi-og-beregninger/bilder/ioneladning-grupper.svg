<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="Segoe UI, Arial, sans-serif">
  <title>Hvilken ladning ionene får i hver gruppe</title>
  <rect x="0" y="0" width="600" height="230" rx="10" fill="#ffffff"/>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="20" y="38" text-anchor="start">Gruppe</text>
    <text x="118" y="38">1</text><text x="178" y="38">2</text><text x="248" y="38">13</text><text x="308" y="38">14</text>
    <text x="368" y="38">15</text><text x="428" y="38">16</text><text x="488" y="38">17</text><text x="548" y="38">18</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#586868">
    <text x="20" y="66" text-anchor="start">Ytterelektroner</text>
    <text x="118" y="66">1</text><text x="178" y="66">2</text><text x="248" y="66">3</text><text x="308" y="66">4</text>
    <text x="368" y="66">5</text><text x="428" y="66">6</text><text x="488" y="66">7</text><text x="548" y="66">8</text>
  </g>
  <g stroke="#586868" stroke-width="1">
    <rect x="93" y="80" width="50" height="50" rx="6" fill="#cfe3f7"/><rect x="153" y="80" width="50" height="50" rx="6" fill="#cfe3f7"/><rect x="223" y="80" width="50" height="50" rx="6" fill="#cfe3f7"/>
    <rect x="283" y="80" width="50" height="50" rx="6" fill="#eef3f3"/>
    <rect x="343" y="80" width="50" height="50" rx="6" fill="#fde3a7"/><rect x="403" y="80" width="50" height="50" rx="6" fill="#fde3a7"/><rect x="463" y="80" width="50" height="50" rx="6" fill="#fde3a7"/>
    <rect x="523" y="80" width="50" height="50" rx="6" fill="#eef3f3"/>
  </g>
  <g font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2828">
    <text x="118" y="112">+1</text><text x="178" y="112">+2</text><text x="248" y="112">+3</text>
    <text x="368" y="112">−3</text><text x="428" y="112">−2</text><text x="488" y="112">−1</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1c2828">
    <text x="308" y="103">deler</text><text x="308" y="118">heller</text>
    <text x="548" y="103">ingen</text><text x="548" y="118">ioner</text>
    <text x="20" y="110" text-anchor="start" font-weight="bold">Ladning</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#1c2828">
    <text x="20" y="160" text-anchor="start">Eksempler</text>
    <text x="118" y="160">Na⁺</text><text x="178" y="160">Mg²⁺</text><text x="248" y="160">Al³⁺</text>
    <text x="368" y="160">N³⁻</text><text x="428" y="160">O²⁻</text><text x="488" y="160">Cl⁻</text>
    <text x="118" y="178">K⁺</text><text x="178" y="178">Ca²⁺</text><text x="428" y="178">S²⁻</text><text x="488" y="178">F⁻</text>
  </g>
  <g font-size="12" fill="#1c2828">
    <rect x="93" y="198" width="14" height="14" rx="3" fill="#cfe3f7" stroke="#586868"/><text x="113" y="210">gir fra seg elektroner: positive ioner</text>
  </g>
  <g font-size="12" fill="#1c2828">
    <rect x="360" y="198" width="14" height="14" rx="3" fill="#fde3a7" stroke="#586868"/><text x="380" y="210">tar opp elektroner: negative ioner</text>
  </g>
</svg>
