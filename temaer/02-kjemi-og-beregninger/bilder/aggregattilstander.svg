<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" font-family="Segoe UI, Arial, sans-serif">
  <title>Partiklene i fast stoff, væske og gass</title>
  <rect x="0" y="0" width="600" height="230" rx="10" fill="#ffffff"/>
  <g fill="none" stroke="#586868" stroke-width="2">
    <path d="M30 20 V160 H190 V20"/><path d="M220 20 V160 H380 V20"/><path d="M410 20 V160 H570 V20"/>
  </g>
  <!-- Fast: tett, ordnet -->
  <g fill="#cfe3f7" stroke="#1e6fb8" stroke-width="1.2">
    <circle cx="55" cy="140" r="11"/><circle cx="80" cy="140" r="11"/><circle cx="105" cy="140" r="11"/><circle cx="130" cy="140" r="11"/><circle cx="155" cy="140" r="11"/>
    <circle cx="55" cy="115" r="11"/><circle cx="80" cy="115" r="11"/><circle cx="105" cy="115" r="11"/><circle cx="130" cy="115" r="11"/><circle cx="155" cy="115" r="11"/>
    <circle cx="55" cy="90" r="11"/><circle cx="80" cy="90" r="11"/><circle cx="105" cy="90" r="11"/><circle cx="130" cy="90" r="11"/><circle cx="155" cy="90" r="11"/>
  </g>
  <!-- Væske: tett, uordnet -->
  <g fill="#cfe3f7" stroke="#1e6fb8" stroke-width="1.2">
    <circle cx="242" cy="146" r="11"/><circle cx="268" cy="142" r="11"/><circle cx="293" cy="147" r="11"/><circle cx="320" cy="141" r="11"/><circle cx="350" cy="146" r="11"/>
    <circle cx="252" cy="120" r="11"/><circle cx="280" cy="118" r="11"/><circle cx="308" cy="122" r="11"/><circle cx="336" cy="117" r="11"/><circle cx="362" cy="124" r="11"/>
    <circle cx="265" cy="95" r="11"/><circle cx="296" cy="96" r="11"/><circle cx="325" cy="93" r="11"/><circle cx="352" cy="99" r="11"/>
  </g>
  <!-- Gass: spredt, med fart -->
  <g fill="#cfe3f7" stroke="#1e6fb8" stroke-width="1.2">
    <circle cx="440" cy="45" r="11"/><circle cx="530" cy="60" r="11"/><circle cx="470" cy="110" r="11"/><circle cx="545" cy="135" r="11"/><circle cx="500" cy="80" r="11"/>
  </g>
  <g stroke="#8a9a9a" stroke-width="1.5">
    <line x1="425" y1="40" x2="412" y2="36"/><line x1="545" y1="62" x2="560" y2="66"/><line x1="458" y1="120" x2="448" y2="128"/><line x1="535" y1="148" x2="527" y2="158"/><line x1="510" y1="68" x2="518" y2="58"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#1c2828">
    <text x="110" y="185" font-weight="bold">Fast stoff (s)</text>
    <text x="110" y="204">tett og i faste plasser</text>
    <text x="110" y="222">vibrerer på stedet</text>
    <text x="300" y="185" font-weight="bold">Væske (l)</text>
    <text x="300" y="204">tett, men kan gli</text>
    <text x="300" y="222">forbi hverandre</text>
    <text x="490" y="185" font-weight="bold">Gass (g)</text>
    <text x="490" y="204">langt fra hverandre</text>
    <text x="490" y="222">beveger seg fort</text>
  </g>
</svg>
