  <g stroke="#1c2828" stroke-width="3">
    <line x1="58" y1="95" x2="98" y2="95"/><line x1="58" y1="105" x2="98" y2="105"/>
    <line x1="122" y1="95" x2="162" y2="95"/><line x1="122" y1="105" x2="162" y2="105"/>
  </g>
  <circle cx="40" cy="100" r="24" fill="#f6c4c4" stroke="#9a2b2b" stroke-width="1.5"/>
  <circle cx="110" cy="100" r="20" fill="#c9d1d1" stroke="#586868" stroke-width="1.5"/>
  <circle cx="180" cy="100" r="24" fill="#f6c4c4" stroke="#9a2b2b" stroke-width="1.5"/>
  <g stroke="#1c2828" stroke-width="4"><line x1="320" y1="80" x2="282" y2="125"/><line x1="320" y1="80" x2="358" y2="125"/></g>
