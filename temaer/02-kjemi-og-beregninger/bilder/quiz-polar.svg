<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" font-family="Segoe UI, Arial, sans-serif">
  <title>Molekyl A er rett: O=C=O. Molekyl B er vinklet: H–O–H.</title>
