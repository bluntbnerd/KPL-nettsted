<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" font-family="Segoe UI, Arial, sans-serif">
  <title>En pil fra masse i gram til stoffmengde i mol, med et spørsmålstegn over pilen</title>
  <defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker></defs>
  <rect x="0" y="0" width="320" height="120" rx="10" fill="#ffffff"/>
  <rect x="15" y="35" width="100" height="50" rx="8" fill="#e9f2fb" stroke="#586868" stroke-width="1.5"/>
  <rect x="205" y="35" width="100" height="50" rx="8" fill="#fde3a7" stroke="#586868" stroke-width="1.5"/>
  <line x1="118" y1="60" x2="201" y2="60" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2828"><text x="65" y="66">masse (g)</text><text x="255" y="66">mol</text></g>
  <text x="160" y="48" font-size="24" font-weight="bold" text-anchor="middle" fill="#b5530f">?</text>
</svg>
