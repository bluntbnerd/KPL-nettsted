<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" font-family="Segoe UI, Arial, sans-serif">
  <title>Sirkulerende kjølevannskrets med kjøletårn, pumpe, en kjøler og en kondensator.</title>
  <defs>
    <marker id="kvbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="kvrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="kvgra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d7e"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="310" rx="10" fill="#ffffff"/>

  <!-- luft ut på toppen -->
  <g stroke="#5d6d7e" stroke-width="2.5">
    <line x1="112" y1="40" x2="112" y2="14" marker-end="url(#kvgra)"/>
    <line x1="138" y1="40" x2="138" y2="14" marker-end="url(#kvgra)"/>
  </g>
  <text x="152" y="22" font-size="12.5" fill="#5d6d7e">varm, fuktig luft</text>

  <!-- kjøletårn -->
  <path d="M50,250 L62,70 L188,70 L200,250 Z" fill="#eef2f2" stroke="#586868" stroke-width="3"/>
  <rect x="95" y="44" width="60" height="26" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <ellipse cx="125" cy="57" rx="24" ry="5" fill="#ffffff" stroke="#586868" stroke-width="1.5"/>
  <text x="196" y="62" font-size="13" font-weight="bold" fill="#1c2828">kjøletårn</text>

  <!-- fordelingsrør og dyser -->
  <line x1="78" y1="92" x2="200" y2="92" stroke="#c0392b" stroke-width="4"/>
  <g stroke="#2471a3" stroke-width="2" stroke-dasharray="3 3">
    <line x1="88" y1="96" x2="84" y2="114"/>
    <line x1="108" y1="96" x2="104" y2="114"/>
    <line x1="128" y1="96" x2="124" y2="114"/>
    <line x1="148" y1="96" x2="144" y2="114"/>
    <line x1="168" y1="96" x2="164" y2="114"/>
  </g>
  <text x="128" y="86" font-size="11.5" text-anchor="middle" fill="#1c2828">dyser</text>

  <!-- fyllmateriale -->
  <rect x="68" y="120" width="116" height="56" fill="#d5dddd" stroke="#9aa8a8" stroke-width="1.5"/>
  <g stroke="#9aa8a8" stroke-width="1.2">
    <line x1="68" y1="134" x2="184" y2="134"/>
    <line x1="68" y1="148" x2="184" y2="148"/>
    <line x1="68" y1="162" x2="184" y2="162"/>
  </g>
  <rect x="80" y="141" width="92" height="16" fill="#d5dddd"/>
  <text x="126" y="153" font-size="11.5" text-anchor="middle" fill="#1c2828">fyllmateriale</text>

  <!-- dråper -->
  <g stroke="#2471a3" stroke-width="2" stroke-dasharray="3 4">
    <line x1="90" y1="182" x2="90" y2="210"/>
    <line x1="115" y1="182" x2="115" y2="210"/>
    <line x1="140" y1="182" x2="140" y2="210"/>
    <line x1="165" y1="182" x2="165" y2="210"/>
  </g>

  <!-- basseng -->
  <path d="M57,215 L195,215 L198,248 L53,248 Z" fill="#cfe3f1"/>
  <line x1="57" y1="215" x2="195" y2="215" stroke="#2471a3" stroke-width="1.5"/>

  <!-- luft inn -->
  <line x1="10" y1="192" x2="54" y2="192" stroke="#5d6d7e" stroke-width="2.5" marker-end="url(#kvgra)"/>
  <text x="10" y="182" font-size="12.5" fill="#5d6d7e">luft</text>

  <!-- etterfylling og avtapping -->
  <line x1="10" y1="234" x2="58" y2="234" stroke="#2471a3" stroke-width="2.5" marker-end="url(#kvbla)"/>
  <text x="8" y="268" font-size="12.5" fill="#2471a3">etterfylling</text>
  <line x1="150" y1="250" x2="150" y2="288" stroke="#2471a3" stroke-width="2.5" marker-end="url(#kvbla)"/>
  <text x="160" y="290" font-size="12.5" fill="#2471a3">avtapping</text>

  <!-- pumpe og tur -->
  <line x1="196" y1="234" x2="248" y2="234" stroke="#2471a3" stroke-width="3"/>
  <circle cx="262" cy="234" r="14" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <path d="M256,226 L272,234 L256,242 Z" fill="#586868"/>
  <text x="262" y="266" font-size="12.5" text-anchor="middle" fill="#1c2828">pumpe</text>
  <polyline points="276,234 340,234 340,140" fill="none" stroke="#2471a3" stroke-width="3"/>
  <line x1="340" y1="140" x2="398" y2="140" stroke="#2471a3" stroke-width="3" marker-end="url(#kvbla)"/>
  <line x1="340" y1="210" x2="398" y2="210" stroke="#2471a3" stroke-width="3" marker-end="url(#kvbla)"/>
  <text x="300" y="254" font-size="12" fill="#2471a3">kaldt, f.eks. 25 °C</text>

  <!-- prosessutstyr -->
  <text x="445" y="116" font-size="12" text-anchor="middle" fill="#1c2828">prosessutstyr</text>
  <rect x="400" y="122" width="90" height="36" rx="6" fill="#fbeeee" stroke="#586868" stroke-width="2"/>
  <text x="445" y="145" font-size="12.5" text-anchor="middle" fill="#1c2828">kjøler</text>
  <rect x="400" y="192" width="90" height="36" rx="6" fill="#fbeeee" stroke="#586868" stroke-width="2"/>
  <text x="445" y="215" font-size="12.5" text-anchor="middle" fill="#1c2828">kondensator</text>

  <!-- retur -->
  <line x1="490" y1="140" x2="540" y2="140" stroke="#c0392b" stroke-width="3"/>
  <line x1="490" y1="210" x2="540" y2="210" stroke="#c0392b" stroke-width="3"/>
  <polyline points="540,210 540,92 204,92" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#kvrod)"/>
  <text x="370" y="84" font-size="12" fill="#c0392b">varmt, f.eks. 35 °C</text>
</svg>
