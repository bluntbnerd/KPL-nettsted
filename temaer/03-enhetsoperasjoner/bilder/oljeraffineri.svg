<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" font-family="Segoe UI, Arial, sans-serif">
  <title>Forenklet oljeraffineri: råoljetank, forvarming, avsalting, ovn og destillasjon ved vanlig trykk. Bensin fra toppen og parafin og diesel går til avsvovling med hydrogen, og hydrogensulfid fjernes i en gassvasker. Resten fra bunnen av kolonnen går til vakuumdestillasjon. Gassoljen derfra går til krakking. Til slutt blandes og lagres produktene.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <marker id="pilg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d6b"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="490" rx="10" fill="#ffffff"/>

  <!-- bokser -->
  <g fill="#e3e8e8" stroke="#586868" stroke-width="2">
    <rect x="10" y="40" width="100" height="50" rx="6"/>
    <rect x="135" y="40" width="110" height="50" rx="6"/>
    <rect x="270" y="40" width="100" height="50" rx="6"/>
    <rect x="395" y="40" width="75" height="50" rx="6"/>
    <rect x="495" y="40" width="110" height="220" rx="6"/>
    <rect x="650" y="60" width="140" height="150" rx="6"/>
    <rect x="625" y="250" width="120" height="55" rx="6"/>
    <rect x="300" y="265" width="140" height="55" rx="6"/>
    <rect x="110" y="265" width="150" height="55" rx="6"/>
    <rect x="650" y="390" width="140" height="50" rx="6"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="60" y="70">1 Råoljetank</text>
    <text x="190" y="62">2 Forvarming</text>
    <text x="320" y="70">3 Avsalting</text>
    <text x="432" y="70">4 Ovn</text>
    <text x="550" y="140">5 Destillasjon</text>
    <text x="720" y="110">8 Avsvovling</text>
    <text x="685" y="274">Gassvasker</text>
    <text x="370" y="287">6 Vakuum-</text>
    <text x="370" y="304">destillasjon</text>
    <text x="185" y="287">7 Krakking</text>
    <text x="720" y="413">9 Blanding</text>
    <text x="720" y="430">og lagring</text>
  </g>
  <g font-size="11" fill="#1c2828" text-anchor="middle">
    <text x="190" y="79">varmevekslere</text>
    <text x="550" y="158">(vanlig trykk)</text>
    <text x="720" y="130">med hydrogen</text>
    <text x="720" y="146">i en reaktor med</text>
    <text x="720" y="162">katalysator</text>
    <text x="685" y="292">fjerner H₂S</text>
    <text x="185" y="306">reaktor med katalysator</text>
  </g>

  <!-- hovedstrømmer -->
  <g stroke="#1c2828" stroke-width="2.5" fill="none" marker-end="url(#pil)">
    <line x1="110" y1="65" x2="133" y2="65"/>
    <line x1="245" y1="65" x2="268" y2="65"/>
    <line x1="370" y1="65" x2="393" y2="65"/>
    <path d="M470,65 L482,65 L482,215 L493,215"/>
    <line x1="550" y1="40" x2="550" y2="10"/>
    <path d="M585,40 L585,28 L680,28 L680,58"/>
    <line x1="605" y1="135" x2="648" y2="135"/>
    <line x1="605" y1="185" x2="648" y2="185"/>
    <line x1="720" y1="22" x2="720" y2="58"/>
    <line x1="770" y1="210" x2="770" y2="388"/>
    <path d="M550,260 L550,292 L442,292"/>
    <line x1="300" y1="292" x2="262" y2="292"/>
    <line x1="370" y1="320" x2="370" y2="355"/>
    <path d="M185,320 L185,415 L648,415"/>
    <line x1="720" y1="440" x2="720" y2="475"/>
  </g>
  <!-- gass med H2S og svovel -->
  <g stroke="#1c2828" stroke-width="2" fill="none" marker-end="url(#pil)" stroke-dasharray="6 4">
    <line x1="690" y1="210" x2="690" y2="248"/>
    <line x1="685" y1="305" x2="685" y2="345"/>
    <line x1="320" y1="90" x2="320" y2="122"/>
  </g>
  <line x1="320" y1="10" x2="320" y2="38" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <!-- varme tilbake -->
  <path d="M495,105 L190,105 L190,92" stroke="#2e7d6b" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#pilg)"/>

  <g font-size="11" fill="#1c2828">
    <text x="10" y="30">råolje</text>
    <text x="327" y="24">vaskevann</text>
    <text x="327" y="137">saltvann</text>
    <text x="557" y="24">gass</text>
    <text x="605" y="22">bensin</text>
    <text x="608" y="130">parafin</text>
    <text x="608" y="180">diesel</text>
    <text x="727" y="36">hydrogen</text>
    <text x="555" y="282">rest</text>
    <text x="258" y="285">gassolje</text>
    <text x="378" y="350">tung rest:</text>
    <text x="378" y="364">asfalt og tungolje</text>
    <text x="678" y="340" text-anchor="end">H₂S til svovelanlegg</text>
    <text x="200" y="408">bensin og diesel fra krakkingen</text>
    <text x="712" y="470" text-anchor="end">ferdige produkter</text>
  </g>
  <text x="200" y="122" font-size="11" fill="#2e7d6b">varme fra produktene</text>
</svg>
