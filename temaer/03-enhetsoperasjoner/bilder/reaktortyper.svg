<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" height="450" font-family="Segoe UI, Arial, sans-serif">
  <title>Fire reaktortyper: batchreaktor, kontinuerlig omrørt tankreaktor, rørreaktor og fastsjiktreaktor. Blått er råstoff og grønt er produkt.</title>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <pattern id="korn" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e8efe6"/>
      <circle cx="5" cy="5" r="3.6" fill="#a7a08a" stroke="#6f6a58" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="660" height="450" rx="10" fill="#ffffff"/>

  <!-- ===== A: Batchreaktor ===== -->
  <text x="14" y="24" font-size="14" font-weight="bold" fill="#1c2828">Batchreaktor</text>
  <!-- kappe -->
  <path d="M70,80 L170,80 L170,172 Q170,200 120,200 Q70,200 70,172 Z" fill="#f3d9c4" stroke="#586868" stroke-width="2"/>
  <!-- tank -->
  <path d="M78,58 L162,58 L162,170 Q162,192 120,192 Q78,192 78,170 Z" fill="#ffffff" stroke="#586868" stroke-width="2.5"/>
  <path d="M80,84 L160,84 L160,170 Q160,190 120,190 Q80,190 80,170 Z" fill="#c7dfd2"/>
  <rect x="106" y="34" width="28" height="18" rx="3" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <line x1="120" y1="52" x2="120" y2="172" stroke="#1c2828" stroke-width="3"/>
  <g stroke="#1c2828" stroke-width="5" stroke-linecap="round">
    <line x1="100" y1="168" x2="116" y2="175"/>
    <line x1="124" y1="175" x2="140" y2="168"/>
  </g>
  <g stroke="#2c6ea6" stroke-width="2.5" fill="none" marker-end="url(#p)">
    <line x1="60" y1="40" x2="88" y2="56"/>
  </g>
  <line x1="120" y1="200" x2="120" y2="210" stroke="#586868" stroke-width="2.5"/>
  <g stroke="#3f8f4a" stroke-width="2.5" fill="none" marker-end="url(#p)">
    <line x1="120" y1="208" x2="150" y2="208"/>
  </g>
  <g font-size="11.5" fill="#1c2828">
    <text x="18" y="38">råstoff</text>
    <text x="156" y="212">produkt</text>
    <text x="18" y="154" fill="#8a5a3a">kappe</text>
    <line x1="52" y1="150" x2="72" y2="150" stroke="#8a9a9a" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#1c2828">
    <text x="214" y="70">1. fylle</text>
    <text x="214" y="90">2. reagere</text>
    <text x="214" y="110">3. tømme</text>
    <text x="214" y="130">4. vaske</text>
    <text x="214" y="158" font-size="11.5" fill="#586868">Én batch</text>
    <text x="214" y="172" font-size="11.5" fill="#586868">om gangen.</text>
  </g>

  <line x1="330" y1="14" x2="330" y2="436" stroke="#d8dede" stroke-width="1.5"/>
  <line x1="14" y1="226" x2="646" y2="226" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== B: Kontinuerlig omrørt tankreaktor ===== -->
  <text x="344" y="24" font-size="14" font-weight="bold" fill="#1c2828">Kontinuerlig omrørt tankreaktor</text>
  <path d="M400,80 L500,80 L500,172 Q500,200 450,200 Q400,200 400,172 Z" fill="#f3d9c4" stroke="#586868" stroke-width="2"/>
  <path d="M408,58 L492,58 L492,170 Q492,192 450,192 Q408,192 408,170 Z" fill="#ffffff" stroke="#586868" stroke-width="2.5"/>
  <path d="M410,84 L490,84 L490,170 Q490,190 450,190 Q410,190 410,170 Z" fill="#c7e3c0"/>
  <rect x="436" y="34" width="28" height="18" rx="3" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <line x1="450" y1="52" x2="450" y2="172" stroke="#1c2828" stroke-width="3"/>
  <g stroke="#1c2828" stroke-width="5" stroke-linecap="round">
    <line x1="430" y1="168" x2="446" y2="175"/>
    <line x1="454" y1="175" x2="470" y2="168"/>
  </g>
  <g stroke="#2c6ea6" stroke-width="2.5" fill="none" marker-end="url(#p)">
    <line x1="390" y1="40" x2="418" y2="56"/>
  </g>
  <line x1="450" y1="200" x2="450" y2="210" stroke="#586868" stroke-width="2.5"/>
  <g stroke="#3f8f4a" stroke-width="2.5" fill="none" marker-end="url(#p)">
    <line x1="450" y1="208" x2="480" y2="208"/>
  </g>
  <g font-size="11.5" fill="#1c2828">
    <text x="348" y="38">råstoff</text>
    <text x="486" y="212">produkt</text>
  </g>
  <g font-size="12" fill="#1c2828">
    <text x="516" y="80">Inn og ut</text>
    <text x="516" y="96">hele tiden.</text>
    <text x="516" y="124">Innholdet er</text>
    <text x="516" y="140">likt overalt.</text>
  </g>

  <!-- ===== C: Rørreaktor ===== -->
  <text x="14" y="252" font-size="14" font-weight="bold" fill="#1c2828">Rørreaktor</text>
  <path d="M40,290 L250,290 Q272,290 272,310 Q272,330 250,330 L62,330 Q40,330 40,350 Q40,370 62,370 L272,370" fill="none" stroke="#586868" stroke-width="16" stroke-linejoin="round"/>
  <path d="M40,290 L250,290 Q272,290 272,310" fill="none" stroke="#bcd9ee" stroke-width="11"/>
  <path d="M272,310 Q272,330 250,330 L62,330 Q40,330 40,350" fill="none" stroke="#c3dfd6" stroke-width="11"/>
  <path d="M40,350 Q40,370 62,370 L272,370" fill="none" stroke="#c7e3c0" stroke-width="11"/>
  <g stroke-width="2.5" fill="none" marker-end="url(#p)">
    <line x1="14" y1="290" x2="34" y2="290" stroke="#2c6ea6"/>
    <line x1="280" y1="370" x2="304" y2="370" stroke="#3f8f4a"/>
  </g>
  <g font-size="11.5" fill="#1c2828">
    <text x="14" y="278">råstoff</text>
    <text x="262" y="396">produkt</text>
    <text x="70" y="312" fill="#2c6ea6">mest råstoff</text>
    <text x="150" y="396" fill="#3f8f4a">mest produkt</text>
  </g>
  <text x="14" y="420" font-size="12" fill="#1c2828">Stoffene reagerer mens de strømmer gjennom.</text>

  <!-- ===== D: Fastsjiktreaktor ===== -->
  <text x="344" y="252" font-size="14" font-weight="bold" fill="#1c2828">Fastsjiktreaktor</text>
  <rect x="400" y="282" width="80" height="128" rx="22" fill="#ffffff" stroke="#586868" stroke-width="2.5"/>
  <rect x="403" y="302" width="74" height="88" fill="url(#korn)"/>
  <line x1="403" y1="302" x2="477" y2="302" stroke="#586868" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="403" y1="390" x2="477" y2="390" stroke="#586868" stroke-width="2.5"/>
  <g stroke-width="2.5" fill="none" marker-end="url(#p)">
    <line x1="440" y1="262" x2="440" y2="280" stroke="#2c6ea6"/>
    <line x1="440" y1="412" x2="440" y2="432" stroke="#3f8f4a"/>
  </g>
  <g font-size="11.5" fill="#1c2828">
    <text x="448" y="272">gass inn</text>
    <text x="448" y="428">produkt ut</text>
  </g>
  <g stroke="#8a9a9a" stroke-width="1">
    <line x1="470" y1="340" x2="500" y2="340"/>
  </g>
  <g font-size="12" fill="#1c2828">
    <text x="504" y="336">katalysatorkorn</text>
    <text x="504" y="352" font-size="11.5" fill="#586868">Gassen reagerer på</text>
    <text x="504" y="366" font-size="11.5" fill="#586868">overflaten av kornene.</text>  </g>
</svg>
