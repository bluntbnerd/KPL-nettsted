<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 285" width="660" height="285" font-family="Segoe UI, Arial, sans-serif">
  <title>To vifter: til venstre en aksialvifte i en kanal sett fra siden, til høyre en radialvifte i snitt sett forfra.</title>
  <defs>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="pilrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="285" rx="10" fill="#ffffff"/>

  <!-- ===== Aksialvifte ===== -->
  <text x="160" y="24" font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">Aksialvifte (fra siden)</text>
  <rect x="30" y="80" width="260" height="120" fill="#eef3f6"/>
  <line x1="30" y1="80" x2="290" y2="80" stroke="#586868" stroke-width="3"/>
  <line x1="30" y1="200" x2="290" y2="200" stroke="#586868" stroke-width="3"/>
  <!-- motor og nav -->
  <rect x="166" y="126" width="40" height="28" rx="4" fill="#a9b3b3" stroke="#586868" stroke-width="2"/>
  <line x1="206" y1="140" x2="250" y2="140" stroke="#586868" stroke-width="3"/>
  <line x1="250" y1="120" x2="250" y2="160" stroke="#586868" stroke-width="3"/>
  <line x1="250" y1="120" x2="290" y2="84" stroke="#586868" stroke-width="2"/>
  <line x1="250" y1="160" x2="290" y2="196" stroke="#586868" stroke-width="2"/>
  <!-- blader -->
  <ellipse cx="160" cy="108" rx="9" ry="27" fill="#586868" transform="rotate(-15 160 108)"/>
  <ellipse cx="160" cy="172" rx="9" ry="27" fill="#586868" transform="rotate(15 160 172)"/>
  <ellipse cx="160" cy="140" rx="10" ry="14" fill="#1c2828"/>
  <!-- luft -->
  <line x1="40" y1="100" x2="130" y2="100" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <line x1="40" y1="180" x2="130" y2="180" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <line x1="190" y1="100" x2="282" y2="100" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <line x1="190" y1="180" x2="282" y2="180" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <g font-size="11.5" fill="#586868">
    <text x="146" y="70" text-anchor="middle">blader (propell)</text>
    <text x="186" y="168" text-anchor="middle">motor</text>
  </g>
  <g font-size="12.5" fill="#1c2828" text-anchor="middle">
    <text x="160" y="232">Lufta går rett gjennom,</text>
    <text x="160" y="248">langs akselen.</text>
    <text x="160" y="264">Mye luft, lite trykk.</text>
  </g>

  <line x1="330" y1="20" x2="330" y2="270" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== Radialvifte ===== -->
  <text x="495" y="24" font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">Radialvifte (forfra)</text>
  <path d="M450,44 L450,105 Q460,88 484,86 A64,64 0 0,1 554,150 A68,68 0 0,1 490,218 A72,72 0 0,1 418,150 L418,44" fill="#eef3f6" stroke="#586868" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="490" cy="150" r="44" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <g stroke="#1c2828" stroke-width="3" stroke-linecap="round">
    <line x1="506" y1="150" x2="532" y2="150"/>
    <line x1="503.9" y1="158" x2="526.4" y2="171"/>
    <line x1="498" y1="163.9" x2="511" y2="186.4"/>
    <line x1="490" y1="166" x2="490" y2="192"/>
    <line x1="482" y1="163.9" x2="469" y2="186.4"/>
    <line x1="476.1" y1="158" x2="453.6" y2="171"/>
    <line x1="474" y1="150" x2="448" y2="150"/>
    <line x1="476.1" y1="142" x2="453.6" y2="129"/>
    <line x1="482" y1="136.1" x2="469" y2="113.6"/>
    <line x1="490" y1="134" x2="490" y2="108"/>
    <line x1="498" y1="136.1" x2="511" y2="113.6"/>
    <line x1="503.9" y1="142" x2="526.4" y2="129"/>
  </g>
  <circle cx="490" cy="150" r="12" fill="#eef3f6" stroke="#2471a3" stroke-width="2"/>
  <line x1="570" y1="198" x2="500" y2="158" stroke="#2471a3" stroke-width="1"/>
  <path d="M516,105 A52,52 0 0,1 542,150" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#pilrod)"/>
  <line x1="434" y1="100" x2="434" y2="50" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="458" y="56">ut</text>
    <text x="572" y="204" fill="#2471a3">inn</text>
    <text x="526" y="96" fill="#c0392b">roterer</text>
  </g>
  <g font-size="12.5" fill="#1c2828" text-anchor="middle">
    <text x="495" y="240">Lufta kommer inn i midten og</text>
    <text x="495" y="256">slynges ut. Mer trykk enn en</text>
    <text x="495" y="272">aksialvifte.</text>
  </g>
</svg>
