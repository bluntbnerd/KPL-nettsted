<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>Snitt gjennom en kjeftknuser og en kjegleknuser. Store steiner kommer inn på toppen og blir klemt mindre og mindre på vei ned.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <marker id="pilrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="330" rx="10" fill="#ffffff"/>

  <!-- ===== Kjeftknuser ===== -->
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#1c2828">Kjeftknuser</text>
  <!-- fast kjeft -->
  <polygon points="58,60 80,60 130,250 110,250" fill="#9aa7a7" stroke="#586868" stroke-width="2"/>
  <!-- bevegelig kjeft -->
  <polygon points="240,60 262,60 182,250 160,250" fill="#9aa7a7" stroke="#586868" stroke-width="2"/>
  <circle cx="251" cy="52" r="9" fill="#ffffff" stroke="#586868" stroke-width="2"/>
  <!-- bevegelse -->
  <line x1="222" y1="38" x2="282" y2="38" stroke="#c0392b" stroke-width="2.5" marker-start="url(#pilrod)" marker-end="url(#pilrod)"/>
  <!-- steiner -->
  <g fill="#c9b79c" stroke="#7a6a55" stroke-width="1.5">
    <polygon points="125,80 160,72 192,86 196,115 170,130 132,124 118,102"/>
    <polygon points="112,158 132,150 146,162 140,182 118,184"/>
    <polygon points="160,156 182,152 190,170 176,186 158,180"/>
    <polygon points="128,222 140,218 146,228 136,236"/>
    <polygon points="154,220 166,218 168,230 156,234"/>
    <polygon points="140,268 150,265 154,275 143,278"/>
    <polygon points="148,292 158,290 160,300 150,302"/>
  </g>
  <line x1="200" y1="270" x2="200" y2="305" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="10" y="150">fast</text>
    <text x="10" y="165">kjeft</text>
    <text x="232" y="160">bevegelig</text>
    <text x="232" y="175">kjeft</text>
    <text x="210" y="290">ut: små</text>
    <text x="210" y="305">biter</text>
    <text x="40" y="268">spalte</text>
    <line x1="80" y1="263" x2="140" y2="250" stroke="#586868" stroke-width="1"/>
    <text x="196" y="30" font-size="12" fill="#c0392b">fram og tilbake</text>
  </g>

  <!-- skille -->
  <line x1="320" y1="20" x2="320" y2="310" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== Kjegleknuser ===== -->
  <text x="336" y="24" font-size="15" font-weight="bold" fill="#1c2828">Kjegleknuser</text>
  <!-- ytre vegg -->
  <polygon points="345,60 362,60 422,240 405,240" fill="#9aa7a7" stroke="#586868" stroke-width="2"/>
  <polygon points="598,60 615,60 555,240 538,240" fill="#9aa7a7" stroke="#586868" stroke-width="2"/>
  <!-- kjegle -->
  <polygon points="478,92 430,240 526,240" fill="#7f8f8f" stroke="#4a5858" stroke-width="2"/>
  <line x1="478" y1="240" x2="478" y2="300" stroke="#4a5858" stroke-width="6"/>
  <!-- svingebevegelse -->
  <path d="M452,286 A30,9 0 1,0 504,286" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#pilrod)"/>
  <!-- inn -->
  <line x1="478" y1="36" x2="478" y2="74" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <!-- steiner -->
  <g fill="#c9b79c" stroke="#7a6a55" stroke-width="1.5">
    <polygon points="392,108 414,100 432,112 428,134 404,138 388,124"/>
    <polygon points="524,108 548,102 566,114 560,136 534,138 522,124"/>
    <polygon points="412,182 426,178 434,190 424,200 412,196"/>
    <polygon points="526,182 540,178 546,190 536,200 524,196"/>
    <polygon points="420,258 428,256 431,264 422,266"/>
    <polygon points="532,258 540,256 543,264 534,266"/>
  </g>
  <g font-size="12.5" fill="#1c2828">
    <text x="488" y="50">stein inn</text>
    <text x="336" y="200">ytre</text>
    <text x="336" y="215">vegg</text>
    <text x="462" y="200" fill="#ffffff">kjegle</text>
    <text x="350" y="285">ut: små biter</text>
    <text x="516" y="312" fill="#c0392b" font-size="12">kjegla svinger</text>
  </g>
</svg>
