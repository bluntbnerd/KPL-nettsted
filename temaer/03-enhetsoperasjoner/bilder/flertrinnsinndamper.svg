<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" font-family="Segoe UI, Arial, sans-serif">
  <title>Inndamper med tre trinn. Dampen fra hvert trinn varmer neste trinn, som har lavere trykk og temperatur.</title>
  <defs>
    <marker id="ftbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="ftmork" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a5276"/></marker>
    <marker id="ftoransje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d35400"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="270" rx="10" fill="#ffffff"/>

  <!-- tre beholdere -->
  <g stroke="#586868" stroke-width="3">
    <rect x="40" y="70" width="120" height="120" rx="14" fill="#ffffff"/>
    <rect x="250" y="70" width="120" height="120" rx="14" fill="#ffffff"/>
    <rect x="460" y="70" width="120" height="120" rx="14" fill="#ffffff"/>
  </g>
  <g fill="#cfe3f1">
    <path d="M42,130 L158,130 L158,176 Q158,188 146,188 L54,188 Q42,188 42,176 Z"/>
    <path d="M252,130 L368,130 L368,176 Q368,188 356,188 L264,188 Q252,188 252,176 Z"/>
    <path d="M462,130 L578,130 L578,176 Q578,188 566,188 L474,188 Q462,188 462,176 Z"/>
  </g>
  <!-- varmeflater (forenklet tegnet) -->
  <g fill="none" stroke="#d35400" stroke-width="3">
    <polyline points="40,158 55,158 65,145 80,172 95,145 110,172 125,145 140,172 145,172 145,212"/>
    <polyline points="250,158 265,158 275,145 290,172 305,145 320,172 335,145 350,172 355,172 355,212"/>
    <polyline points="460,158 475,158 485,145 500,172 515,145 530,172 545,145 560,172 565,172 565,212"/>
  </g>
  <g font-size="11" fill="#2471a3">
    <text x="150" y="222">kondensat</text>
    <text x="360" y="222">kondensat</text>
    <text x="570" y="222">kondensat</text>
  </g>
  <g fill="#2471a3">
    <path d="M141,208 L149,208 L145,216 Z"/>
    <path d="M351,208 L359,208 L355,216 Z"/>
    <path d="M561,208 L569,208 L565,216 Z"/>
  </g>

  <!-- tekst i beholderne -->
  <g text-anchor="middle" fill="#1c2828">
    <text x="100" y="94" font-size="13" font-weight="bold">Trinn 1</text>
    <text x="100" y="112" font-size="11.5">ca. 1 bar, 100 °C</text>
    <text x="310" y="94" font-size="13" font-weight="bold">Trinn 2</text>
    <text x="310" y="112" font-size="11.5">ca. 0,5 bar, 80 °C</text>
    <text x="520" y="94" font-size="13" font-weight="bold">Trinn 3</text>
    <text x="520" y="112" font-size="11.5">ca. 0,2 bar, 60 °C</text>
  </g>

  <!-- fersk damp inn i trinn 1 -->
  <line x1="4" y1="158" x2="38" y2="158" stroke="#d35400" stroke-width="3" marker-end="url(#ftoransje)"/>
  <text x="4" y="134" font-size="11.5" fill="#d35400">fersk</text>
  <text x="4" y="148" font-size="11.5" fill="#d35400">damp</text>

  <!-- damp fra trinn til trinn -->
  <polyline points="100,70 100,40 225,40 225,158 248,158" fill="none" stroke="#d35400" stroke-width="3" marker-end="url(#ftoransje)"/>
  <polyline points="310,70 310,40 435,40 435,158 458,158" fill="none" stroke="#d35400" stroke-width="3" marker-end="url(#ftoransje)"/>
  <polyline points="520,70 520,40 648,40" fill="none" stroke="#d35400" stroke-width="3" marker-end="url(#ftoransje)"/>
  <g font-size="11.5" fill="#d35400">
    <text x="108" y="34">damp fra trinn 1</text>
    <text x="318" y="34">damp fra trinn 2</text>
    <text x="652" y="26" text-anchor="end">til kondensator</text>
  </g>

  <!-- løsningen fra trinn til trinn -->
  <polyline points="4,236 60,236 60,192" fill="none" stroke="#2471a3" stroke-width="3" marker-end="url(#ftbla)"/>
  <text x="4" y="256" font-size="11.5" fill="#2471a3">tynn løsning</text>
  <polyline points="100,190 100,240 270,240 270,192" fill="none" stroke="#2471a3" stroke-width="3" marker-end="url(#ftbla)"/>
  <polyline points="310,190 310,240 480,240 480,192" fill="none" stroke="#2471a3" stroke-width="3" marker-end="url(#ftbla)"/>
  <polyline points="520,190 520,240 648,240" fill="none" stroke="#1a5276" stroke-width="3.5" marker-end="url(#ftmork)"/>
  <text x="652" y="260" font-size="12" font-weight="bold" fill="#1a5276" text-anchor="end">konsentrat</text>
</svg>
