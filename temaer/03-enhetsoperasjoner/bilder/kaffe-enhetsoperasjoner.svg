<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" width="660" height="180" font-family="Segoe UI, Arial, sans-serif">
  <title>Kaffetrakting som en kjede av enhetsoperasjoner: maling, oppvarming, ekstraksjon og filtrering.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="180" rx="10" fill="#ffffff"/>

  <!-- bokser -->
  <g fill="#e3e8e8" stroke="#586868" stroke-width="2">
    <rect x="80" y="80" width="100" height="50" rx="6"/>
    <rect x="250" y="8" width="120" height="40" rx="6"/>
    <rect x="250" y="80" width="120" height="50" rx="6"/>
    <rect x="460" y="80" width="110" height="50" rx="6"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="130" y="110">Maling</text>
    <text x="310" y="33">Oppvarming</text>
    <text x="310" y="110">Ekstraksjon</text>
    <text x="515" y="110">Filtrering</text>
  </g>

  <!-- strømmer -->
  <g stroke="#1c2828" stroke-width="2.5" fill="none" marker-end="url(#pil)">
    <line x1="10" y1="105" x2="78" y2="105"/>
    <line x1="180" y1="105" x2="248" y2="105"/>
    <line x1="160" y1="28" x2="248" y2="28"/>
    <line x1="310" y1="48" x2="310" y2="78"/>
    <line x1="370" y1="105" x2="458" y2="105"/>
    <line x1="570" y1="105" x2="648" y2="105"/>
    <line x1="515" y1="130" x2="515" y2="168"/>
  </g>
  <g font-size="12" fill="#1c2828">
    <text x="12" y="97">bønner</text>
    <text x="190" y="97">pulver</text>
    <text x="162" y="20">kaldt vann</text>
    <text x="320" y="68">varmt vann</text>
    <text x="380" y="97">kaffe + grut</text>
    <text x="588" y="97">kaffe</text>
    <text x="524" y="160">grut</text>
  </g>
</svg>
