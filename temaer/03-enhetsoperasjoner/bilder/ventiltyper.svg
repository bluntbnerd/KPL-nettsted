<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Fire ventiltyper i snitt: kuleventil, sluseventil, seteventil og tilbakeslagsventil.</title>
  <defs>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="300" rx="10" fill="#ffffff"/>

  <!-- felles rør: væske og vegger -->
  <g fill="#cfe3f1">
    <rect x="10" y="150" width="145" height="40"/>
    <rect x="175" y="150" width="145" height="40"/>
    <rect x="340" y="150" width="145" height="40"/>
    <rect x="505" y="150" width="145" height="40"/>
  </g>
  <g stroke="#586868" stroke-width="3">
    <line x1="10" y1="150" x2="155" y2="150"/><line x1="10" y1="190" x2="155" y2="190"/>
    <line x1="175" y1="150" x2="320" y2="150"/><line x1="175" y1="190" x2="320" y2="190"/>
    <line x1="340" y1="150" x2="485" y2="150"/><line x1="340" y1="190" x2="485" y2="190"/>
    <line x1="505" y1="150" x2="650" y2="150"/><line x1="505" y1="190" x2="650" y2="190"/>
  </g>
  <g stroke="#d8dede" stroke-width="1.5">
    <line x1="165" y1="20" x2="165" y2="285"/>
    <line x1="330" y1="20" x2="330" y2="285"/>
    <line x1="495" y1="20" x2="495" y2="285"/>
  </g>

  <!-- ===== Kuleventil ===== -->
  <text x="82" y="24" font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">Kuleventil</text>
  <circle cx="82" cy="170" r="36" fill="#e3e8e8" stroke="#586868" stroke-width="3"/>
  <circle cx="82" cy="170" r="27" fill="#a9b3b3" stroke="#586868" stroke-width="2"/>
  <rect x="44" y="152" width="76" height="36" fill="#cfe3f1"/>
  <line x1="82" y1="143" x2="82" y2="96" stroke="#586868" stroke-width="5"/>
  <line x1="82" y1="96" x2="138" y2="96" stroke="#1c2828" stroke-width="7" stroke-linecap="round"/>
  <text x="96" y="86" font-size="11.5" fill="#586868">håndtak</text>
  <line x1="20" y1="170" x2="146" y2="170" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <g font-size="12.5" fill="#1c2828" text-anchor="middle">
    <text x="82" y="226">En kule med et hull.</text>
    <text x="82" y="242">Kvart omdreining.</text>
    <text x="82" y="258">Håndtaket langs</text>
    <text x="82" y="274">røret: åpen.</text>
  </g>

  <!-- ===== Sluseventil ===== -->
  <text x="247" y="24" font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">Sluseventil</text>
  <rect x="237" y="76" width="20" height="50" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <rect x="223" y="118" width="48" height="84" rx="8" fill="#e3e8e8" stroke="#586868" stroke-width="3"/>
  <rect x="223" y="150" width="48" height="40" fill="#cfe3f1"/>
  <line x1="247" y1="42" x2="247" y2="110" stroke="#586868" stroke-width="4"/>
  <ellipse cx="247" cy="46" rx="26" ry="6" fill="none" stroke="#1c2828" stroke-width="4"/>
  <rect x="240" y="104" width="14" height="44" fill="#586868"/>
  <line x1="185" y1="170" x2="311" y2="170" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <text x="276" y="50" font-size="11.5" fill="#586868">ratt</text>
  <text x="200" y="128" font-size="11.5" fill="#586868" text-anchor="end">plate</text>
  <line x1="203" y1="125" x2="238" y2="125" stroke="#586868" stroke-width="1"/>
  <g font-size="12.5" fill="#1c2828" text-anchor="middle">
    <text x="247" y="226">En plate skrus ned</text>
    <text x="247" y="242">på tvers av røret.</text>
    <text x="247" y="258">Her er den løftet:</text>
    <text x="247" y="274">åpen.</text>
  </g>

  <!-- ===== Seteventil ===== -->
  <text x="412" y="24" font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">Seteventil</text>
  <rect x="402" y="80" width="20" height="56" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <ellipse cx="412" cy="170" rx="44" ry="38" fill="#cfe3f1" stroke="#586868" stroke-width="3"/>
  <!-- strømningsvei -->
  <path d="M352,182 L410,182 L410,172 M430,154 L476,154" fill="none" stroke="#2471a3" stroke-width="2.5"/>
  <line x1="460" y1="154" x2="478" y2="154" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <!-- skillevegg med sete -->
  <path d="M392,134 L392,170 L402,170" fill="none" stroke="#586868" stroke-width="4"/>
  <path d="M422,170 L432,170 L432,206" fill="none" stroke="#586868" stroke-width="4"/>
  <!-- kjegle og spindel -->
  <line x1="412" y1="46" x2="412" y2="156" stroke="#586868" stroke-width="4"/>
  <ellipse cx="412" cy="50" rx="26" ry="6" fill="none" stroke="#1c2828" stroke-width="4"/>
  <polygon points="397,152 427,152 421,162 403,162" fill="#586868"/>
  <text x="372" y="122" font-size="11.5" fill="#586868" text-anchor="end">kjegle</text>
  <line x1="374" y1="119" x2="398" y2="150" stroke="#586868" stroke-width="1"/>
  <text x="470" y="200" font-size="11.5" fill="#586868">sete</text>
  <line x1="468" y1="196" x2="426" y2="172" stroke="#586868" stroke-width="1"/>
  <g font-size="12.5" fill="#1c2828" text-anchor="middle">
    <text x="412" y="226">En kjegle løftes</text>
    <text x="412" y="242">fra et sete. Væsken</text>
    <text x="412" y="258">går i en S-bane.</text>
    <text x="412" y="274">God til å regulere.</text>
  </g>

  <!-- ===== Tilbakeslagsventil ===== -->
  <text x="577" y="24" font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">Tilbakeslagsventil</text>
  <rect x="542" y="132" width="72" height="76" rx="10" fill="#cfe3f1" stroke="#586868" stroke-width="3"/>
  <!-- sete -->
  <line x1="560" y1="134" x2="560" y2="157" stroke="#586868" stroke-width="5"/>
  <line x1="560" y1="183" x2="560" y2="206" stroke="#586868" stroke-width="5"/>
  <!-- klaff, åpen -->
  <circle cx="566" cy="146" r="3.5" fill="#1c2828"/>
  <line x1="566" y1="146" x2="598" y2="176" stroke="#1c2828" stroke-width="5" stroke-linecap="round"/>
  <line x1="512" y1="179" x2="640" y2="179" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <text x="604" y="122" font-size="11.5" fill="#586868">klaff</text>
  <line x1="606" y1="126" x2="590" y2="164" stroke="#586868" stroke-width="1"/>
  <g font-size="12.5" fill="#1c2828" text-anchor="middle">
    <text x="577" y="226">Strømmen dytter</text>
    <text x="577" y="242">klaffen opp. Snur</text>
    <text x="577" y="258">strømmen, faller den</text>
    <text x="577" y="274">ned mot setet: stengt.</text>
  </g>
</svg>
