<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="720" height="345" font-family="Segoe UI, Arial, sans-serif">
  <title>To typer tørker. Til venstre en trommeltørke: en lang, litt skrå trommel som roterer, med vått stoff og varm luft inn i den høye enden og tørt produkt ut i den lave enden. Til høyre en spraytørke: en høy beholder der væske sprayes inn på toppen i varm luft, og tørt pulver faller ut i bunnen.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <marker id="pilor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c25a12"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="345" rx="10" fill="#ffffff"/>
  <line x1="400" y1="20" x2="400" y2="325" stroke="#d0d8d8" stroke-width="1.5"/>

  <!-- ===== Trommeltørke ===== -->
  <g transform="translate(60,95) rotate(8)">
    <rect x="0" y="0" width="260" height="70" rx="8" fill="#f2f5f5" stroke="#586868" stroke-width="2.5"/>
    <rect x="48" y="-6" width="14" height="82" rx="3" fill="#586868"/>
    <rect x="198" y="-6" width="14" height="82" rx="3" fill="#586868"/>
    <!-- løfteskovler inne og stoff som drysser -->
    <g stroke="#586868" stroke-width="2">
      <line x1="80" y1="8" x2="80" y2="18"/><line x1="120" y1="8" x2="120" y2="18"/><line x1="160" y1="8" x2="160" y2="18"/>
    </g>
    <g fill="#8a6a3a">
      <circle cx="90" cy="30" r="2.5"/><circle cx="95" cy="44" r="2.5"/><circle cx="130" cy="36" r="2.5"/>
      <circle cx="136" cy="50" r="2.5"/><circle cx="170" cy="40" r="2.5"/>
    </g>
    <path d="M10,62 Q130,52 250,62 L250,66 Q130,66 10,66 Z" fill="#8a6a3a" opacity="0.7"/>
  </g>
  <!-- vått stoff inn -->
  <line x1="78" y1="45" x2="78" y2="93" stroke="#1c2828" stroke-width="2.5" marker-end="url(#pil)"/>
  <!-- varm luft inn -->
  <line x1="10" y1="132" x2="58" y2="132" stroke="#c25a12" stroke-width="2.5" marker-end="url(#pilor)"/>
  <!-- tørt produkt ut -->
  <line x1="300" y1="200" x2="300" y2="245" stroke="#1c2828" stroke-width="2.5" marker-end="url(#pil)"/>
  <!-- fuktig luft ut -->
  <polyline points="322,150 345,150 345,105" fill="none" stroke="#c25a12" stroke-width="2.5" marker-end="url(#pilor)"/>
  <!-- rotasjon -->
  <path d="M150,215 A30,10 0 1 0 210,215" fill="none" stroke="#1c2828" stroke-width="1.5" marker-end="url(#pil)"/>

  <g font-size="12" fill="#1c2828">
    <text x="86" y="52">vått stoff inn</text>
    <text x="4" y="122">varm luft</text>
    <text x="308" y="240">tørt produkt</text>
    <text x="180" y="250" text-anchor="middle">trommelen roterer</text>
    <text x="352" y="98" text-anchor="middle">til syklon</text>
    <text x="352" y="84" text-anchor="middle">fuktig luft</text>
  </g>
  <text x="190" y="315" font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">Trommeltørke</text>

  <!-- ===== Spraytørke ===== -->
  <path d="M500,60 L610,60 L610,200 L555,270 L500,200 Z" fill="#f2f5f5" stroke="#586868" stroke-width="2.5"/>
  <!-- dyse og spray -->
  <path d="M549,62 L561,62 L555,74 Z" fill="#586868"/>
  <g stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="555" y1="76" x2="520" y2="150"/>
    <line x1="555" y1="76" x2="540" y2="160"/>
    <line x1="555" y1="76" x2="570" y2="160"/>
    <line x1="555" y1="76" x2="590" y2="150"/>
  </g>
  <g fill="#8a6a3a">
    <circle cx="530" cy="185" r="2"/><circle cx="548" cy="200" r="2"/><circle cx="566" cy="190" r="2"/>
    <circle cx="582" cy="205" r="2"/><circle cx="555" cy="230" r="2"/><circle cx="545" cy="245" r="2"/>
  </g>
  <!-- væske inn -->
  <line x1="555" y1="22" x2="555" y2="58" stroke="#2a6f97" stroke-width="2.5"/>
  <path d="M549,52 L561,52 L555,60 Z" fill="#2a6f97"/>
  <!-- varm luft inn -->
  <line x1="660" y1="75" x2="612" y2="75" stroke="#c25a12" stroke-width="2.5" marker-end="url(#pilor)"/>
  <!-- luft og fint støv ut -->
  <line x1="510" y1="212" x2="460" y2="212" stroke="#c25a12" stroke-width="2.5" marker-end="url(#pilor)"/>
  <!-- pulver ut -->
  <line x1="555" y1="270" x2="555" y2="300" stroke="#1c2828" stroke-width="2.5" marker-end="url(#pil)"/>

  <g font-size="12" fill="#1c2828">
    <text x="563" y="30">væske inn</text>
    <text x="616" y="94">varm luft</text>
    <text x="452" y="196" text-anchor="end">luft og</text>
    <text x="452" y="210" text-anchor="end">fint støv</text>
    <text x="452" y="224" text-anchor="end">til syklon</text>
    <text x="563" y="296">tørt pulver</text>
  </g>
  <text x="555" y="330" font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">Spraytørke</text>
</svg>
