<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" font-family="Segoe UI, Arial, sans-serif">
  <title>Til venstre en filterpresse med mange plater presset sammen. Til høyre et vakuumtrommelfilter som roterer i et trau med slam.</title>
  <defs>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="pilbrun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a5a35"/></marker>
    <marker id="pilrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="310" rx="10" fill="#ffffff"/>

  <!-- ===== Filterpresse ===== -->
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#1c2828">Filterpresse</text>
  <!-- fast endeplate -->
  <rect x="38" y="80" width="18" height="160" fill="#7f8f8f" stroke="#4a5858" stroke-width="2"/>
  <!-- plater med kake -->
  <g fill="#9aa7a7" stroke="#4a5858" stroke-width="1.5">
    <rect x="58" y="90" width="23" height="140"/>
    <rect x="83" y="90" width="23" height="140"/>
    <rect x="108" y="90" width="23" height="140"/>
    <rect x="133" y="90" width="23" height="140"/>
    <rect x="158" y="90" width="23" height="140"/>
    <rect x="183" y="90" width="23" height="140"/>
    <rect x="208" y="90" width="23" height="140"/>
    <rect x="233" y="90" width="23" height="140"/>
  </g>
  <g fill="#b89a74">
    <rect x="62" y="100" width="15" height="120"/>
    <rect x="87" y="100" width="15" height="120"/>
    <rect x="112" y="100" width="15" height="120"/>
    <rect x="137" y="100" width="15" height="120"/>
    <rect x="162" y="100" width="15" height="120"/>
    <rect x="187" y="100" width="15" height="120"/>
    <rect x="212" y="100" width="15" height="120"/>
    <rect x="237" y="100" width="15" height="120"/>
  </g>
  <!-- bevegelig endeplate og hydraulikk -->
  <rect x="258" y="80" width="18" height="160" fill="#7f8f8f" stroke="#4a5858" stroke-width="2"/>
  <rect x="276" y="146" width="40" height="28" fill="#c9d1d1" stroke="#4a5858" stroke-width="2"/>
  <line x1="300" y1="125" x2="280" y2="125" stroke="#c0392b" stroke-width="2.5" marker-end="url(#pilrod)"/>
  <!-- slam inn -->
  <line x1="8" y1="160" x2="60" y2="160" stroke="#7a5a35" stroke-width="3.5" marker-end="url(#pilbrun)"/>
  <!-- filtrat drypper ut -->
  <g stroke="#2471a3" stroke-width="2" marker-end="url(#pilbla)">
    <line x1="70" y1="232" x2="70" y2="250"/><line x1="120" y1="232" x2="120" y2="250"/>
    <line x1="170" y1="232" x2="170" y2="250"/><line x1="220" y1="232" x2="220" y2="250"/>
  </g>
  <rect x="50" y="254" width="220" height="10" fill="#d6e9f7" stroke="#2471a3" stroke-width="1.5"/>
  <line x1="270" y1="259" x2="305" y2="259" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="6" y="134">slam</text>
    <text x="6" y="149">inn</text>
    <text x="58" y="72">plater med filterduk</text>
    <text x="280" y="112" fill="#c0392b">presser</text>
    <text x="120" y="164" fill="#ffffff" font-weight="bold">kake</text>
    <text x="276" y="192">hydraulikk</text>
    <text x="236" y="284" fill="#2471a3">filtrat ut</text>
  </g>

  <line x1="336" y1="20" x2="336" y2="295" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== Vakuumtrommelfilter ===== -->
  <text x="350" y="24" font-size="15" font-weight="bold" fill="#1c2828">Vakuumtrommelfilter</text>
  <!-- trau med slam -->
  <rect x="380" y="214" width="220" height="56" fill="#e2d6c2"/>
  <polyline points="380,196 380,270 600,270 600,196" fill="none" stroke="#586868" stroke-width="3"/>
  <!-- trommel -->
  <circle cx="490" cy="180" r="75" fill="#e3e8e8" stroke="#586868" stroke-width="3"/>
  <!-- kake på trommelen -->
  <path d="M419,215 A79,79 0 1,1 566,160" fill="none" stroke="#b89a74" stroke-width="8"/>
  <!-- kniv -->
  <line x1="612" y1="146" x2="570" y2="162" stroke="#1c2828" stroke-width="4"/>
  <!-- kake faller -->
  <g fill="#b89a74" stroke="#7a5a35" stroke-width="1">
    <rect x="608" y="176" width="10" height="7" transform="rotate(20 613 179)"/>
    <rect x="614" y="196" width="9" height="7" transform="rotate(-15 618 199)"/>
  </g>
  <line x1="620" y1="210" x2="620" y2="238" stroke="#7a5a35" stroke-width="2.5" marker-end="url(#pilbrun)"/>
  <!-- filtrat ut gjennom akslingen -->
  <circle cx="490" cy="180" r="7" fill="#586868"/>
  <line x1="490" y1="180" x2="575" y2="72" stroke="#2471a3" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#pilbla)"/>
  <!-- rotasjon -->
  <path d="M440,99 A95,95 0 0,1 544,102" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#pilrod)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="440" y="86" fill="#c0392b">roterer</text>
    <text x="580" y="68" fill="#2471a3">filtrat ut</text>
    <text x="580" y="83" fill="#2471a3">(vakuum)</text>
    <text x="606" y="136">kniv</text>
    <text x="600" y="254">kake</text>
    <text x="600" y="269">ut</text>
    <text x="350" y="125">kaka</text>
    <text x="350" y="140">tørker</text>
    <text x="460" y="200">vakuum</text>
    <text x="460" y="215">inni</text>
    <text x="384" y="290">trau med slam: kaka bygges opp her</text>
  </g>
</svg>
