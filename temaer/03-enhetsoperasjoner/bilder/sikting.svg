<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" font-family="Segoe UI, Arial, sans-serif">
  <title>Til venstre en skrå vibrasjonssikt: små partikler faller gjennom hullene, store ruller av enden. Til høyre en siktesats på laben med fire sikter og bunnpanne.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <marker id="pilrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="310" rx="10" fill="#ffffff"/>

  <!-- ===== Vibrasjonssikt ===== -->
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#1c2828">Vibrasjonssikt</text>
  <!-- siktflate med hull -->
  <line x1="40" y1="90" x2="330" y2="190" stroke="#586868" stroke-width="6" stroke-dasharray="18 8"/>
  <!-- inn -->
  <line x1="22" y1="44" x2="52" y2="74" stroke="#1c2828" stroke-width="2.5" marker-end="url(#pil)"/>
  <!-- store partikler på sikten -->
  <g fill="#c9b79c" stroke="#7a6a55" stroke-width="1.5">
    <circle cx="116" cy="104" r="12"/>
    <circle cx="200" cy="133" r="11"/>
    <circle cx="280" cy="162" r="10"/>
  </g>
  <!-- små partikler som faller gjennom -->
  <g fill="#c9b79c" stroke="#7a6a55" stroke-width="1">
    <circle cx="100" cy="140" r="4"/><circle cx="138" cy="160" r="3.5"/><circle cx="172" cy="182" r="4"/>
    <circle cx="214" cy="178" r="3.5"/><circle cx="122" cy="196" r="3.5"/><circle cx="196" cy="208" r="4"/>
    <circle cx="246" cy="200" r="3.5"/>
  </g>
  <!-- bøtte for gjennomfall -->
  <path d="M70,228 L70,288 L270,288 L270,228" fill="none" stroke="#586868" stroke-width="2.5"/>
  <g fill="#c9b79c" stroke="#7a6a55" stroke-width="1">
    <circle cx="90" cy="281" r="4"/><circle cx="102" cy="282" r="3.5"/><circle cx="114" cy="281" r="4"/><circle cx="126" cy="282" r="3.5"/>
    <circle cx="138" cy="281" r="4"/><circle cx="150" cy="282" r="3.5"/><circle cx="162" cy="281" r="4"/><circle cx="174" cy="282" r="3.5"/>
    <circle cx="186" cy="281" r="4"/><circle cx="198" cy="282" r="3.5"/><circle cx="96" cy="273" r="3.5"/><circle cx="120" cy="273" r="4"/>
    <circle cx="144" cy="273" r="3.5"/><circle cx="168" cy="273" r="4"/>
  </g>
  <!-- sikterest -->
  <path d="M296,228 L296,288 L376,288 L376,228" fill="none" stroke="#586868" stroke-width="2.5"/>
  <g fill="#c9b79c" stroke="#7a6a55" stroke-width="1.5">
    <circle cx="318" cy="276" r="11"/><circle cx="344" cy="277" r="10"/>
  </g>
  <path d="M334,186 Q352,196 340,236" fill="none" stroke="#1c2828" stroke-width="2" marker-end="url(#pil)"/>
  <!-- vibrasjon -->
  <line x1="228" y1="140" x2="252" y2="90" stroke="#c0392b" stroke-width="2.5" marker-start="url(#pilrod)" marker-end="url(#pilrod)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="60" y="50">blanding inn</text>
    <text x="256" y="112" fill="#c0392b">sikten rister</text>
    <text x="40" y="186">små faller</text>
    <text x="40" y="201">gjennom</text>
    <text x="90" y="304">gjennomfall (fint)</text>
    <text x="292" y="304">sikterest</text>
    <text x="304" y="136">store ruller</text>
    <text x="304" y="151">av enden</text>
  </g>

  <line x1="400" y1="20" x2="400" y2="295" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== Siktesats ===== -->
  <text x="416" y="24" font-size="15" font-weight="bold" fill="#1c2828">Siktesats på laben</text>
  <!-- lokk -->
  <rect x="430" y="42" width="130" height="12" rx="3" fill="#9aa7a7" stroke="#586868" stroke-width="1.5"/>
  <g fill="#e3e8e8" stroke="#586868" stroke-width="2">
    <rect x="430" y="56" width="130" height="40"/>
    <rect x="430" y="98" width="130" height="40"/>
    <rect x="430" y="140" width="130" height="40"/>
    <rect x="430" y="182" width="130" height="40"/>
    <rect x="430" y="224" width="130" height="30"/>
  </g>
  <!-- siktduk i bunnen av hver sikt -->
  <g stroke="#1c2828" stroke-width="2" stroke-dasharray="4 3">
    <line x1="432" y1="94" x2="558" y2="94"/>
    <line x1="432" y1="136" x2="558" y2="136"/>
    <line x1="432" y1="178" x2="558" y2="178"/>
    <line x1="432" y1="220" x2="558" y2="220"/>
  </g>
  <!-- partikler: mindre og mindre nedover -->
  <g fill="#c9b79c" stroke="#7a6a55" stroke-width="1">
    <circle cx="470" cy="84" r="9"/><circle cx="500" cy="85" r="8"/>
    <circle cx="456" cy="129" r="6"/><circle cx="474" cy="130" r="5.5"/><circle cx="492" cy="129" r="6"/><circle cx="510" cy="130" r="5.5"/><circle cx="528" cy="129" r="6"/>
    <circle cx="452" cy="173" r="3.5"/><circle cx="464" cy="173" r="3.5"/><circle cx="476" cy="173" r="3.5"/><circle cx="488" cy="173" r="3.5"/><circle cx="500" cy="173" r="3.5"/><circle cx="512" cy="173" r="3.5"/><circle cx="524" cy="173" r="3.5"/><circle cx="536" cy="173" r="3.5"/>
    <circle cx="456" cy="216" r="2.2"/><circle cx="464" cy="216" r="2.2"/><circle cx="472" cy="216" r="2.2"/><circle cx="480" cy="216" r="2.2"/><circle cx="488" cy="216" r="2.2"/><circle cx="496" cy="216" r="2.2"/><circle cx="504" cy="216" r="2.2"/><circle cx="512" cy="216" r="2.2"/>
    <circle cx="460" cy="249" r="1.3"/><circle cx="466" cy="249" r="1.3"/><circle cx="472" cy="249" r="1.3"/><circle cx="478" cy="249" r="1.3"/><circle cx="484" cy="249" r="1.3"/><circle cx="490" cy="249" r="1.3"/>
  </g>
  <g font-size="12.5" fill="#1c2828">
    <text x="568" y="52">lokk</text>
    <text x="568" y="80">2 mm</text>
    <text x="568" y="122">1 mm</text>
    <text x="568" y="164">0,5 mm</text>
    <text x="568" y="206">0,25 mm</text>
    <text x="568" y="244">bunnpanne</text>
    <text x="430" y="276">Største hull øverst,</text>
    <text x="430" y="292">minste nederst</text>
  </g>
</svg>
