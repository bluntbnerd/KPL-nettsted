<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 395" width="620" height="395" font-family="Segoe UI, Arial, sans-serif">
  <title>Enkel destillasjon på laben: kolbe med blanding over en varmekilde, termometer i toppen, en skrå kjøler med kjølevann og en mottakerkolbe der destillatet samles.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker>
  </defs>
  <rect x="0" y="0" width="620" height="395" rx="10" fill="#ffffff"/>

  <!-- termometer -->
  <line x1="130" y1="38" x2="130" y2="126" stroke="#586868" stroke-width="4" stroke-linecap="round"/>
  <circle cx="130" cy="130" r="5" fill="#c0392b"/>

  <!-- hals og destillasjonshode -->
  <rect x="120" y="100" width="20" height="112" fill="none" stroke="#586868" stroke-width="2"/>

  <!-- kjøler: skrå, sidearm fra (140,125) -->
  <g transform="translate(140,125) rotate(19.44)">
    <rect x="50" y="-18" width="250" height="36" rx="6" fill="#d6eaf5" stroke="#2a6f97" stroke-width="2"/>
    <rect x="0" y="-5" width="362" height="10" fill="#ffffff" stroke="#586868" stroke-width="2"/>
    <!-- kjølevann inn nederst, ut øverst -->
    <line x1="280" y1="44" x2="280" y2="20" stroke="#2a6f97" stroke-width="3" marker-end="url(#pilbla)"/>
    <line x1="70" y1="-20" x2="70" y2="-44" stroke="#2a6f97" stroke-width="3" marker-end="url(#pilbla)"/>
    <!-- damp og dråper inne i røret -->
    <g fill="#2e7d6b">
      <circle cx="150" cy="0" r="2.5"/>
      <circle cx="210" cy="0" r="2.5"/>
      <circle cx="270" cy="0" r="2.5"/>
      <circle cx="330" cy="0" r="2.5"/>
    </g>
  </g>

  <!-- rør ned til mottakeren -->
  <rect x="473" y="244" width="14" height="56" fill="#ffffff" stroke="#586868" stroke-width="2"/>

  <!-- mottakerkolbe -->
  <path d="M470,290 L470,310 L440,370 L520,370 L490,310 L490,290" fill="#ffffff" stroke="#586868" stroke-width="2"/>
  <path d="M450,350 L440,370 L520,370 L510,350 Z" fill="#2e7d6b" opacity="0.55"/>
  <circle cx="480" cy="330" r="3" fill="#2e7d6b"/>

  <!-- rundkolbe med blanding -->
  <circle cx="130" cy="255" r="48" fill="#ffffff" stroke="#586868" stroke-width="2"/>
  <path d="M84.4,270 A48,48 0 0 0 175.6,270 Z" fill="#e3b04b" opacity="0.6"/>
  <g fill="#586868">
    <circle cx="115" cy="293" r="3"/>
    <circle cx="128" cy="296" r="3"/>
    <circle cx="142" cy="294" r="3"/>
  </g>
  <!-- damp opp i halsen -->
  <g stroke="#2e7d6b" stroke-width="2" fill="none" marker-end="url(#pil)">
    <line x1="124" y1="200" x2="124" y2="160"/>
  </g>

  <!-- varmekilde -->
  <path d="M68,280 Q68,307 130,307 Q192,307 192,280 L196,280 L196,345 L64,345 L64,280 Z" fill="#586868"/>

  <!-- tekster -->
  <g font-size="13" fill="#1c2828">
    <text x="146" y="48">termometer</text>
    <text x="146" y="180">damp</text>
    <text x="14" y="232">kolbe med</text>
    <text x="14" y="248">blanding</text>
    <text x="14" y="306">kokestein</text>
    <text x="130" y="366" text-anchor="middle">varmekilde (varmekappe)</text>
    <text x="300" y="235" text-anchor="middle" font-weight="bold">kjøler (kondensator)</text>
    <text x="530" y="324">mottaker</text>
    <text x="530" y="362" font-weight="bold">destillat</text>
  </g>
  <g font-size="12" fill="#2a6f97">
    <text x="391" y="278" text-anchor="middle">kjølevann inn</text>
    <text x="232" y="96" text-anchor="middle">kjølevann ut</text>
  </g>
  <!-- strek fra kokestein til kokesteinene -->
  <line x1="80" y1="301" x2="110" y2="294" stroke="#1c2828" stroke-width="1"/>
</svg>
