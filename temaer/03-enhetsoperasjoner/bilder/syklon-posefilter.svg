<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" font-family="Segoe UI, Arial, sans-serif">
  <title>Til venstre en syklon der gassen spinner nedover og støvet slynges mot veggen. Til høyre et posefilter der gassen går gjennom filterposer og støvet blir sittende utenpå.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="pilbrun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a5a35"/></marker>
    <marker id="pilrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="310" rx="10" fill="#ffffff"/>

  <!-- ===== Syklon ===== -->
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#1c2828">Syklon</text>
  <!-- kropp -->
  <polygon points="110,60 210,60 210,130 170,250 150,250 110,130" fill="#eef2f2" stroke="#586868" stroke-width="3"/>
  <!-- innløp på siden -->
  <rect x="40" y="62" width="72" height="26" fill="#eef2f2" stroke="#586868" stroke-width="2.5"/>
  <line x1="40" y1="62" x2="40" y2="88" stroke="#eef2f2" stroke-width="3"/>
  <line x1="14" y1="75" x2="100" y2="75" stroke="#7a5a35" stroke-width="2.5" marker-end="url(#pilbrun)"/>
  <!-- senterrør -->
  <rect x="146" y="34" width="28" height="78" fill="#ffffff" stroke="#586868" stroke-width="2.5"/>
  <!-- spiral nedover -->
  <polyline points="116,100 204,112 120,134 196,158 130,184 186,206 142,230 166,244" fill="none" stroke="#7a5a35" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#pilbrun)"/>
  <!-- ren gass opp i midten -->
  <line x1="160" y1="226" x2="160" y2="12" stroke="#2471a3" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#pilbla)"/>
  <!-- støv langs veggen -->
  <g fill="#7a5a35">
    <circle cx="207" cy="122" r="2"/><circle cx="198" cy="150" r="2"/><circle cx="189" cy="178" r="2"/>
    <circle cx="180" cy="205" r="2"/><circle cx="173" cy="230" r="2"/><circle cx="124" cy="160" r="2"/>
    <circle cx="134" cy="192" r="2"/><circle cx="145" cy="222" r="2"/>
  </g>
  <!-- støvutløp og beholder -->
  <rect x="150" y="250" width="20" height="18" fill="#eef2f2" stroke="#586868" stroke-width="2"/>
  <rect x="126" y="268" width="68" height="28" fill="#e2d6c2" stroke="#586868" stroke-width="2"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="12" y="104">gass med</text>
    <text x="12" y="119">støv inn</text>
    <text x="168" y="16" fill="#2471a3">ren gass ut</text>
    <text x="218" y="140">støvet slynges</text>
    <text x="218" y="155">mot veggen og</text>
    <text x="218" y="170">glir ned</text>
    <text x="218" y="210" fill="#2471a3">gassen snur og</text>
    <text x="218" y="225" fill="#2471a3">går opp i midten</text>
    <text x="200" y="287">støvbeholder</text>
  </g>

  <line x1="330" y1="20" x2="330" y2="295" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== Posefilter ===== -->
  <text x="344" y="24" font-size="15" font-weight="bold" fill="#1c2828">Posefilter</text>
  <!-- hus og trakt -->
  <polygon points="380,60 600,60 600,210 510,266 470,266 380,210" fill="#eef2f2" stroke="#586868" stroke-width="3"/>
  <line x1="380" y1="92" x2="600" y2="92" stroke="#586868" stroke-width="3"/>
  <!-- støv i trakta -->
  <polygon points="430,241 550,241 510,266 470,266" fill="#b89a74"/>
  <!-- poser med støvlag -->
  <g fill="#ffffff" stroke="#b89a74" stroke-width="4">
    <rect x="398" y="94" width="22" height="100" rx="8"/>
    <rect x="438" y="94" width="22" height="100" rx="8"/>
    <rect x="478" y="94" width="22" height="100" rx="8"/>
    <rect x="518" y="94" width="22" height="100" rx="8"/>
    <rect x="558" y="94" width="22" height="100" rx="8"/>
  </g>
  <!-- trykkluftrør og pulser -->
  <line x1="392" y1="74" x2="592" y2="74" stroke="#c0392b" stroke-width="3"/>
  <g stroke="#c0392b" stroke-width="2" marker-end="url(#pilrod)">
    <line x1="409" y1="76" x2="409" y2="104"/><line x1="449" y1="76" x2="449" y2="104"/>
    <line x1="489" y1="76" x2="489" y2="104"/><line x1="529" y1="76" x2="529" y2="104"/>
    <line x1="569" y1="76" x2="569" y2="104"/>
  </g>
  <!-- støvete gass inn, ren gass ut -->
  <line x1="338" y1="200" x2="388" y2="200" stroke="#7a5a35" stroke-width="2.5" marker-end="url(#pilbrun)"/>
  <line x1="600" y1="66" x2="644" y2="66" stroke="#2471a3" stroke-width="2.5" marker-end="url(#pilbla)"/>
  <!-- støv ut -->
  <line x1="490" y1="266" x2="490" y2="292" stroke="#7a5a35" stroke-width="2.5" marker-end="url(#pilbrun)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="338" y="225">støvete</text>
    <text x="338" y="240">gass inn</text>
    <text x="604" y="56" fill="#2471a3">ren gass</text>
    <text x="604" y="84" fill="#2471a3">ut</text>
    <text x="392" y="48" fill="#c0392b">trykkluft blåser støvet av</text>
    <text x="402" y="212">filterposer, støvet sitter utenpå</text>
    <text x="500" y="290">støv ut</text>
  </g>
</svg>
