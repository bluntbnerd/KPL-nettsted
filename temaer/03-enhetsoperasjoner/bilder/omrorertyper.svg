<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" width="660" height="310" font-family="Segoe UI, Arial, sans-serif">
  <title>Tre typer omrørere sett fra siden: propell med aksial strømning, flatbladet turbin med radial strømning og ankerrører tett inntil veggen.</title>
  <defs>
    <marker id="bp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c6ea6"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="310" rx="10" fill="#ffffff"/>

  <!-- ===== Propell ===== -->
  <g>
    <text x="110" y="24" font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">Propell</text>
    <text x="110" y="42" font-size="12" fill="#586868" text-anchor="middle">aksial strømning</text>
    <path d="M37,82 L183,82 L183,225 Q183,248 110,248 Q37,248 37,225 Z" fill="#bcd9ee"/>
    <path d="M35,62 L185,62 L185,225 Q185,250 110,250 Q35,250 35,225 Z" fill="none" stroke="#586868" stroke-width="2.5"/>
    <rect x="38" y="88" width="7" height="135" fill="#8a9a9a"/>
    <rect x="175" y="88" width="7" height="135" fill="#8a9a9a"/>
    <line x1="110" y1="52" x2="110" y2="200" stroke="#1c2828" stroke-width="3.5"/>
    <g stroke="#2c6ea6" stroke-width="2.2" fill="none" marker-end="url(#bp)">
      <path d="M98,212 C72,232 58,220 58,190 L58,120 C60,100 86,100 94,124 L98,182"/>
      <path d="M122,212 C148,232 162,220 162,190 L162,120 C160,100 134,100 126,124 L122,182"/>
    </g>
    <ellipse cx="96" cy="200" rx="15" ry="5" transform="rotate(-18 96 200)" fill="#1c2828"/>
    <ellipse cx="124" cy="200" rx="15" ry="5" transform="rotate(18 124 200)" fill="#1c2828"/>
    <circle cx="110" cy="200" r="4.5" fill="#1c2828"/>
    <text x="110" y="276" font-size="12" fill="#1c2828" text-anchor="middle">tynne væsker</text>
    <text x="110" y="292" font-size="12" fill="#1c2828" text-anchor="middle">høyt turtall</text>
  </g>

  <!-- ===== Flatbladet turbin ===== -->
  <g>
    <text x="330" y="24" font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">Flatbladet turbin</text>
    <text x="330" y="42" font-size="12" fill="#586868" text-anchor="middle">radial strømning</text>
    <path d="M257,82 L403,82 L403,225 Q403,248 330,248 Q257,248 257,225 Z" fill="#bcd9ee"/>
    <path d="M255,62 L405,62 L405,225 Q405,250 330,250 Q255,250 255,225 Z" fill="none" stroke="#586868" stroke-width="2.5"/>
    <rect x="258" y="88" width="7" height="135" fill="#8a9a9a"/>
    <rect x="395" y="88" width="7" height="135" fill="#8a9a9a"/>
    <line x1="330" y1="52" x2="330" y2="170" stroke="#1c2828" stroke-width="3.5"/>
    <g stroke="#2c6ea6" stroke-width="2.2" fill="none" marker-end="url(#bp)">
      <!-- venstre -->
      <path d="M298,170 L276,170 C270,150 272,112 290,110 C304,110 308,130 310,152"/>
      <path d="M298,174 L276,174 C270,194 272,230 290,232 C304,232 308,212 310,192"/>
      <!-- høyre -->
      <path d="M362,170 L384,170 C390,150 388,112 370,110 C356,110 352,130 350,152"/>
      <path d="M362,174 L384,174 C390,194 388,230 370,232 C356,232 352,212 350,192"/>
    </g>
    <line x1="306" y1="172" x2="354" y2="172" stroke="#1c2828" stroke-width="3.5"/>
    <rect x="302" y="162" width="7" height="20" fill="#1c2828"/>
    <rect x="351" y="162" width="7" height="20" fill="#1c2828"/>
    <circle cx="330" cy="172" r="4.5" fill="#1c2828"/>
    <text x="330" y="276" font-size="12" fill="#1c2828" text-anchor="middle">fordele gass i væske</text>
    <text x="330" y="292" font-size="12" fill="#1c2828" text-anchor="middle">kraftig omrøring ved bladene</text>
  </g>

  <!-- ===== Ankerrører ===== -->
  <g>
    <text x="550" y="24" font-size="14" font-weight="bold" fill="#1c2828" text-anchor="middle">Ankerrører</text>
    <text x="550" y="42" font-size="12" fill="#586868" text-anchor="middle">langs veggen, uten strømningsbrytere</text>
    <path d="M477,82 L623,82 L623,225 Q623,248 550,248 Q477,248 477,225 Z" fill="#d6c7a8"/>
    <path d="M475,62 L625,62 L625,225 Q625,250 550,250 Q475,250 475,225 Z" fill="none" stroke="#586868" stroke-width="2.5"/>
    <line x1="550" y1="52" x2="550" y2="238" stroke="#1c2828" stroke-width="3.5"/>
    <path d="M486,100 L486,222 Q486,240 550,240 Q614,240 614,222 L614,100" fill="none" stroke="#1c2828" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#2c6ea6" stroke-width="2.2" fill="none" marker-end="url(#bp)">
      <path d="M500,130 C530,118 570,118 598,130"/>
      <path d="M598,190 C570,202 530,202 502,190"/>
    </g>
    <text x="550" y="164" font-size="11.5" fill="#1c2828" text-anchor="middle">tyktflytende masse</text>
    <text x="550" y="276" font-size="12" fill="#1c2828" text-anchor="middle">tyktflytende væsker</text>
    <text x="550" y="292" font-size="12" fill="#1c2828" text-anchor="middle">lavt turtall, god varmeoverføring</text>
  </g>
</svg>
