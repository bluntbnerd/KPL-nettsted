<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" width="660" height="270" font-family="Segoe UI, Arial, sans-serif">
  <title>Slik finner du typen: Blir det nye stoffer? Ja gir kjemisk operasjon. Nei: Er det varme som gjør jobben? Ja gir termisk operasjon, nei gir mekanisk operasjon.</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2828"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="270" rx="10" fill="#ffffff"/>

  <!-- start -->
  <rect x="10" y="20" width="140" height="44" rx="22" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <text x="80" y="47" font-size="13.5" font-weight="bold" fill="#1c2828" text-anchor="middle">Et trinn i anlegget</text>

  <!-- spørsmål -->
  <g fill="#ffffff" stroke="#1c2828" stroke-width="2">
    <rect x="200" y="14" width="220" height="56" rx="6"/>
    <rect x="200" y="118" width="220" height="56" rx="6"/>
  </g>
  <g font-size="14" fill="#1c2828" text-anchor="middle">
    <text x="310" y="47">Blir det nye stoffer?</text>
    <text x="310" y="142">Er det varme som</text>
    <text x="310" y="160">gjør jobben?</text>
  </g>

  <!-- svar -->
  <rect x="490" y="14" width="160" height="56" rx="6" fill="#f6d7d2" stroke="#c0392b" stroke-width="2"/>
  <rect x="490" y="118" width="160" height="56" rx="6" fill="#fbe3c4" stroke="#b85c00" stroke-width="2"/>
  <rect x="230" y="208" width="160" height="56" rx="6" fill="#d6e6f5" stroke="#2c6ea6" stroke-width="2"/>
  <g font-size="15" font-weight="bold" fill="#1c2828" text-anchor="middle">
    <text x="570" y="38">Kjemisk</text>
    <text x="570" y="142">Termisk</text>
    <text x="310" y="232">Mekanisk</text>
  </g>
  <g font-size="12" fill="#1c2828" text-anchor="middle">
    <text x="570" y="58">reaktor, gjæring</text>
    <text x="570" y="162">destillasjon, tørking</text>
    <text x="310" y="252">pumping, filtrering</text>
  </g>

  <!-- piler -->
  <g stroke="#1c2828" stroke-width="2.5" fill="none" marker-end="url(#pil)">
    <line x1="150" y1="42" x2="198" y2="42"/>
    <line x1="420" y1="42" x2="488" y2="42"/>
    <line x1="310" y1="70" x2="310" y2="116"/>
    <line x1="420" y1="146" x2="488" y2="146"/>
    <line x1="310" y1="174" x2="310" y2="206"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#1c2828">
    <text x="440" y="35">ja</text>
    <text x="318" y="98">nei</text>
    <text x="440" y="139">ja</text>
    <text x="318" y="195">nei</text>
  </g>
</svg>
