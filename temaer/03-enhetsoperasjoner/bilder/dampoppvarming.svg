<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" font-family="Segoe UI, Arial, sans-serif">
  <title>Varmeveksler som varmes med damp. Kondensatet går ut gjennom en kondenspotte og tilbake til dampkjelen.</title>
  <defs>
    <marker id="dobla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="dorod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="dooransje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d35400"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="270" rx="10" fill="#ffffff"/>

  <!-- damp inn -->
  <polyline points="20,50 300,50 300,70" fill="none" stroke="#d35400" stroke-width="3" marker-end="url(#dooransje)"/>
  <text x="20" y="72" font-size="12.5" fill="#d35400">damp fra dampkjelen</text>
  <!-- reguleringsventil -->
  <path d="M128,40 L152,60 L152,40 L128,60 Z" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="140" y1="50" x2="140" y2="32" stroke="#1c2828" stroke-width="2"/>
  <rect x="130" y="24" width="20" height="9" fill="#e3e8e8" stroke="#1c2828" stroke-width="1.5"/>
  <text x="160" y="30" font-size="12" fill="#1c2828">reguleringsventil</text>

  <!-- varmeveksler -->
  <rect x="200" y="82" width="32" height="72" rx="10" fill="#cfe3f1" stroke="#586868" stroke-width="3"/>
  <rect x="448" y="82" width="32" height="72" rx="10" fill="#f6d5d1" stroke="#586868" stroke-width="3"/>
  <rect x="230" y="72" width="220" height="92" fill="#fdebd0" stroke="#586868" stroke-width="3"/>
  <g stroke-width="5">
    <line x1="230" y1="100" x2="450" y2="100" stroke="#7fb3d5"/>
    <line x1="230" y1="114" x2="450" y2="114" stroke="#a9a3c9"/>
    <line x1="230" y1="128" x2="450" y2="128" stroke="#c39bb1"/>
    <line x1="230" y1="142" x2="450" y2="142" stroke="#d98880"/>
  </g>
  <line x1="230" y1="72" x2="230" y2="164" stroke="#586868" stroke-width="5"/>
  <line x1="450" y1="72" x2="450" y2="164" stroke="#586868" stroke-width="5"/>
  <text x="340" y="90" font-size="11.5" text-anchor="middle" fill="#1c2828">damp kondenserer på rørene</text>
  <!-- kondensat i bunnen -->
  <rect x="233" y="152" width="214" height="10" fill="#cfe3f1"/>
  <g fill="#2471a3">
    <circle cx="270" cy="148" r="2"/><circle cx="310" cy="147" r="2"/><circle cx="350" cy="148" r="2"/><circle cx="390" cy="147" r="2"/><circle cx="425" cy="148" r="2"/>
  </g>

  <!-- produkt -->
  <line x1="130" y1="118" x2="198" y2="118" stroke="#2471a3" stroke-width="3" marker-end="url(#dobla)"/>
  <text x="18" y="122" font-size="12.5" fill="#2471a3">kaldt produkt</text>
  <line x1="482" y1="118" x2="540" y2="118" stroke="#c0392b" stroke-width="3" marker-end="url(#dorod)"/>
  <text x="484" y="106" font-size="12.5" fill="#c0392b">varmt produkt</text>

  <!-- kondenspotte og retur -->
  <line x1="400" y1="164" x2="400" y2="186" stroke="#2471a3" stroke-width="3"/>
  <rect x="380" y="186" width="40" height="26" rx="6" fill="#e3e8e8" stroke="#1c2828" stroke-width="2"/>
  <text x="430" y="204" font-size="12.5" font-weight="bold" fill="#1c2828">kondenspotte</text>
  <polyline points="400,212 400,236 40,236" fill="none" stroke="#2471a3" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#dobla)"/>
  <text x="40" y="258" font-size="12.5" fill="#2471a3">kondensat (varmt vann) tilbake til dampkjelen</text>
  <text x="430" y="226" font-size="11.5" fill="#1c2828">slipper ut vann, men ikke damp</text>
</svg>
