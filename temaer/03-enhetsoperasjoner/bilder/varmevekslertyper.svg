<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 570" width="660" height="570" font-family="Segoe UI, Arial, sans-serif">
  <title>Fire typer varmevekslere i snitt: dobbeltrørsvarmeveksler, rørkjelvarmeveksler, platevarmeveksler og luftkjøler.</title>
  <defs>
    <marker id="vvbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="vvrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="vvgra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d7e"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="570" rx="10" fill="#ffffff"/>
  <line x1="330" y1="14" x2="330" y2="556" stroke="#d8dede" stroke-width="1.5"/>
  <line x1="14" y1="280" x2="646" y2="280" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== 1 Dobbeltrørsvarmeveksler ===== -->
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#1c2828">Dobbeltrørsvarmeveksler</text>
  <rect x="52" y="62" width="16" height="30" fill="#cfe3f1" stroke="#586868" stroke-width="2"/>
  <rect x="262" y="62" width="16" height="30" fill="#cfe3f1" stroke="#586868" stroke-width="2"/>
  <rect x="40" y="90" width="250" height="60" fill="#cfe3f1" stroke="#586868" stroke-width="3"/>
  <rect x="20" y="108" width="290" height="24" fill="#f6d5d1" stroke="#586868" stroke-width="2"/>
  <line x1="28" y1="120" x2="302" y2="120" stroke="#c0392b" stroke-width="2.5" marker-end="url(#vvrod)"/>
  <line x1="250" y1="99" x2="90" y2="99" stroke="#2471a3" stroke-width="2.5" marker-end="url(#vvbla)"/>
  <line x1="250" y1="141" x2="90" y2="141" stroke="#2471a3" stroke-width="2.5" marker-end="url(#vvbla)"/>
  <line x1="270" y1="38" x2="270" y2="86" stroke="#2471a3" stroke-width="2.5" marker-end="url(#vvbla)"/>
  <line x1="60" y1="86" x2="60" y2="38" stroke="#2471a3" stroke-width="2.5" marker-end="url(#vvbla)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="70" y="50" fill="#2471a3">kald ut</text>
    <text x="262" y="50" fill="#2471a3" text-anchor="end">kald inn</text>
    <text x="20" y="170" fill="#c0392b">varm inn</text>
    <text x="310" y="170" fill="#c0392b" text-anchor="end">varm ut</text>
    <text x="165" y="206" text-anchor="middle">Ett rør inne i et annet. Den ene strømmen</text>
    <text x="165" y="222" text-anchor="middle">går i det indre røret, den andre i rommet</text>
    <text x="165" y="238" text-anchor="middle">utenpå. Enkel, men liten varmeflate.</text>
  </g>

  <!-- ===== 2 Rørkjelvarmeveksler ===== -->
  <text x="342" y="24" font-size="15" font-weight="bold" fill="#1c2828">Rørkjelvarmeveksler</text>
  <!-- stusser -->
  <rect x="357" y="72" width="16" height="30" fill="#f6d5d1" stroke="#586868" stroke-width="2"/>
  <rect x="607" y="178" width="16" height="30" fill="#f6d5d1" stroke="#586868" stroke-width="2"/>
  <rect x="567" y="68" width="16" height="30" fill="#cfe3f1" stroke="#586868" stroke-width="2"/>
  <rect x="397" y="182" width="16" height="30" fill="#cfe3f1" stroke="#586868" stroke-width="2"/>
  <!-- endekammer og kappe -->
  <rect x="350" y="100" width="34" height="80" rx="12" fill="#f6d5d1" stroke="#586868" stroke-width="3"/>
  <rect x="596" y="100" width="34" height="80" rx="12" fill="#f6d5d1" stroke="#586868" stroke-width="3"/>
  <rect x="380" y="95" width="220" height="90" fill="#cfe3f1" stroke="#586868" stroke-width="3"/>
  <!-- rørbunt -->
  <g stroke="#d98880" stroke-width="5">
    <line x1="380" y1="110" x2="600" y2="110"/>
    <line x1="380" y1="122" x2="600" y2="122"/>
    <line x1="380" y1="134" x2="600" y2="134"/>
    <line x1="380" y1="146" x2="600" y2="146"/>
    <line x1="380" y1="158" x2="600" y2="158"/>
    <line x1="380" y1="170" x2="600" y2="170"/>
  </g>
  <!-- rørplater -->
  <line x1="380" y1="95" x2="380" y2="185" stroke="#586868" stroke-width="6"/>
  <line x1="600" y1="95" x2="600" y2="185" stroke="#586868" stroke-width="6"/>
  <!-- ledeplater -->
  <g stroke="#1c2828" stroke-width="3.5">
    <line x1="435" y1="96" x2="435" y2="160"/>
    <line x1="490" y1="120" x2="490" y2="184"/>
    <line x1="545" y1="96" x2="545" y2="160"/>
  </g>
  <!-- kappesiden: sikk-sakk -->
  <path d="M575,44 L575,174 L518,174 L518,106 L462,106 L462,174 L405,174 L405,226" fill="none" stroke="#2471a3" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#vvbla)"/>
  <!-- rørsiden -->
  <line x1="365" y1="44" x2="365" y2="98" stroke="#c0392b" stroke-width="2.5" marker-end="url(#vvrod)"/>
  <line x1="615" y1="182" x2="615" y2="226" stroke="#c0392b" stroke-width="2.5" marker-end="url(#vvrod)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="373" y="50" fill="#c0392b">varm inn</text>
    <text x="567" y="50" fill="#2471a3" text-anchor="end">kald inn</text>
    <text x="490" y="88" text-anchor="middle">kappe</text>
    <text x="413" y="224" fill="#2471a3">kald ut</text>
    <text x="607" y="224" fill="#c0392b" text-anchor="end">varm ut</text>
    <text x="490" y="202" text-anchor="middle">ledeplate</text>
    <text x="490" y="248" text-anchor="middle">Mange rør (rørbunt) inne i en kappe.</text>
    <text x="490" y="264" text-anchor="middle">Ledeplatene styrer kappestrømmen på tvers.</text>
  </g>

  <!-- ===== 3 Platevarmeveksler ===== -->
  <text x="12" y="304" font-size="15" font-weight="bold" fill="#1c2828">Platevarmeveksler</text>
  <line x1="28" y1="328" x2="292" y2="328" stroke="#586868" stroke-width="3"/>
  <line x1="28" y1="502" x2="292" y2="502" stroke="#586868" stroke-width="3"/>
  <rect x="40" y="320" width="14" height="190" fill="#586868"/>
  <rect x="266" y="320" width="14" height="190" fill="#586868"/>
  <g>
    <rect x="54" y="335" width="26.5" height="160" fill="#f6d5d1"/>
    <rect x="80.5" y="335" width="26.5" height="160" fill="#cfe3f1"/>
    <rect x="107" y="335" width="26.5" height="160" fill="#f6d5d1"/>
    <rect x="133.5" y="335" width="26.5" height="160" fill="#cfe3f1"/>
    <rect x="160" y="335" width="26.5" height="160" fill="#f6d5d1"/>
    <rect x="186.5" y="335" width="26.5" height="160" fill="#cfe3f1"/>
    <rect x="213" y="335" width="26.5" height="160" fill="#f6d5d1"/>
    <rect x="239.5" y="335" width="26.5" height="160" fill="#cfe3f1"/>
  </g>
  <g stroke="#1c2828" stroke-width="2.5">
    <line x1="80.5" y1="335" x2="80.5" y2="495"/>
    <line x1="107" y1="335" x2="107" y2="495"/>
    <line x1="133.5" y1="335" x2="133.5" y2="495"/>
    <line x1="160" y1="335" x2="160" y2="495"/>
    <line x1="186.5" y1="335" x2="186.5" y2="495"/>
    <line x1="213" y1="335" x2="213" y2="495"/>
    <line x1="239.5" y1="335" x2="239.5" y2="495"/>
  </g>
  <g stroke="#c0392b" stroke-width="2.5">
    <line x1="67.25" y1="350" x2="67.25" y2="480" marker-end="url(#vvrod)"/>
    <line x1="120.25" y1="350" x2="120.25" y2="480" marker-end="url(#vvrod)"/>
    <line x1="173.25" y1="350" x2="173.25" y2="480" marker-end="url(#vvrod)"/>
    <line x1="226.25" y1="350" x2="226.25" y2="480" marker-end="url(#vvrod)"/>
  </g>
  <g stroke="#2471a3" stroke-width="2.5">
    <line x1="93.75" y1="480" x2="93.75" y2="350" marker-end="url(#vvbla)"/>
    <line x1="146.75" y1="480" x2="146.75" y2="350" marker-end="url(#vvbla)"/>
    <line x1="199.75" y1="480" x2="199.75" y2="350" marker-end="url(#vvbla)"/>
    <line x1="252.75" y1="480" x2="252.75" y2="350" marker-end="url(#vvbla)"/>
  </g>
  <g font-size="12.5" fill="#1c2828">
    <text x="165" y="522" text-anchor="middle"><tspan fill="#c0392b">varm ned</tspan>, <tspan fill="#2471a3">kald opp</tspan> i annenhver spalte</text>
    <text x="165" y="540" text-anchor="middle">Tynne plater med pakninger, presset</text>
    <text x="165" y="556" text-anchor="middle">sammen med bolter mellom to rammeplater.</text>
  </g>

  <!-- ===== 4 Luftkjøler ===== -->
  <text x="342" y="304" font-size="15" font-weight="bold" fill="#1c2828">Luftkjøler</text>
  <!-- luft ut på toppen -->
  <g stroke="#5d6d7e" stroke-width="2.5">
    <line x1="440" y1="328" x2="440" y2="308" marker-end="url(#vvgra)"/>
    <line x1="490" y1="328" x2="490" y2="308" marker-end="url(#vvgra)"/>
    <line x1="540" y1="328" x2="540" y2="308" marker-end="url(#vvgra)"/>
  </g>
  <!-- samlekammer -->
  <rect x="360" y="332" width="20" height="78" fill="#f6d5d1" stroke="#586868" stroke-width="2.5"/>
  <rect x="600" y="332" width="20" height="78" fill="#f6d5d1" stroke="#586868" stroke-width="2.5"/>
  <!-- ribberør -->
  <g stroke="#9aa8a8" stroke-width="18" stroke-dasharray="1.5 5">
    <line x1="382" y1="346" x2="598" y2="346"/>
    <line x1="382" y1="371" x2="598" y2="371"/>
    <line x1="382" y1="396" x2="598" y2="396"/>
  </g>
  <g stroke="#d98880" stroke-width="6">
    <line x1="380" y1="346" x2="600" y2="346"/>
    <line x1="380" y1="371" x2="600" y2="371"/>
    <line x1="380" y1="396" x2="600" y2="396"/>
  </g>
  <!-- viftehus og vifte -->
  <path d="M380,414 L600,414 L560,450 L420,450 Z" fill="none" stroke="#586868" stroke-width="2"/>
  <ellipse cx="490" cy="456" rx="70" ry="9" fill="#e3e8e8" stroke="#586868" stroke-width="2"/>
  <rect x="482" y="463" width="16" height="22" fill="#586868"/>
  <g stroke="#5d6d7e" stroke-width="2.5">
    <line x1="440" y1="500" x2="440" y2="470" marker-end="url(#vvgra)"/>
    <line x1="540" y1="500" x2="540" y2="470" marker-end="url(#vvgra)"/>
  </g>
  <!-- produkt inn og ut -->
  <line x1="336" y1="350" x2="357" y2="350" stroke="#c0392b" stroke-width="2.5" marker-end="url(#vvrod)"/>
  <line x1="622" y1="392" x2="648" y2="392" stroke="#c0392b" stroke-width="2.5" marker-end="url(#vvrod)"/>
  <g font-size="12.5" fill="#1c2828">
    <text x="338" y="330" fill="#c0392b">varm inn</text>
    <text x="648" y="426" fill="#c0392b" text-anchor="end">kaldere ut</text>
    <text x="566" y="460">vifte</text>
    <text x="550" y="498" fill="#5d6d7e">luft</text>
    <text x="490" y="530" text-anchor="middle">Produktet går i rør med ribber.</text>
    <text x="490" y="546" text-anchor="middle">En vifte blåser luft forbi. Trenger ikke kjølevann.</text>
  </g>
</svg>
