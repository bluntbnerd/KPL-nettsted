<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Segoe UI, Arial, sans-serif">
  <title>Inndamper med ett trinn: varmeflate med rør, dampseparator med dråpeutskiller og kondensator.</title>
  <defs>
    <marker id="idbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="idmork" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a5276"/></marker>
    <marker id="idrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="idoransje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d35400"/></marker>
    <marker id="idgra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d6d7e"/></marker>
  </defs>
  <rect x="0" y="0" width="600" height="320" rx="10" fill="#ffffff"/>

  <!-- dampseparator -->
  <path d="M100,150 L100,60 Q100,36 170,36 Q240,36 240,60 L240,150 Z" fill="#ffffff" stroke="#586868" stroke-width="3"/>
  <rect x="102" y="118" width="136" height="32" fill="#cfe3f1"/>
  <line x1="102" y1="118" x2="238" y2="118" stroke="#2471a3" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#2471a3" stroke-width="1">
    <circle cx="130" cy="132" r="3"/><circle cx="152" cy="126" r="2.5"/><circle cx="176" cy="136" r="3"/><circle cx="198" cy="128" r="2.5"/><circle cx="218" cy="138" r="3"/>
  </g>
  <!-- dråpeutskiller -->
  <rect x="104" y="62" width="132" height="12" fill="#d5dddd" stroke="#9aa8a8" stroke-width="1.5"/>
  <g stroke="#9aa8a8" stroke-width="1">
    <line x1="114" y1="62" x2="124" y2="74"/><line x1="134" y1="62" x2="144" y2="74"/><line x1="154" y1="62" x2="164" y2="74"/><line x1="174" y1="62" x2="184" y2="74"/><line x1="194" y1="62" x2="204" y2="74"/><line x1="214" y1="62" x2="224" y2="74"/>
  </g>
  <g font-size="12.5" fill="#1c2828">
    <text x="94" y="72" text-anchor="end">dråpeutskiller</text>
    <text x="94" y="104" text-anchor="end">dampseparator</text>
  </g>

  <!-- varmeflate (rør i kappe) -->
  <rect x="120" y="150" width="100" height="100" fill="#fdebd0" stroke="#586868" stroke-width="3"/>
  <g stroke="#7fb3d5" stroke-width="7">
    <line x1="134" y1="150" x2="134" y2="250"/>
    <line x1="152" y1="150" x2="152" y2="250"/>
    <line x1="170" y1="150" x2="170" y2="250"/>
    <line x1="188" y1="150" x2="188" y2="250"/>
    <line x1="206" y1="150" x2="206" y2="250"/>
  </g>
  <path d="M120,250 L220,250 L200,270 L140,270 Z" fill="#cfe3f1" stroke="#586868" stroke-width="3"/>
  <text x="228" y="204" font-size="12.5" fill="#1c2828">rør (varmeflate)</text>

  <!-- damp inn, kondensat ut -->
  <line x1="40" y1="175" x2="118" y2="175" stroke="#d35400" stroke-width="3" marker-end="url(#idoransje)"/>
  <text x="40" y="166" font-size="12.5" fill="#d35400">damp</text>
  <line x1="120" y1="238" x2="48" y2="238" stroke="#2471a3" stroke-width="3" marker-end="url(#idbla)"/>
  <text x="40" y="258" font-size="12.5" fill="#2471a3">kondensat</text>

  <!-- tynn løsning inn -->
  <line x1="330" y1="128" x2="242" y2="128" stroke="#2471a3" stroke-width="3" marker-end="url(#idbla)"/>
  <text x="250" y="146" font-size="12.5" fill="#2471a3">tynn løsning inn</text>

  <!-- konsentrat ut -->
  <polyline points="170,270 170,295 298,295" fill="none" stroke="#1a5276" stroke-width="3.5" marker-end="url(#idmork)"/>
  <text x="306" y="299" font-size="12.5" font-weight="bold" fill="#1a5276">konsentrat ut</text>

  <!-- vanndamp til kondensator -->
  <polyline points="170,36 170,14 400,14 400,28" fill="none" stroke="#d35400" stroke-width="3" marker-end="url(#idoransje)"/>
  <text x="252" y="32" font-size="12.5" fill="#d35400">vanndamp</text>

  <!-- kondensator -->
  <rect x="350" y="30" width="120" height="46" rx="8" fill="#fdebd0" stroke="#586868" stroke-width="2.5"/>
  <text x="410" y="58" font-size="12.5" text-anchor="middle" fill="#1c2828">kondensator</text>
  <line x1="510" y1="64" x2="474" y2="64" stroke="#2471a3" stroke-width="2.5" marker-end="url(#idbla)"/>
  <line x1="472" y1="42" x2="508" y2="42" stroke="#c0392b" stroke-width="2.5" marker-end="url(#idrod)"/>
  <text x="516" y="57" font-size="12.5" fill="#1c2828">kjølevann</text>
  <line x1="410" y1="76" x2="410" y2="118" stroke="#2471a3" stroke-width="3" marker-end="url(#idbla)"/>
  <text x="420" y="112" font-size="12.5" fill="#2471a3">kondensat (rent vann)</text>
  <line x1="364" y1="76" x2="364" y2="160" stroke="#5d6d7e" stroke-width="2.5" marker-end="url(#idgra)"/>
  <text x="354" y="178" font-size="12.5" fill="#5d6d7e">til vakuumpumpe</text>
</svg>
