<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>Til venstre et snitt gjennom en atmosfærisk lagertank i et oppsamlingskar, med innløp, lufting, overløp, høynivåvern, mannlokk, nivåmåler og utløp med bunnventil. Til høyre en liggende trykkbeholder med sikkerhetsventil og manometer.</title>
  <defs>
    <marker id="pilbla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
    <marker id="pilrod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect x="0" y="0" width="660" height="330" rx="10" fill="#ffffff"/>

  <!-- ===== Atmosfærisk lagertank ===== -->
  <text x="12" y="22" font-size="15" font-weight="bold" fill="#1c2828">Atmosfærisk lagertank (snitt)</text>

  <!-- oppsamlingskar -->
  <path d="M105,225 L105,295 L290,295 L290,225" fill="none" stroke="#586868" stroke-width="3"/>
  <!-- fundament -->
  <rect x="125" y="270" width="140" height="25" fill="#c8cfcf"/>
  <!-- tank -->
  <rect x="130" y="85" width="130" height="185" fill="#ffffff" stroke="#586868" stroke-width="3"/>
  <rect x="131.5" y="140" width="127" height="128.5" fill="#cfe3f1"/>
  <line x1="131.5" y1="140" x2="258.5" y2="140" stroke="#2471a3" stroke-width="1.5"/>
  <polygon points="130,85 195,62 260,85" fill="#e3e8e8" stroke="#586868" stroke-width="3" stroke-linejoin="round"/>

  <!-- innløp ovenfra -->
  <path d="M40,48 L165,48 L165,125" fill="none" stroke="#2471a3" stroke-width="5"/>
  <line x1="165" y1="110" x2="165" y2="132" stroke="#2471a3" stroke-width="2" marker-end="url(#pilbla)"/>
  <text x="12" y="44" font-size="12.5" fill="#1c2828">innløp</text>

  <!-- lufting -->
  <line x1="222" y1="72" x2="222" y2="44" stroke="#586868" stroke-width="5"/>
  <path d="M210,46 Q222,32 234,46 Z" fill="#586868"/>
  <line x1="238" y1="40" x2="296" y2="40" stroke="#586868" stroke-width="1"/>
  <text x="300" y="44" font-size="12.5" fill="#1c2828">lufting</text>

  <!-- overløp -->
  <path d="M260,105 L278,105 L278,212" fill="none" stroke="#586868" stroke-width="5"/>
  <line x1="278" y1="196" x2="278" y2="218" stroke="#2471a3" stroke-width="2" marker-end="url(#pilbla)"/>
  <line x1="282" y1="105" x2="296" y2="105" stroke="#586868" stroke-width="1"/>
  <text x="300" y="109" font-size="12.5" fill="#1c2828">overløp</text>

  <!-- høynivåvern -->
  <rect x="114" y="114" width="16" height="12" fill="#f3d36b" stroke="#586868" stroke-width="1.5"/>
  <line x1="100" y1="120" x2="112" y2="120" stroke="#586868" stroke-width="1"/>
  <text x="12" y="118" font-size="12.5" fill="#1c2828">høynivå-</text>
  <text x="12" y="132" font-size="12.5" fill="#1c2828">vern</text>

  <!-- mannlokk -->
  <rect x="118" y="180" width="12" height="24" fill="#a9b3b3" stroke="#586868" stroke-width="1.5"/>
  <line x1="78" y1="192" x2="116" y2="192" stroke="#586868" stroke-width="1"/>
  <text x="12" y="196" font-size="12.5" fill="#1c2828">mannlokk</text>

  <!-- nivåmåler -->
  <rect x="112" y="244" width="18" height="16" fill="#f3d36b" stroke="#586868" stroke-width="1.5"/>
  <line x1="92" y1="252" x2="110" y2="252" stroke="#586868" stroke-width="1"/>
  <text x="12" y="248" font-size="12.5" fill="#1c2828">nivåmåler</text>
  <text x="12" y="262" font-size="11.5" fill="#586868">(måler trykket)</text>

  <!-- utløp med bunnventil -->
  <line x1="260" y1="255" x2="372" y2="255" stroke="#2471a3" stroke-width="5"/>
  <path d="M268,247 L284,263 L284,247 L268,263 Z" fill="#ffffff" stroke="#1c2828" stroke-width="2"/>
  <line x1="340" y1="255" x2="375" y2="255" stroke="#2471a3" stroke-width="2" marker-end="url(#pilbla)"/>
  <text x="298" y="232" font-size="12.5" fill="#1c2828">utløp med</text>
  <text x="298" y="246" font-size="12.5" fill="#1c2828">bunnventil</text>

  <text x="197" y="316" font-size="12.5" fill="#1c2828" text-anchor="middle">oppsamlingskar</text>

  <line x1="388" y1="20" x2="388" y2="315" stroke="#d8dede" stroke-width="1.5"/>

  <!-- ===== Trykkbeholder ===== -->
  <text x="404" y="22" font-size="15" font-weight="bold" fill="#1c2828">Trykkbeholder (liggende)</text>

  <!-- sikkerhetsventil -->
  <line x1="480" y1="110" x2="480" y2="90" stroke="#586868" stroke-width="5"/>
  <rect x="472" y="74" width="16" height="16" fill="#e8b4ad" stroke="#c0392b" stroke-width="2"/>
  <line x1="480" y1="74" x2="480" y2="52" stroke="#c0392b" stroke-width="2" marker-end="url(#pilrod)"/>
  <text x="494" y="80" font-size="12.5" fill="#1c2828">sikkerhetsventil</text>
  <text x="494" y="62" font-size="11.5" fill="#c0392b">slipper ut ved for høyt trykk</text>

  <!-- manometer -->
  <line x1="570" y1="110" x2="570" y2="100" stroke="#586868" stroke-width="3"/>
  <circle cx="570" cy="91" r="9" fill="#ffffff" stroke="#586868" stroke-width="2"/>
  <line x1="570" y1="91" x2="575" y2="86" stroke="#c0392b" stroke-width="1.5"/>
  <text x="584" y="104" font-size="12.5" fill="#1c2828">manometer</text>

  <!-- beholder -->
  <path d="M445,110 L595,110 A22,35 0 0,1 595,180 L445,180 A22,35 0 0,1 445,110 Z" fill="#e3e8e8" stroke="#586868" stroke-width="3"/>
  <text x="520" y="150" font-size="12.5" fill="#1c2828" text-anchor="middle">gass under trykk</text>
  <!-- saler -->
  <rect x="463" y="180" width="18" height="30" fill="#a9b3b3"/>
  <rect x="559" y="180" width="18" height="30" fill="#a9b3b3"/>
  <line x1="410" y1="210" x2="640" y2="210" stroke="#586868" stroke-width="2"/>

  <g font-size="12.5" fill="#1c2828">
    <text x="404" y="242">Buede ender og runde former</text>
    <text x="404" y="258">fordeler trykket jevnt på veggen.</text>
    <text x="404" y="274">Derfor har trykkbeholdere sjelden</text>
    <text x="404" y="290">flat bunn og flatt tak.</text>
  </g>
</svg>
